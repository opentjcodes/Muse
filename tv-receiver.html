     


<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muse TV Receiver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --theme-r: 98;
            --theme-g: 120;
            --theme-b: 235;
            --theme-bright: rgb(165, 195, 255);
            --theme-glow: rgba(135, 165, 255, 0.45);
        }
        * {
            user-select: none;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #040508;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        #tv-ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 18% 22%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.38) 0%, transparent 56%),
                radial-gradient(circle at 82% 78%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25) 0%, transparent 60%),
                #040508;
            transition: background 0.8s ease;
        }
        .tv-glass {
            background: linear-gradient(145deg, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.14) 0%, rgba(8, 10, 18, 0.72) 100%);
            backdrop-filter: blur(26px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
        }
        .tv-btn {
            width: 64px;
            height: 64px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .tv-btn.tv-play-hero {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.55), rgba(10, 14, 26, 0.9));
            border-color: var(--theme-bright);
            box-shadow: 0 0 32px var(--theme-glow);
        }
        .tv-btn:focus, .tv-btn.dpad-focus {
            transform: scale(1.12);
            border-color: #ffffff;
            box-shadow: 0 0 36px var(--theme-bright);
        }
        #tv-lyrics-viewport {
            height: 76vh;
            overflow-y: auto;
            padding: 28vh 2rem;
            mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
        }
        #tv-lyrics-viewport::-webkit-scrollbar { display: none; }
        .tv-lyric-line {
            font-size: clamp(1.6rem, 2.8vw, 2.75rem);
            font-weight: 800;
            line-height: 1.32;
            margin: 1.35rem 0;
            color: rgba(255, 255, 255, 0.22);
            transform-origin: left center;
            transform: scale(0.94);
            opacity: 0.45;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
        }
        .tv-lyric-line.is-active {
            transform: scale(1.02);
            opacity: 1;
            color: rgba(255, 255, 255, 0.35);
        }
        .tv-lyric-word {
            display: inline-block;
            margin-right: 0.28em;
            --word-fill: 0%;
            background-image: linear-gradient(
                90deg,
                #ffffff 0%,
                var(--theme-bright) calc(var(--word-fill) * 0.9),
                rgba(255, 255, 255, 0.28) var(--word-fill),
                rgba(255, 255, 255, 0.28) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tv-lyric-line:not(.is-active) .tv-lyric-word {
            background-image: none;
            -webkit-text-fill-color: currentColor;
        }
    </style>
</head>
<body>
    <div id="tv-ambient-bg"></div>
    <audio id="tv-audio" preload="auto" autoplay></audio>

    <!-- Dynamic Volume Pop-up HUD on TV when controlled from Phone -->
    <div id="tv-vol-toast" class="fixed top-8 right-10 z-50 tv-glass rounded-full px-5 py-2.5 flex items-center gap-3 opacity-0 transition-opacity duration-300 pointer-events-none">
        <i class="fa-solid fa-volume-high text-sm" style="color: var(--theme-bright)"></i>
        <div class="w-28 h-2 rounded-full bg-white/15 overflow-hidden">
            <div id="tv-vol-toast-bar" class="h-full bg-white rounded-full" style="width: 85%"></div>
        </div>
        <span id="tv-vol-toast-text" class="text-xs font-extrabold tabular-nums">85%</span>
    </div>

    <div class="relative z-10 w-full h-full grid grid-cols-12 items-center px-12 gap-10">
        <!-- Left Column: Cover Art, Track Metadata & ONLY the 3 Minimal Controls (Back, Play/Pause, Next) -->
        <div class="col-span-5 flex flex-col items-center text-center">
            <div class="w-[34vh] h-[34vh] max-w-[360px] max-h-[360px] rounded-[2.2rem] overflow-hidden tv-glass mb-7">
                <img id="tv-cover" src="" class="w-full h-full object-cover">
            </div>
            <h1 id="tv-title" class="text-2xl lg:text-4xl font-extrabold tracking-tight truncate max-w-md">Muse TV</h1>
            <p id="tv-artist" class="text-base lg:text-lg font-semibold text-white/65 truncate max-w-md mt-1.5">Connected — Use phone for full control</p>

            <!-- Strictly 3 Controls on TV: Previous, Play/Pause, Next -->
            <div class="flex items-center justify-center gap-7 mt-8" id="tv-three-controls">
                <button type="button" id="tv-btn-prev" tabindex="0" class="tv-btn" title="Previous">
                    <i class="fa-solid fa-backward-step text-xl"></i>
                </button>
                <button type="button" id="tv-btn-play" tabindex="0" class="tv-btn tv-play-hero dpad-focus" title="Play / Pause">
                    <i id="tv-play-icon" class="fa-solid fa-pause text-2xl"></i>
                </button>
                <button type="button" id="tv-btn-next" tabindex="0" class="tv-btn" title="Next">
                    <i class="fa-solid fa-forward-step text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Right Column: Real-Time Word-by-Word Lyrics Stage -->
        <div class="col-span-7">
            <div id="tv-lyrics-viewport">
                <div id="tv-lyrics-list" class="flex flex-col">
                    <div class="tv-lyric-line is-active" style="-webkit-text-fill-color: rgba(255,255,255,0.6);">Ready to stream with word-by-word lyrics...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tvAudio = document.getElementById("tv-audio");
        const tvCover = document.getElementById("tv-cover");
        const tvTitle = document.getElementById("tv-title");
        const tvArtist = document.getElementById("tv-artist");
        const tvPlayIcon = document.getElementById("tv-play-icon");
        const tvLyricsViewport = document.getElementById("tv-lyrics-viewport");
        const tvLyricsList = document.getElementById("tv-lyrics-list");
        const tvVolToast = document.getElementById("tv-vol-toast");
        const tvVolToastBar = document.getElementById("tv-vol-toast-bar");
        const tvVolToastText = document.getElementById("tv-vol-toast-text");

        let lyricsTimeline = [];
        let activeLineIdx = -1;
        let volToastTimer = null;
        let activeConnections = [];
        const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("muse_tv_cast_channel_v1") : null;

        function sendToController(payload) {
            const str = JSON.stringify(payload);
            activeConnections.forEach(conn => {
                try { if (conn.state === "connected") conn.send(str); } catch (e) {}
            });
            if (bc) {
                try { bc.postMessage(payload); } catch (e) {}
            }
        }

        function applyTVTheme(rgb) {
            if (!rgb) return;
            const r = rgb.r || 98, g = rgb.g || 120, b = rgb.b || 235;
            const root = document.documentElement.style;
            root.setProperty("--theme-r", r);
            root.setProperty("--theme-g", g);
            root.setProperty("--theme-b", b);
            root.setProperty("--theme-bright", `rgb(${Math.min(255, r + 55)}, ${Math.min(255, g + 55)}, ${Math.min(255, b + 55)})`);
        }

        function showVolumeToast(vol) {
            const pct = Math.round(vol * 100);
            tvVolToastBar.style.width = `${pct}%`;
            tvVolToastText.innerText = `${pct}%`;
            tvVolToast.style.opacity = "1";
            clearTimeout(volToastTimer);
            volToastTimer = setTimeout(() => {
                tvVolToast.style.opacity = "0";
            }, 1800);
        }

        function renderTVLyrics(timeline) {
            lyricsTimeline = Array.isArray(timeline) ? timeline : [];
            activeLineIdx = -1;
            tvLyricsList.innerHTML = "";

            if (!lyricsTimeline.length) {
                tvLyricsList.innerHTML = `<div class="tv-lyric-line is-active" style="-webkit-text-fill-color: rgba(255,255,255,0.45);">♪ Instrumental / Lyrics Syncing...</div>`;
                return;
            }

            const frag = document.createDocumentFragment();
            lyricsTimeline.forEach((line, idx) => {
                const div = document.createElement("div");
                div.className = "tv-lyric-line";
                div.dataset.idx = idx;

                if (Array.isArray(line.words) && line.words.length > 0 && !line.plainOnly) {
                    line.words.forEach((w) => {
                        const span = document.createElement("span");
                        span.className = "tv-lyric-word";
                        span.textContent = w.word;
                        div.appendChild(span);
                    });
                } else {
                    div.textContent = line.text;
                }
                frag.appendChild(div);
            });
            tvLyricsList.appendChild(frag);
        }

        function syncTVLyricsFrame() {
            if (!tvAudio.paused && lyricsTimeline.length > 0) {
                const t = tvAudio.currentTime || 0;
                let matched = 0;
                for (let i = 0; i < lyricsTimeline.length; i++) {
                    const l = lyricsTimeline[i];
                    const nxt = lyricsTimeline[i + 1];
                    const end = nxt ? nxt.time : (l.endTime + 10);
                    if (t >= l.time && t < end) {
                        matched = i;
                        break;
                    }
                }
                const nodes = tvLyricsList.children;
                if (matched !== activeLineIdx) {
                    activeLineIdx = matched;
                    for (let i = 0; i < nodes.length; i++) {
                        nodes[i].classList.toggle("is-active", i === activeLineIdx);
                    }
                    const activeNode = nodes[activeLineIdx];
                    if (activeNode) {
                        const boxRect = tvLyricsViewport.getBoundingClientRect();
                        const lineRect = activeNode.getBoundingClientRect();
                        const offset = (lineRect.top - boxRect.top) - (boxRect.height * 0.38) + (lineRect.height * 0.5);
                        tvLyricsViewport.scrollBy({ top: offset, behavior: "smooth" });
                    }
                }
                const activeLine = lyricsTimeline[activeLineIdx];
                const activeEl = nodes[activeLineIdx];
                if (activeLine && Array.isArray(activeLine.words) && activeEl) {
                    const spans = activeEl.children;
                    for (let w = 0; w < spans.length; w++) {
                        const wm = activeLine.words[w];
                        const sp = spans[w];
                        if (!wm || !sp) continue;
                        let pct = 0;
                        if (t >= wm.endTime) pct = 100;
                        else if (t > wm.time) pct = ((t - wm.time) / Math.max(0.05, wm.endTime - wm.time)) * 100;
                        sp.style.setProperty("--word-fill", `${pct.toFixed(1)}%`);
                    }
                }
            }
            requestAnimationFrame(syncTVLyricsFrame);
        }
        requestAnimationFrame(syncTVLyricsFrame);

        function handleControllerMessage(msg) {
            if (!msg || typeof msg !== "object") return;

            if (msg.type === "LOAD_TRACK" && msg.track) {
                tvTitle.innerText = msg.track.title || "Muse";
                tvArtist.innerText = msg.track.artist || "";
                tvCover.src = msg.track.coverUrl || "";
                applyTVTheme(msg.themeRGB);
                renderTVLyrics(msg.lyricsTimeline);

                if (typeof msg.volume === "number") {
                    tvAudio.volume = Math.max(0, Math.min(1, msg.volume));
                }
                if (msg.track.streamUrl) {
                    tvAudio.src = msg.track.streamUrl;
                    tvAudio.currentTime = Number(msg.startTime) || 0;
                    tvAudio.play().catch(() => {});
                }
            } else if (msg.type === "LYRICS_AND_THEME_SYNC") {
                applyTVTheme(msg.themeRGB);
                renderTVLyrics(msg.lyricsTimeline);
            } else if (msg.type === "PLAY") {
                tvAudio.play().catch(() => {});
            } else if (msg.type === "PAUSE") {
                tvAudio.pause();
            } else if (msg.type === "SEEK") {
                tvAudio.currentTime = Number(msg.time) || 0;
            } else if (msg.type === "SET_VOLUME") {
                const v = Math.max(0, Math.min(1, Number(msg.volume) || 0));
                tvAudio.volume = v;
                tvAudio.muted = Boolean(msg.muted);
                showVolumeToast(v);
            } else if (msg.type === "TERMINATE") {
                tvAudio.pause();
                window.close();
            }
        }

        // Bind W3C Presentation Receiver API
        if (navigator.presentation && navigator.presentation.receiver) {
            navigator.presentation.receiver.connectionList.then((list) => {
                const bindConn = (conn) => {
                    activeConnections.push(conn);
                    conn.onmessage = (ev) => {
                        try { handleControllerMessage(JSON.parse(ev.data)); } catch (e) {}
                    };
                    sendToController({ type: "TV_READY" });
                };
                list.connections.forEach(bindConn);
                list.onconnectionavailable = (ev) => bindConn(ev.connection);
            }).catch(() => {});
        }

        if (bc) {
            bc.onmessage = (ev) => handleControllerMessage(ev.data);
            sendToController({ type: "TV_READY" });
        }

        tvAudio.addEventListener("timeupdate", () => {
            sendToController({
                type: "TV_TIME_UPDATE",
                currentTime: tvAudio.currentTime || 0,
                duration: tvAudio.duration || 0,
                isPlaying: !tvAudio.paused
            });
        });

        tvAudio.addEventListener("play", () => {
            tvPlayIcon.className = "fa-solid fa-pause text-2xl";
            sendToController({ type: "TV_STATE_CHANGE", isPlaying: true });
        });

        tvAudio.addEventListener("pause", () => {
            tvPlayIcon.className = "fa-solid fa-play text-2xl ml-1";
            sendToController({ type: "TV_STATE_CHANGE", isPlaying: false });
        });

        tvAudio.addEventListener("ended", () => {
            sendToController({ type: "TV_TRACK_ENDED" });
        });

        // 3 Minimal TV Controls + TV Remote D-Pad Navigation
        const btns = [
            document.getElementById("tv-btn-prev"),
            document.getElementById("tv-btn-play"),
            document.getElementById("tv-btn-next")
        ];
        let focusedIdx = 1;

        function updateDpadFocus(idx) {
            focusedIdx = (idx + btns.length) % btns.length;
            btns.forEach((b, i) => b.classList.toggle("dpad-focus", i === focusedIdx));
            btns[focusedIdx].focus();
        }

        btns[0].onclick = () => sendToController({ type: "TV_COMMAND", action: "PREV" });
        btns[1].onclick = () => {
            if (tvAudio.paused) tvAudio.play().catch(() => {});
            else tvAudio.pause();
        };
        btns[2].onclick = () => sendToController({ type: "TV_COMMAND", action: "NEXT" });

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") {
                e.preventDefault();
                updateDpadFocus(focusedIdx - 1);
            } else if (e.key === "ArrowRight") {
                e.preventDefault();
                updateDpadFocus(focusedIdx + 1);
            } else if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                btns[focusedIdx]?.click();
            } else if (e.key === "MediaPlayPause") {
                btns[1]?.click();
            } else if (e.key === "MediaTrackNext") {
                btns[2]?.click();
            } else if (e.key === "MediaTrackPrevious") {
                btns[0]?.click();
            }
        });
    </script>
</body>
</html>
