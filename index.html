<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#040508">
    <title>Muse — Museum of Musics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        metal: {
                            950: '#030305',
                            900: '#08090c',
                            800: '#121318',
                            700: '#1f2128',
                            400: '#8b949e',
                            200: '#e2e8f0',
                            100: '#ffffff',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --app-bg: #040508;
            --theme-r: 108;
            --theme-g: 125;
            --theme-b: 215;
            --theme-dark-r: 16;
            --theme-dark-g: 20;
            --theme-dark-b: 38;
            --theme-bright-r: 195;
            --theme-bright-g: 215;
            --theme-bright-b: 255;
            --theme-color: rgb(108, 125, 215);
            --theme-color-bright: rgb(195, 215, 255);
            --theme-color-dim: rgba(108, 125, 215, 0.18);
            --theme-color-light: rgba(108, 125, 215, 0.38);
            --theme-color-glow: rgba(165, 190, 255, 0.54);
            --muse-base-stop: 18%;
            --muse-mid-stop: 56%;
            --muse-white-peak: 86%;
            --muse-glow-alpha: 0.34;
            --muse-glow-spread: 16px;
            --spring-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input[type="text"], input[type="search"], textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        img, audio {
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        body {
            height: 100dvh;
            width: 100vw;
            background-color: var(--app-bg);
            color: #e2e8f0;
            overflow: hidden;
            touch-action: pan-y;
            transition: background-color 0.7s ease;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        #ambient-stage {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 12%, rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.24) 0%, transparent 46%),
                radial-gradient(circle at 82% 16%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.28) 0%, transparent 52%),
                radial-gradient(circle at 78% 84%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.18) 0%, transparent 55%),
                radial-gradient(circle at 18% 82%, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.94) 0%, transparent 65%);
            transform: translate3d(0, 0, 0);
            transition: background 0.8s ease;
            contain: strict;
        }

        #app-shell {
            position: relative;
            z-index: 10;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        #top-brand-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 35;
            padding: 0.7rem 1rem 0.65rem 1rem;
            background: linear-gradient(to bottom, rgba(4, 5, 8, 0.94) 0%, rgba(4, 5, 8, 0.68) 72%, transparent 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            pointer-events: none;
        }

        @media (min-width: 640px) {
            #top-brand-bar {
                padding: 0.85rem 2rem 0.75rem 2rem;
            }
        }

        /* Bottom Dock & Mini-Player Legibility Shield */
        #bottom-dock-shield {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 168px;
            z-index: 36;
            pointer-events: none;
            background: linear-gradient(
                to top,
                rgba(3, 4, 7, 0.97) 0%,
                rgba(4, 5, 9, 0.88) 48%,
                rgba(4, 5, 9, 0.45) 78%,
                transparent 100%
            );
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            mask-image: linear-gradient(to top, black 0%, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 60%, transparent 100%);
        }

        .liquid-glass {
            background:
                linear-gradient(
                    135deg,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.18) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.26) 42%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.84) 84%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.24) 100%
                );
            backdrop-filter: blur(24px) saturate(195%);
            -webkit-backdrop-filter: blur(24px) saturate(195%);
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.32);
            box-shadow:
                0 18px 40px -10px rgba(0, 0, 0, 0.78),
                0 4px 20px -6px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.28),
                inset 0 1px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.44),
                inset 0 -1px 1px 0 rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.18);
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        .liquid-control-btn {
            position: relative;
            background:
                radial-gradient(
                    120% 120% at 25% 15%,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.28) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.24) 50%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.65) 100%
                );
            backdrop-filter: blur(16px) saturate(185%);
            -webkit-backdrop-filter: blur(16px) saturate(185%);
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.34);
            box-shadow:
                0 8px 22px -6px rgba(0, 0, 0, 0.58),
                0 2px 14px -4px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.26),
                inset 0 1px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.48),
                inset 0 -1px 1.5px 0 rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.22);
            color: #ffffff;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            will-change: transform;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .liquid-control-btn.is-pressed {
            background:
                radial-gradient(
                    115% 115% at 50% 50%,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.46) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.40) 60%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.62) 100%
                );
            border-color: var(--theme-color-bright);
        }

        .liquid-hero-play {
            background:
                linear-gradient(
                    135deg,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.48) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.46) 52%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.66) 100%
                );
            border: 1.2px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.58);
            box-shadow:
                0 14px 34px -8px rgba(0, 0, 0, 0.72),
                0 0 30px -6px var(--theme-color-glow),
                inset 0 1.5px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.70);
            color: #ffffff;
        }

        .pill-active {
            border-color: var(--theme-color-bright) !important;
            background: linear-gradient(135deg, rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.40) 0%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.52) 100%) !important;
            color: #ffffff !important;
            box-shadow: 0 0 20px -4px var(--theme-color-glow);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #initial-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(circle at 50% 35%, #13182c 0%, #030305 72%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.65s var(--spring-smooth), opacity 0.52s ease;
            overflow: hidden;
        }

        .cinematic-intro {
            animation: cinematicScale 1s var(--spring-smooth) forwards;
            opacity: 0;
            transform: scale(0.92) translateY(8px);
            letter-spacing: -0.06em;
        }

        .cinematic-fade {
            animation: fadeIn 0.82s var(--spring-smooth) 0.16s forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        .loader-bar-track {
            width: 136px;
            height: 3px;
            background: rgba(255, 255, 255, 0.09);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 1.8rem;
            position: relative;
        }

        .loader-bar-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--theme-color-bright), #ffffff, transparent);
            animation: loaderSweep 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes loaderSweep {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(280%); }
        }

        @keyframes cinematicScale {
            0% { opacity: 0; transform: scale(0.9) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Real-Time Base-to-White Rising Audio-Reactive Gradient for MUSE Logo */
        .muse-dynamic-brand {
            display: inline-block;
            background-image: linear-gradient(
                0deg,
                rgb(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b)) 0%,
                var(--theme-color) var(--muse-base-stop, 18%),
                var(--theme-color-bright) var(--muse-mid-stop, 56%),
                #ffffff var(--muse-white-peak, 86%),
                #ffffff 100%
            );
            background-size: 100% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 -2px var(--muse-glow-spread, 16px) rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), var(--muse-glow-alpha, 0.34)));
            will-change: filter;
        }

        #main-scroll-view {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            will-change: scroll-position;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.22); border-radius: 10px; }

        /* Leading-Item Focus Horizontal Carousels */
        .focal-carousel-track {
            scroll-snap-type: x proximity;
            scroll-padding-left: 0.5rem;
            padding-top: 0.7rem;
            padding-bottom: 0.95rem;
            padding-left: 0.35rem;
            padding-right: 32vw;
            align-items: center;
        }

        .focal-carousel-card {
            scroll-snap-align: start;
            transform-origin: left center;
            will-change: transform, opacity;
            transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.14s ease;
            backface-visibility: hidden;
        }

        .focal-carousel-card.is-leading-focus .card-image-wrapper {
            border-color: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.65);
            box-shadow:
                0 20px 42px -10px rgba(0, 0, 0, 0.82),
                0 0 28px -6px var(--theme-color-glow);
        }

        .scrubber-container {
            position: relative;
            padding: 16px 0;
            margin: -10px 0;
            touch-action: none;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5.5px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 99px;
            outline: none;
            background-image: linear-gradient(90deg, var(--theme-color) 0%, var(--theme-color-bright) 58%, #ffffff 100%);
            background-size: var(--progress, 0%) 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            pointer-events: none;
            transition: height 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.55);
        }

        .scrubber-container.scrubbing input[type="range"] {
            height: 13px;
            box-shadow:
                0 0 22px var(--theme-color-glow),
                0 0 0 1px var(--theme-color-bright);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 0px;
            height: 0px;
            background: transparent;
        }

        input[type="range"]::-moz-range-thumb {
            width: 0px;
            height: 0px;
            border: none;
            background: transparent;
        }

        #fullscreen-player {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.15rem 1.35rem;
            overflow: hidden;
            touch-action: none;
            pointer-events: auto;
            contain: layout style;
        }

        @media (min-width: 768px) {
            #fullscreen-player {
                padding: 1.8rem 2.75rem;
            }
        }

        #fullscreen-player.closed {
            display: none !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        #fullscreen-backdrop-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-color: #040508;
            background-image:
                radial-gradient(circle at 24% 18%, rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.42) 0%, transparent 52%),
                radial-gradient(circle at 78% 26%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.58) 0%, transparent 58%),
                radial-gradient(circle at 50% 62%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.36) 0%, transparent 65%),
                linear-gradient(180deg, rgb(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b)) 0%, #05060a 68%, #030407 100%);
            will-change: opacity;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #fullscreen-ambient-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 34%, transparent 0%, rgba(4, 5, 9, 0.42) 62%, rgba(3, 4, 7, 0.88) 100%),
                linear-gradient(to bottom, rgba(4, 5, 9, 0.18) 0%, rgba(4, 5, 9, 0.52) 62%, rgba(3, 4, 7, 0.94) 100%);
            pointer-events: none;
        }

        #swipe-area {
            perspective: 1000px;
            overflow: visible;
            z-index: 20;
            position: relative;
        }

        .reel-cover-card {
            border-radius: 34px;
            box-shadow:
                0 26px 65px -12px var(--theme-color-glow),
                0 16px 38px -8px rgba(0, 0, 0, 0.85);
            will-change: transform, border-radius, opacity;
            transform-origin: center center;
            overflow: hidden;
            background: #08090c;
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.34);
            backface-visibility: hidden;
        }

        #full-cover-outgoing {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            z-index: 19;
        }

        #full-cover-wrapper {
            position: relative;
            z-index: 20;
        }

        #full-cover-wrapper.swipe-threshold-ready {
            box-shadow:
                0 0 50px 4px var(--theme-color-bright),
                0 22px 60px rgba(0, 0, 0, 0.85) !important;
            border-color: var(--theme-color-bright);
        }

        #double-tap-heart-overlay {
            position: absolute;
            inset: 0;
            z-index: 35;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .heart-burst-node {
            position: relative;
            width: 138px;
            height: 138px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale3d(0, 0, 1);
            opacity: 0;
            will-change: transform, opacity;
        }

        .heart-burst-ring {
            position: absolute;
            inset: -12px;
            border-radius: 9999px;
            border: 2.5px solid var(--theme-color-bright);
            opacity: 0;
            transform: scale3d(0.4, 0.4, 1);
            box-shadow: 0 0 32px var(--theme-color-glow);
            will-change: transform, opacity;
        }

        .heart-burst-node.animate-burst {
            animation: heartPopKeyframes 0.78s cubic-bezier(0.18, 1.25, 0.32, 1) forwards;
        }

        .heart-burst-node.animate-burst .heart-burst-ring {
            animation: heartRingKeyframes 0.72s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heartPopKeyframes {
            0% { opacity: 0; transform: scale3d(0.2, 0.2, 1) rotate(-10deg); }
            28% { opacity: 1; transform: scale3d(1.16, 1.16, 1) rotate(4deg); }
            48% { opacity: 1; transform: scale3d(0.95, 0.95, 1) rotate(-2deg); }
            68% { opacity: 1; transform: scale3d(1.03, 1.03, 1) rotate(0deg); }
            100% { opacity: 0; transform: scale3d(0, 0, 1) translateY(-16px); }
        }

        @keyframes heartRingKeyframes {
            0% { opacity: 0.9; transform: scale3d(0.45, 0.45, 1); }
            100% { opacity: 0; transform: scale3d(1.75, 1.75, 1); }
        }

        #apple-lyrics-stage {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translate3d(80px, 0, 0) scale(0.95);
            will-change: transform, opacity;
        }

        #apple-lyrics-stage.lyrics-interactive {
            pointer-events: auto;
        }

        #lyrics-scroll-box {
            height: 100%;
            max-height: 54dvh;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18dvh 1.15rem;
            touch-action: pan-y;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        #lyrics-scroll-box::-webkit-scrollbar { display: none; }

        .apple-lyric-line {
            font-size: clamp(1.30rem, 4.1vw, 1.98rem);
            font-weight: 800;
            line-height: 1.34;
            letter-spacing: -0.024em;
            margin: 1.05rem 0;
            color: rgba(255, 255, 255, 0.25);
            transform-origin: left center;
            transform: scale3d(0.94, 0.94, 1);
            opacity: 0.56;
            transition: transform 0.32s var(--spring-smooth), opacity 0.28s ease, color 0.28s ease;
            cursor: pointer;
            will-change: transform, opacity;
            word-break: break-word;
        }

        .apple-lyric-line.is-past {
            color: rgba(255, 255, 255, 0.22);
            transform: scale3d(0.93, 0.93, 1);
            opacity: 0.38;
        }

        .apple-lyric-line.is-active {
            transform: scale3d(1.015, 1.015, 1);
            opacity: 1;
            color: rgba(255, 255, 255, 0.36);
        }

        .lyric-word {
            display: inline-block;
            margin-right: 0.26em;
            --word-fill: 0%;
            background-image: linear-gradient(
                90deg,
                #ffffff 0%,
                var(--theme-color-bright) calc(var(--word-fill) * 0.88),
                rgba(255, 255, 255, 0.28) var(--word-fill),
                rgba(255, 255, 255, 0.28) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.14s ease;
            will-change: transform;
        }

        .apple-lyric-line:not(.is-active) .lyric-word {
            --word-fill: 0% !important;
            background-image: none;
            -webkit-text-fill-color: currentColor;
        }

        .apple-lyric-line.is-active .lyric-word.word-sung {
            --word-fill: 100%;
        }

        .apple-lyric-line.is-active .lyric-word.word-current {
            transform: translate3d(0, -1.6px, 0);
        }

        .apple-lyric-line.line-plain-active {
            background-image: linear-gradient(90deg, #ffffff 0%, var(--theme-color-bright) 65%, var(--theme-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lyric-sub-line {
            display: block;
            font-size: clamp(0.88rem, 2.6vw, 1.15rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-top: 0.28rem;
            color: rgba(255, 255, 255, 0.38);
            -webkit-text-fill-color: rgba(255, 255, 255, 0.38);
            transition: color 0.28s ease;
        }

        .apple-lyric-line.is-active .lyric-sub-line {
            color: var(--theme-color-bright);

        .search-song-row:hover {

        }

        .search-song-row:active {
            transform: scale3d(0.985, 0.985, 1);
        }

        .search-song-row.is-active-row {
            background: linear-gradient(90deg, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.32) 0%, rgba(10, 12, 19, 0.88) 100%);

        .eq-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 13px;
            width: 14px;
        }
        .eq-bar {
            width: 3px;
            background: linear-gradient(to top, var(--theme-color), var(--theme-color-bright));
            border-radius: 99px;
            animation: eqBounce 0.8s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 45%; animation-duration: 0.62s; }
        .eq-bar:nth-child(2) { height: 100%; animation-duration: 0.88s; animation-delay: 0.15s; }
        .eq-bar:nth-child(3) { height: 65%; animation-duration: 0.72s; animation-delay: 0.28s; }

        .paused-eq .eq-bar {
            animation-play-state: paused;
            height: 25% !important;
        }

        @keyframes eqBounce {
            0% { height: 22%; }
            50% { height: 95%; }
            100% { height: 40%; }
        }

        #mini-player {
            will-change: transform;
            touch-action: none;
            transform-origin: center center;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #mini-cover-wrapper {
            border-radius: 9999px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.58);
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.36);
            will-change: transform, opacity;
        }

        #mini-player-progress {
            position: absolute;
            bottom: 0;
            left: 26px;
            right: 26px;
            height: 2.5px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 99px;
            overflow: hidden;
            pointer-events: none;
        }

        #mini-player-progress-bar {
            height: 100%;
            width: var(--progress, 0%);
            background: linear-gradient(90deg, var(--theme-color), var(--theme-color-bright), #ffffff);
            transition: width 0.12s linear;
        }

        .track-meta-transition {
            transition: opacity 0.15s ease, transform 0.18s var(--spring-smooth);
        }
        .track-meta-changing {
            opacity: 0;
            transform: translate3d(0, 4px, 0);
        }

        .is-buffering {
            pointer-events: none;
        }
        .is-buffering::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            border: 2px solid transparent;
            border-top-color: var(--theme-color-bright);
            border-right-color: var(--theme-color);
            animation: spinRing 0.65s linear infinite;
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .dock-tab-btn {
            position: relative;
            z-index: 2;
            transition: color 0.22s ease;
        }

        .dock-tab-btn.active {
            color: #ffffff;
        }

        .dock-tab-btn:not(.active) {
            color: rgba(255, 255, 255, 0.58);
        }

        #dock-active-pill {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 5px;

            border-radius: 9999px;

            z-index: 1;
            pointer-events: none;
        }

        .modal-backdrop {
            background: rgba(3, 4, 8, 0.76);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
    </style>

    <script>
        const WORKER_BASE = "https://projectvelo.tjcodewizard.workers.dev";
        const FALLBACK_COVER = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80";

        const PLAYLIST_THEMES = [
            { id: 'cobalt', name: 'Electric Cobalt', grad: 'linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #0f172a 100%)' },
            { id: 'rose', name: 'Midnight Rose', grad: 'linear-gradient(135deg, #f43f5e 0%, #be123c 50%, #1e1b4b 100%)' },
            { id: 'emerald', name: 'Emerald Aurora', grad: 'linear-gradient(135deg, #10b981 0%, #047857 50%, #064e3b 100%)' },
            { id: 'amber', name: 'Sunset Amber', grad: 'linear-gradient(135deg, #f59e0b 0%, #b45309 50%, #31102f 100%)' },
            { id: 'violet', name: 'Royal Violet', grad: 'linear-gradient(135deg, #8b5cf6 0%, #6d28d9 50%, #1e1b4b 100%)' },
            { id: 'gold', name: 'Obsidian Gold', grad: 'linear-gradient(135deg, #eab308 0%, #854d0e 50%, #18181b 100%)' }
        ];

        const PLAYLIST_ICONS = [
            'fa-music', 'fa-heart', 'fa-fire', 'fa-bolt', 'fa-moon', 'fa-star'
        ];

        // ============================================================================
        // HIGH-EFFICIENCY DEDUPLICATED FETCH & CACHE ENGINE
        // ============================================================================

        const apiResponseCache = new Map();
        const inFlightRequests = new Map();
        const prewarmedStreamUrls = new Set();

        async function fetchCachedJson(url, ttlMs = 300000, timeoutMs = 6500, externalSignal = null) {
            const now = Date.now();
            const cached = apiResponseCache.get(url);
            if (cached && (now - cached.time) < ttlMs) {
                return cached.data;
            }

            if (inFlightRequests.has(url) && !externalSignal) {
                return inFlightRequests.get(url);
            }

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            if (externalSignal) {
                externalSignal.addEventListener('abort', () => controller.abort(), { once: true });
            }

            const reqPromise = (async () => {
                try {
                    const res = await fetch(url, { signal: controller.signal });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    if (apiResponseCache.size > 150) {
                        const oldest = apiResponseCache.keys().next().value;
                        if (oldest) apiResponseCache.delete(oldest);
                    }
                    apiResponseCache.set(url, { data, time: Date.now() });
                    return data;
                } finally {
                    clearTimeout(timer);
                    inFlightRequests.delete(url);
                }
            })();

            if (!externalSignal) {
                inFlightRequests.set(url, reqPromise);
            }
            return reqPromise;
        }

        function prewarmAudioStreamEdge(streamUrl) {
            if (!streamUrl || prewarmedStreamUrls.has(streamUrl)) return;
            prewarmedStreamUrls.add(streamUrl);
            fetch(streamUrl, {
                method: 'GET',
                headers: { 'Range': 'bytes=0-65535' }
            }).catch(() => {});
        }

        let hasAttemptedAutoFullscreen = false;
        function requestAppFullscreen(force = false) {
            if (!force && hasAttemptedAutoFullscreen) return;
            hasAttemptedAutoFullscreen = true;
            try {
                const docEl = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (docEl.requestFullscreen) {
                        docEl.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
                    } else if (docEl.webkitRequestFullscreen) {
                        docEl.webkitRequestFullscreen();
                    }
                }
            } catch (e) {}
        }

        window.addEventListener('pointerdown', () => requestAppFullscreen(false), { once: true, passive: true });
        window.addEventListener('touchend', () => requestAppFullscreen(false), { once: true, passive: true });

        function workerStreamUrl(targetUrl) {
            if (!targetUrl) return "";
            if (targetUrl.startsWith(WORKER_BASE) || targetUrl.startsWith("data:")) return targetUrl;
            return `${WORKER_BASE}/stream?url=${encodeURIComponent(targetUrl)}`;
        }

        function decodeEntities(str) {
            if (!str) return "";
            return String(str)
                .replace(/&quot;/g, '"')
                .replace(/&#0*39;/g, "'")
                .replace(/&apos;/g, "'")
                .replace(/&amp;/g, "&")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .trim();
        }

        function resolveWorkerImage(imgUrl) {
            if (!imgUrl) return FALLBACK_COVER;
            if (imgUrl.startsWith(WORKER_BASE) || imgUrl.startsWith("data:")) return imgUrl;
            return workerStreamUrl(String(imgUrl).replace(/^http:\/\//i, "https://"));
        }

        function sanitizeBrandNames(text) {
            if (!text) return "";
            return String(text)
                .replace(/\b(?:spotify\s+charts?|spotify\s+india|spotify\s+editorial|spotify|apple\s+music\s+charts?|apple\s+music)\b/gi, "Muse")
                .replace(/\s+—\s+/g, " • ")
                .replace(/\s{2,}/g, " ")
                .trim();
        }

        function normalizeWorkerSong(s) {
            if (!s || typeof s !== 'object') return null;
            const more = s.more_info || {};
            const id = String(s.id || "");
            if (!id) return null;

            const appleId = s.appleId ? String(s.appleId) : (id.startsWith("apple:") ? id.slice(6) : null);
            const spotifyId = s.spotifyId ? String(s.spotifyId) : (id.startsWith("spotify:") ? id.slice(8) : null);
            const title = decodeEntities(s.title || s.song || "Untitled");
            const artist = decodeEntities(s.artist || s.primary_artists || more.primary_artists || s.subtitle || "Unknown Artist");
            const rawAlbum = decodeEntities(s.album || more.album || "");
            const album = (rawAlbum && !/^(openmuse|muse)$/i.test(rawAlbum)) ? sanitizeBrandNames(rawAlbum) : "";
            const duration = parseInt(s.duration || more.duration || "0", 10) || 0;

            const candidates = [];
            if (s.streamUrl) candidates.push(workerStreamUrl(s.streamUrl));
            if (Array.isArray(s.DownloadQueryResult?.cascade)) {
                for (const c of s.DownloadQueryResult.cascade) {
                    if (c) candidates.push(workerStreamUrl(c));
                }
            }
            if (s.playUrl) {
                candidates.push(s.playUrl);
            } else {
                const playQs = new URLSearchParams({ id, title, artist, album, duration: String(duration) });
                if (appleId) playQs.set("appleId", appleId);
                if (spotifyId) playQs.set("spotifyId", spotifyId);
                candidates.push(`${WORKER_BASE}/play?${playQs.toString()}`);
            }

            const uniqueCascade = [...new Set(candidates.filter(Boolean))];
            const lyricsQs = new URLSearchParams({
                id,
                trackName: title,
                artistName: artist,
                albumName: album,
                duration: String(duration)
            });
            if (appleId) lyricsQs.set("appleId", appleId);
            if (spotifyId) lyricsQs.set("spotifyId", spotifyId);

            return {
                id,
                appleId,
                spotifyId,
                variant: s.variant || "standard",
                itemType: "song",
                title,
                artist,
                album,
                duration,
                albumId: s.albumId || more.album_id || s.album_id || null,
                coverUrl: resolveWorkerImage(s.coverUrl || s.image),
                streamUrl: uniqueCascade[0] || s.playUrl,
                playUrl: s.playUrl || uniqueCascade[uniqueCascade.length - 1],
                lyricsUrl: s.lyricsUrl || `${WORKER_BASE}/lyrics?${lyricsQs.toString()}`,
                cascadeUrls: uniqueCascade
            };
        }

        function normalizeWorkerAlbum(a) {
            if (!a || typeof a !== 'object') return null;
            const id = String(a.id || a.albumid || a.listid || "");
            if (!id) return null;
            return {
                id,
                itemType: a.type === "playlist" || id.startsWith("spotify:") ? "playlist" : "album",
                title: sanitizeBrandNames(decodeEntities(a.title || a.name || "Collection")),
                artist: sanitizeBrandNames(decodeEntities(a.artist || a.subtitle || "Muse Curated")),
                year: a.year || "",
                coverUrl: resolveWorkerImage(a.coverUrl || a.image)
            };
        }

        // Application State
        let homeFeedSongs = [];
        let homeFeedAlbums = [];
        let homeShelvesData = {};
        let currentHomeLang = "english,hindi,malayalam,tamil,telugu";

        let playbackQueue = [];
        let currentTrackIndex = -1;
        let activeTrack = null;
        let currentPlaySession = 0;
        let activeCandidateIdx = 0;
        let activeTab = "home";
        let previousTabBeforeSubView = "home";
        let currentDetailTracks = [];
        let activePlaylistId = null;
        let editingPlaylistId = null;
        let selectedModalTheme = PLAYLIST_THEMES[0].id;
        let selectedModalIcon = PLAYLIST_ICONS[0];
        let pendingTrackForPlaylist = null;
        let currentSearchSongs = [];
        let currentSearchAlbums = [];
        let currentSearchFilter = "all";

        // Lyrics & Soundstage Preferences
        let lyricsLanguageMode = localStorage.getItem("muse_lyrics_lang_mode") || "romanized";
        let currentSoundstageMode = localStorage.getItem("muse_soundstage_mode") || "signature";
        let activeLyricsPayload = null;
        let activeLyricsAbortController = null;

        const trackProgressCache = new Map();
        const resolvedSongCache = new Map();
        const lyricsCache = new Map();
        const trackObjectRegistry = new Map();

        function registerTrackObj(t) {
            if (t && t.id) trackObjectRegistry.set(String(t.id), t);
            return t;
        }

        // Custom Playlists & Liked Songs Storage
        let userPlaylists = [];
        const STORAGE_KEY_PLAYLISTS = "muse_custom_playlists_v1";

        function loadPlaylistsFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_PLAYLISTS);
                if (raw) userPlaylists = JSON.parse(raw);
            } catch (e) {
                userPlaylists = [];
            }
            if (!userPlaylists.some(p => p.id === "liked_songs")) {
                userPlaylists.unshift({
                    id: "liked_songs",
                    name: "Liked Songs",
                    description: "Your favorite tracks across Muse",
                    theme: "rose",
                    icon: "fa-heart",
                    isSystem: true,
                    tracks: []
                });
            }
        }

        function savePlaylistsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_PLAYLISTS, JSON.stringify(userPlaylists));
            } catch (e) {}
        }

        function isTrackLiked(trackId) {
            const likedPl = userPlaylists.find(p => p.id === "liked_songs");
            return likedPl ? likedPl.tracks.some(t => String(t.id) === String(trackId)) : false;
        }

        window.toggleLikeTrackById = (trackId, ev, forceLikeOnly = false) => {
            if (ev) ev.stopPropagation();
            const track = trackObjectRegistry.get(String(trackId)) || (activeTrack && String(activeTrack.id) === String(trackId) ? activeTrack : null);
            if (!track) return;
            const likedPl = userPlaylists.find(p => p.id === "liked_songs");
            if (!likedPl) return;
            const idx = likedPl.tracks.findIndex(t => String(t.id) === String(track.id));
            if (idx >= 0) {
                if (!forceLikeOnly) {
                    likedPl.tracks.splice(idx, 1);
                    toast(`Removed from Liked Songs`);
                }
            } else {
                likedPl.tracks.unshift(track);
                toast(`Added to Liked Songs`);
            }
            savePlaylistsToStorage();
            syncLikeButtonsUI();
            if (activeTab === "playlists") renderPlaylistsView();
            if (activeTab === "playlist-songs" && activePlaylistId === "liked_songs") renderActivePlaylistView();
        };

        window.toggleLikeActiveTrack = () => {
            if (!activeTrack) return;
            toggleLikeTrackById(activeTrack.id);
        };

        // Heart Burst Animation with Strict Cleanup
        const heartBurstNode = document.getElementById('heart-burst-node');
        let heartBurstCleanupTimer = null;

        function resetHeartBurstAnimation() {
            if (heartBurstCleanupTimer) {
                clearTimeout(heartBurstCleanupTimer);
                heartBurstCleanupTimer = null;
            }
            if (heartBurstNode) {
                heartBurstNode.classList.remove('animate-burst');
            }
        }

        if (heartBurstNode) {
            heartBurstNode.addEventListener('animationend', () => {
                resetHeartBurstAnimation();
            });
        }

        function triggerDoubleTapHeartBurst() {
            if (!activeTrack || !heartBurstNode) return;
            toggleLikeTrackById(activeTrack.id, null, true);
            resetHeartBurstAnimation();
            void heartBurstNode.offsetWidth;
            heartBurstNode.classList.add('animate-burst');
            heartBurstCleanupTimer = setTimeout(() => {
                resetHeartBurstAnimation();
            }, 820);
        }

        function syncLikeButtonsUI() {
            const fullLikeIcon = document.getElementById('full-like-icon');
            if (activeTrack && isTrackLiked(activeTrack.id)) {
                fullLikeIcon.className = "fa-solid fa-heart text-sm text-rose-400";
            } else {
                fullLikeIcon.className = "fa-regular fa-heart text-sm text-white/80";
            }
            document.querySelectorAll('.row-like-btn').forEach(btn => {
                const tid = btn.dataset.tid;
                const liked = isTrackLiked(tid);
                btn.innerHTML = liked
                    ? '<i class="fa-solid fa-heart text-rose-400 text-xs"></i>'
                    : '<i class="fa-regular fa-heart text-white/35 hover:text-white text-xs"></i>';
            });
        }

        loadPlaylistsFromStorage();

        // ============================================================================
        // UNSTOPPABLE OS BACKGROUND KEEP-ALIVE & MUSE SOUNDSTAGE MASTERING DSP
        // ============================================================================

        const audio = document.getElementById('audio-engine');
        const osAudioLock = document.getElementById('os-audio-lock');
        audio.loop = false;
        const fullProgress = document.getElementById('full-progress');
        const miniProgressBar = document.getElementById('mini-player-progress-bar');

        // Synthesize a 1-second silent PCM WAV in memory so the OS hardware audio lock never drops during track transitions
        function createSilentWavDataUri() {
            const sampleRate = 8000;
            const numSamples = sampleRate;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);
            const bytes = new Uint8Array(buffer);
            let bin = '';
            for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
            return 'data:audio/wav;base64,' + btoa(bin);
        }

        try {
            osAudioLock.src = createSilentWavDataUri();
            osAudioLock.volume = 0.01;
        } catch (e) {}

        function engageOsBackgroundLock() {
            if (!osAudioLock) return;
            if (osAudioLock.paused) {
                osAudioLock.play().catch(() => {});
            }
        }

        function releaseOsBackgroundLock() {
            if (!osAudioLock) return;
            if (!osAudioLock.paused) {
                osAudioLock.pause();
            }
        }

        let signatureAudioCtx = null;
        let signatureAnalyser = null;
        let signatureGraphReady = false;
        let dspNodes = {};
        let museBrandRafId = null;

        const SOUNDSTAGE_PRESETS = {
            signature: { label: 'Signature', subGain: 2.2, mudGain: -1.1, presenceGain: 0.85, airGain: 1.4, spatialWet: 0.16, delaySec: 0.0120 },
            spatial:   { label: 'Spatial 3D', subGain: 2.6, mudGain: -1.3, presenceGain: 1.35, airGain: 2.6, spatialWet: 0.30, delaySec: 0.0175 },
            vocal:     { label: 'Vocal Studio', subGain: 0.6, mudGain: -1.8, presenceGain: 2.40, airGain: 1.8, spatialWet: 0.11, delaySec: 0.0095 },
            bass:      { label: 'Bass+', subGain: 5.2, mudGain: -1.2, presenceGain: 0.70, airGain: 1.2, spatialWet: 0.18, delaySec: 0.0130 }

        function initMuseSignatureSound() {
            if (signatureGraphReady) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                signatureAudioCtx = new AudioCtx({ latencyHint: 'playback' });
                const source = signatureAudioCtx.createMediaElementSource(audio);

                const inputHeadroom = signatureAudioCtx.createGain();
                inputHeadroom.gain.value = 0.90;

                const subSonicClean = signatureAudioCtx.createBiquadFilter();
                subSonicClean.type = 'highpass';
                subSonicClean.frequency.value = 18;
                subSonicClean.Q.value = 0.707;

                const subWarmthShelf = signatureAudioCtx.createBiquadFilter();
                subWarmthShelf.type = 'lowshelf';
                subWarmthShelf.frequency.value = 54;
                subWarmthShelf.gain.value = 2.2;

                const mudClearContour = signatureAudioCtx.createBiquadFilter();
                mudClearContour.type = 'peaking';
                mudClearContour.frequency.value = 245;
                mudClearContour.Q.value = 1.45;
                mudClearContour.gain.value = -1.1;

                const naturalPresence = signatureAudioCtx.createBiquadFilter();
                naturalPresence.type = 'peaking';
                naturalPresence.frequency.value = 3250;
                naturalPresence.Q.value = 0.80;
                naturalPresence.gain.value = 0.85;

                const velvetAirShelf = signatureAudioCtx.createBiquadFilter();
                velvetAirShelf.type = 'highshelf';
                velvetAirShelf.frequency.value = 14800;
                velvetAirShelf.gain.value = 1.4;

                const spatialHighPass = signatureAudioCtx.createBiquadFilter();
                spatialHighPass.type = 'highpass';
                spatialHighPass.frequency.value = 580;

                const spatialLowPass = signatureAudioCtx.createBiquadFilter();
                spatialLowPass.type = 'lowpass';
                spatialLowPass.frequency.value = 11800;

                const haasMicroDelay = signatureAudioCtx.createDelay(0.05);
                haasMicroDelay.delayTime.value = 0.0120;

                const spatialWetGain = signatureAudioCtx.createGain();
                spatialWetGain.gain.value = 0.16;

                const masterCompressor = signatureAudioCtx.createDynamicsCompressor();
                masterCompressor.threshold.value = -2.5;
                masterCompressor.knee.value = 10;
                masterCompressor.ratio.value = 2.2;
                masterCompressor.attack.value = 0.006;
                masterCompressor.release.value = 0.14;

                signatureAnalyser = signatureAudioCtx.createAnalyser();
                signatureAnalyser.fftSize = 128;
                signatureAnalyser.smoothingTimeConstant = 0.80;

                // Continuous sub-audible keep-alive oscillator so the AudioContext thread is never marked idle by mobile OSes
                const keepAliveOsc = signatureAudioCtx.createOscillator();
                const keepAliveGain = signatureAudioCtx.createGain();
                keepAliveOsc.frequency.value = 1;
                keepAliveGain.gain.value = 0.00001;
                keepAliveOsc.connect(keepAliveGain).connect(signatureAudioCtx.destination);
                keepAliveOsc.start();

                source
                    .connect(inputHeadroom)
                    .connect(subSonicClean)
                    .connect(subWarmthShelf)
                    .connect(mudClearContour)
                    .connect(naturalPresence)
                    .connect(velvetAirShelf)
                    .connect(masterCompressor);

                velvetAirShelf
                    .connect(spatialHighPass)
                    .connect(spatialLowPass)
                    .connect(haasMicroDelay)
                    .connect(spatialWetGain)
                    .connect(masterCompressor);

                masterCompressor
                    .connect(signatureAnalyser)
                    .connect(signatureAudioCtx.destination);

                dspNodes = {
                    subWarmthShelf,
                    mudClearContour,
                    naturalPresence,
                    velvetAirShelf,
                    haasMicroDelay,
                    spatialWetGain
                };

                signatureAudioCtx.onstatechange = () => {
                    if (userIntendedPlaying && signatureAudioCtx.state === 'suspended') {
                        signatureAudioCtx.resume().catch(() => {});
                    }
                };

                signatureGraphReady = true;
                applySoundstagePreset(currentSoundstageMode, false);
            } catch (e) {}
        }

        function startMuseBrandGradientLoop() {
            if (museBrandRafId) return;
            const rootStyle = document.documentElement.style;
            const bins = signatureAnalyser ? new Uint8Array(signatureAnalyser.frequencyBinCount) : null;

            const step = (now) => {
                if (audio.paused || document.hidden) {
                    rootStyle.setProperty('--muse-base-stop', '22%');
                    rootStyle.setProperty('--muse-mid-stop', '62%');
                    rootStyle.setProperty('--muse-white-peak', '90%');
                    rootStyle.setProperty('--muse-glow-alpha', '0.32');
                    rootStyle.setProperty('--muse-glow-spread', '14px');
                    museBrandRafId = null;
                    return;
                }

                let bassRaw = 0.28;
                let vocalRaw = 0.25;

                if (signatureAnalyser && bins) {
                    signatureAnalyser.getByteFrequencyData(bins);
                    let bassSum = 0;
                    for (let i = 0; i < 6; i++) bassSum += bins[i];
                    bassRaw = Math.min(1, Math.max(0.08, bassSum / (6 * 240)));

                    let vocalSum = 0;
                    for (let i = 6; i < 22; i++) vocalSum += bins[i];
                    vocalRaw = Math.min(1, Math.max(0.08, vocalSum / (16 * 215)));
                } else {
                    bassRaw = 0.32 + 0.24 * Math.sin(now * 0.005);
                    vocalRaw = 0.28 + 0.22 * Math.cos(now * 0.0038);
                }

                smoothedBassEnergy = bassRaw > smoothedBassEnergy
                    ? smoothedBassEnergy * 0.55 + bassRaw * 0.45
                    : smoothedBassEnergy * 0.88 + bassRaw * 0.12;

                smoothedVocalEnergy = vocalRaw > smoothedVocalEnergy
                    ? smoothedVocalEnergy * 0.60 + vocalRaw * 0.40
                    : smoothedVocalEnergy * 0.88 + vocalRaw * 0.12;

                const combinedDrive = Math.min(1, smoothedBassEnergy * 0.62 + smoothedVocalEnergy * 0.38);

                const baseStop = (10 + smoothedBassEnergy * 26).toFixed(1);
                const midStop = (36 + combinedDrive * 32).toFixed(1);
                const whitePeak = Math.max(Number(midStop) + 12, 92 - combinedDrive * 28).toFixed(1);
                const glowAlpha = (0.30 + combinedDrive * 0.56).toFixed(2);
                const glowSpread = (12 + combinedDrive * 16).toFixed(1);

                rootStyle.setProperty('--muse-base-stop', `${baseStop}%`);
                rootStyle.setProperty('--muse-mid-stop', `${midStop}%`);
                rootStyle.setProperty('--muse-white-peak', `${whitePeak}%`);
                rootStyle.setProperty('--muse-glow-alpha', glowAlpha);
                rootStyle.setProperty('--muse-glow-spread', `${glowSpread}px`);

                museBrandRafId = requestAnimationFrame(step);
            };
            museBrandRafId = requestAnimationFrame(step);
        }

        function animateSpring({
            from = 0,
            to = 1,
            velocity = 0,
            stiffness = 360,
            damping = 28,
            mass = 1,
            precision = 0.0015,
            onUpdate,
            onComplete
        }) {
            let x = from;
            let v = velocity;
            let lastTime = performance.now();
            let frameId = null;
            let cancelled = false;

            const accel = (pos, vel) => (-stiffness * (pos - to) - damping * vel) / mass;

            function step(now) {
                if (cancelled) return;
                const dt = Math.min((now - lastTime) / 1000, 0.022);
                lastTime = now;

                if (dt > 0) {
                    const dx1 = v;
                    const dv1 = accel(x, v);

                    const dx2 = v + 0.5 * dt * dv1;
                    const dv2 = accel(x + 0.5 * dt * dx1, v + 0.5 * dt * dv1);

                    const dx3 = v + 0.5 * dt * dv2;
                    const dv3 = accel(x + 0.5 * dt * dx2, v + 0.5 * dt * dv2);

                    const dx4 = v + dt * dv3;
                    const dv4 = accel(x + dt * dx3, v + dt * dv3);

                    x += (dt / 6) * (dx1 + 2 * dx2 + 2 * dx3 + dx4);
                    v += (dt / 6) * (dv1 + 2 * dv2 + 2 * dv3 + dv4);
                }

                if (Math.abs(x - to) <= precision && Math.abs(v) <= precision * 10) {
                    if (onUpdate) onUpdate(to, 0);
                    if (onComplete) onComplete();
                    return;
                }

                if (onUpdate) onUpdate(x, v);
                frameId = requestAnimationFrame(step);
            }

            frameId = requestAnimationFrame(step);
            return () => {
                cancelled = true;
                if (frameId) cancelAnimationFrame(frameId);
                return { position: x, velocity: v };
            };
        }

        function attachLiquidButtonPhysics(btn, compressScale = 0.86, onTap = null) {
            if (!btn) return;
            let currentScale = 1;
            let currentVel = 0;
            let cancelSpring = null;

            const springTo = (target, stiffness, damping, boostVel = 0) => {
                if (cancelSpring) {
                    const state = cancelSpring();
                    currentScale = state.position;
                    currentVel = state.velocity;
                }
                cancelSpring = animateSpring({
                    from: currentScale,
                    to: target,
                    velocity: currentVel + boostVel,
                    stiffness,
                    damping,
                    onUpdate: (s, v) => {
                        currentScale = s;
                        currentVel = v;
                        btn.style.transform = `scale3d(${s.toFixed(4)}, ${s.toFixed(4)}, 1)`;
                    },
                    onComplete: () => {
                        currentScale = target;
                        currentVel = 0;
                        btn.style.transform = target === 1 ? '' : `scale3d(${target}, ${target}, 1)`;
                    }
                });
            };

            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                btn.classList.add('is-pressed');
                springTo(compressScale, 480, 30, -2.2);
            });

            const release = (e, isTapRelease = false) => {
                if (!btn.classList.contains('is-pressed')) return;
                btn.classList.remove('is-pressed');
                springTo(1, 350, 20, 3.2);

                if (isTapRelease && onTap) {
                    e.stopPropagation();
                    e.preventDefault();
                    onTap();
                }
            };

            btn.addEventListener('pointerup', (e) => release(e, true));
            btn.addEventListener('pointerleave', (e) => release(e, false));
            btn.addEventListener('pointercancel', (e) => release(e, false));
        }

        function applyThemeColor(imageUrl) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 48;
                    canvas.height = 48;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 48, 48);
                    const data = ctx.getImageData(0, 0, 48, 48).data;

                    let r = 0, g = 0, b = 0, totalWeight = 0;

                    for (let i = 0; i < data.length; i += 16) {
                        const pr = data[i], pg = data[i+1], pb = data[i+2];
                        const max = Math.max(pr, pg, pb);
                        const min = Math.min(pr, pg, pb);
                        const chroma = max - min;
                        const luma = 0.2126 * pr + 0.7152 * pg + 0.0722 * pb;

                        const lumaWeight = (luma > 22 && luma < 235) ? 1.25 : 0.12;
                        const weight = (chroma * 1.9 + 14) * lumaWeight;

                        r += pr * weight;
                        g += pg * weight;
                        b += pb * weight;
                        totalWeight += weight;
                    }

                    if (totalWeight > 0) {
                        r = Math.floor(r / totalWeight);
                        g = Math.floor(g / totalWeight);
                        b = Math.floor(b / totalWeight);
                    }

                    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    if (luma < 110) {
                        const boost = 110 / Math.max(luma, 1);
                        r = Math.min(255, Math.floor(r * boost));
                        g = Math.min(255, Math.floor(g * boost));
                        b = Math.min(255, Math.floor(b * boost));
                    }

                    const darkR = Math.max(10, Math.floor(r * 0.28));
                    const darkG = Math.max(10, Math.floor(g * 0.28));
                    const darkB = Math.max(14, Math.floor(b * 0.30));

                    const brightR = Math.min(255, Math.floor(r * 0.60 + 255 * 0.40));
                    const brightG = Math.min(255, Math.floor(g * 0.60 + 255 * 0.40));
                    const brightB = Math.min(255, Math.floor(b * 0.60 + 255 * 0.40));

                    const rootStyle = document.documentElement.style;
                    rootStyle.setProperty('--theme-r', `${r}`);
                    rootStyle.setProperty('--theme-g', `${g}`);
                    rootStyle.setProperty('--theme-b', `${b}`);
                    rootStyle.setProperty('--theme-dark-r', `${darkR}`);
                    rootStyle.setProperty('--theme-dark-g', `${darkG}`);
                    rootStyle.setProperty('--theme-dark-b', `${darkB}`);
                    rootStyle.setProperty('--theme-bright-r', `${brightR}`);
                    rootStyle.setProperty('--theme-bright-g', `${brightG}`);
                    rootStyle.setProperty('--theme-bright-b', `${brightB}`);

                    rootStyle.setProperty('--theme-color', `rgb(${r}, ${g}, ${b})`);
                    rootStyle.setProperty('--theme-color-bright', `rgb(${brightR}, ${brightG}, ${brightB})`);
                    rootStyle.setProperty('--theme-color-dim', `rgba(${r}, ${g}, ${b}, 0.22)`);
                    rootStyle.setProperty('--theme-color-light', `rgba(${r}, ${g}, ${b}, 0.42)`);
                    rootStyle.setProperty('--theme-color-glow', `rgba(${brightR}, ${brightG}, ${brightB}, 0.55)`);
                    rootStyle.setProperty('--app-bg', `rgb(${Math.floor(r * 0.11)}, ${Math.floor(g * 0.11)}, ${Math.floor(b * 0.14)})`);
                } catch(e) {}
            };
            img.src = imageUrl;
        }
