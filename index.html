<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#040508">
    <title>Muse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        metal: {
                            950: '#030305',
                            900: '#08090c',
                            800: '#121318',
                            700: '#1f2128',
                            400: '#8b949e',
                            200: '#e2e8f0',
                            100: '#ffffff',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --app-bg: #040508;
            --theme-r: 108;
            --theme-g: 125;
            --theme-b: 215;
            --theme-dark-r: 16;
            --theme-dark-g: 20;
            --theme-dark-b: 38;
            --theme-bright-r: 195;
            --theme-bright-g: 215;
            --theme-bright-b: 255;
            --theme-color: rgb(108, 125, 215);
            --theme-color-bright: rgb(195, 215, 255);
            --theme-color-dim: rgba(108, 125, 215, 0.18);
            --theme-color-light: rgba(108, 125, 215, 0.38);
            --theme-color-glow: rgba(165, 190, 255, 0.54);
            --muse-white-stop: 24%;
            --muse-glow-alpha: 0.32;
            --spring-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input[type="text"], input[type="search"], textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        img, audio {
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        body {
            height: 100dvh;
            width: 100vw;
            background-color: var(--app-bg);
            color: #e2e8f0;
            overflow: hidden;
            touch-action: pan-y;
            transition: background-color 0.7s ease;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        #ambient-stage {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 10%, rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.24) 0%, transparent 48%),
                radial-gradient(circle at 82% 14%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.30) 0%, transparent 52%),
                radial-gradient(circle at 80% 85%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.20) 0%, transparent 55%),
                radial-gradient(circle at 18% 82%, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.90) 0%, transparent 65%);
            transform: translate3d(0, 0, 0);
            transition: background 0.8s ease;
            contain: strict;
        }

        #app-shell {
            position: relative;
            z-index: 10;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        #top-brand-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 35;
            padding: 0.75rem 1rem 0.65rem 1rem;
            background: linear-gradient(to bottom, rgba(4, 5, 8, 0.88) 0%, rgba(4, 5, 8, 0.52) 68%, transparent 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: none;
        }

        @media (min-width: 640px) {
            #top-brand-bar {
                padding: 0.9rem 2rem 0.75rem 2rem;
            }
        }

        .liquid-glass {
            background:
                linear-gradient(
                    135deg,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.18) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.26) 42%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.74) 84%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.24) 100%
                );
            backdrop-filter: blur(20px) saturate(195%);
            -webkit-backdrop-filter: blur(20px) saturate(195%);
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.32);
            box-shadow:
                0 16px 38px -10px rgba(0, 0, 0, 0.72),
                0 4px 20px -6px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.30),
                inset 0 1px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.45),
                inset 0 -1px 1px 0 rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.20);
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        .liquid-control-btn {
            position: relative;
            background:
                radial-gradient(
                    120% 120% at 25% 15%,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.28) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.24) 50%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.58) 100%
                );
            backdrop-filter: blur(16px) saturate(185%);
            -webkit-backdrop-filter: blur(16px) saturate(185%);
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.34);
            box-shadow:
                0 8px 22px -6px rgba(0, 0, 0, 0.58),
                0 2px 14px -4px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.26),
                inset 0 1px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.48),
                inset 0 -1px 1.5px 0 rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.22);
            color: #ffffff;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            will-change: transform;
            transition: border-color 0.22s ease, background 0.22s ease;
        }

        .liquid-control-btn.is-pressed {
            background:
                radial-gradient(
                    115% 115% at 50% 50%,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.46) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.40) 60%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.62) 100%
                );
            border-color: var(--theme-color-bright);
        }

        .liquid-hero-play {
            background:
                linear-gradient(
                    135deg,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.46) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.44) 52%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.66) 100%
                );
            border: 1.2px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.56);
            box-shadow:
                0 14px 34px -8px rgba(0, 0, 0, 0.72),
                0 0 30px -6px var(--theme-color-glow),
                inset 0 1.5px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.68);
            color: #ffffff;
        }

        .pill-active {
            border-color: var(--theme-color-bright) !important;
            background: linear-gradient(135deg, rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.38) 0%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.50) 100%) !important;
            color: #ffffff !important;
            box-shadow: 0 0 20px -4px var(--theme-color-glow);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #initial-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(circle at 50% 35%, #12172a 0%, #030305 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s var(--spring-smooth), opacity 0.5s ease;
            overflow: hidden;
        }

        .cinematic-intro {
            animation: cinematicScale 1s var(--spring-smooth) forwards;
            opacity: 0;
            transform: scale(0.92) translateY(8px);
            letter-spacing: -0.06em;
        }

        .cinematic-fade {
            animation: fadeIn 0.8s var(--spring-smooth) 0.18s forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        .loader-bar-track {
            width: 120px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 1.6rem;
            position: relative;
        }

        .loader-bar-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--theme-color-bright), #ffffff, transparent);
            animation: loaderSweep 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes loaderSweep {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(280%); }
        }

        @keyframes cinematicScale {
            0% { opacity: 0; transform: scale(0.9) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .muse-dynamic-brand {
            display: inline-block;
            background-image: linear-gradient(
                0deg,
                var(--theme-color) 0%,
                var(--theme-color-bright) var(--muse-white-stop, 26%),
                #ffffff calc(var(--muse-white-stop, 26%) + 26%),
                var(--theme-color-bright) 92%,
                #ffffff 100%
            );
            background-size: 100% 220%;
            background-position: 0% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 16px rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), var(--muse-glow-alpha, 0.32)));
            transition: filter 0.35s ease;
        }

        .muse-dynamic-brand.is-playing-brand {
            animation: museSoothingFlow 3.4s ease-in-out infinite alternate;
        }

        @keyframes museSoothingFlow {
            0% { background-position: 0% 95%; }
            50% { background-position: 0% 25%; }
            100% { background-position: 0% 0%; }
        }

        #main-scroll-view {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            will-change: scroll-position;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.22); border-radius: 10px; }

        .scrubber-container {
            position: relative;
            padding: 16px 0;
            margin: -10px 0;
            touch-action: none;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5.5px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 99px;
            outline: none;
            background-image: linear-gradient(90deg, var(--theme-color) 0%, var(--theme-color-bright) 58%, #ffffff 100%);
            background-size: var(--progress, 0%) 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            pointer-events: none;
            transition: height 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.55);
        }

        .scrubber-container.scrubbing input[type="range"] {
            height: 13px;
            box-shadow:
                0 0 22px var(--theme-color-glow),
                0 0 0 1px var(--theme-color-bright);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 0px;
            height: 0px;
            background: transparent;
        }

        input[type="range"]::-moz-range-thumb {
            width: 0px;
            height: 0px;
            border: none;
            background: transparent;
        }

        #fullscreen-player {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.15rem 1.35rem;
            overflow: hidden;
            touch-action: none;
            pointer-events: auto;
            contain: layout style;
        }

        @media (min-width: 768px) {
            #fullscreen-player {
                padding: 2rem 2.75rem;
            }
        }

        #fullscreen-player.closed {
            display: none !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        #fullscreen-backdrop-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-color: #040508;
            background-image:
                radial-gradient(circle at 24% 18%, rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.42) 0%, transparent 52%),
                radial-gradient(circle at 78% 26%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.58) 0%, transparent 58%),
                radial-gradient(circle at 50% 62%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.36) 0%, transparent 65%),
                linear-gradient(180deg, rgb(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b)) 0%, #05060a 68%, #030407 100%);
            will-change: opacity;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #fullscreen-ambient-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 34%, transparent 0%, rgba(4, 5, 9, 0.42) 62%, rgba(3, 4, 7, 0.88) 100%),
                linear-gradient(to bottom, rgba(4, 5, 9, 0.18) 0%, rgba(4, 5, 9, 0.52) 62%, rgba(3, 4, 7, 0.94) 100%);
            pointer-events: none;
        }

        #swipe-area {
            perspective: 1000px;
            overflow: visible;
            z-index: 20;
            position: relative;
        }

        .reel-cover-card {
            border-radius: 34px;
            box-shadow:
                0 26px 65px -12px var(--theme-color-glow),
                0 16px 38px -8px rgba(0, 0, 0, 0.85);
            will-change: transform, border-radius, opacity;
            transform-origin: center center;
            overflow: hidden;
            background: #08090c;
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.34);
            backface-visibility: hidden;
        }

        #full-cover-outgoing {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            z-index: 19;
        }

        #full-cover-wrapper {
            position: relative;
            z-index: 20;
        }

        #full-cover-wrapper.swipe-threshold-ready {
            box-shadow:
                0 0 50px 4px var(--theme-color-bright),
                0 22px 60px rgba(0, 0, 0, 0.85) !important;
            border-color: var(--theme-color-bright);
        }

        #double-tap-heart-overlay {
            position: absolute;
            inset: 0;
            z-index: 35;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .heart-burst-node {
            position: relative;
            width: 138px;
            height: 138px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale3d(0, 0, 1);
            opacity: 0;
            will-change: transform, opacity;
        }

        .heart-burst-ring {
            position: absolute;
            inset: -12px;
            border-radius: 9999px;
            border: 2.5px solid var(--theme-color-bright);
            opacity: 0;
            transform: scale3d(0.4, 0.4, 1);
            box-shadow: 0 0 32px var(--theme-color-glow);
            will-change: transform, opacity;
        }

        .heart-burst-node.animate-burst {
            animation: heartPopKeyframes 0.8s cubic-bezier(0.18, 1.25, 0.32, 1) forwards;
        }

        .heart-burst-node.animate-burst .heart-burst-ring {
            animation: heartRingKeyframes 0.74s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heartPopKeyframes {
            0% { opacity: 0; transform: scale3d(0.2, 0.2, 1) rotate(-10deg); }
            28% { opacity: 1; transform: scale3d(1.16, 1.16, 1) rotate(4deg); }
            48% { opacity: 1; transform: scale3d(0.95, 0.95, 1) rotate(-2deg); }
            68% { opacity: 1; transform: scale3d(1.03, 1.03, 1) rotate(0deg); }
            100% { opacity: 0; transform: scale3d(1.26, 1.26, 1) translateY(-16px); }
        }

        @keyframes heartRingKeyframes {
            0% { opacity: 0.9; transform: scale3d(0.45, 0.45, 1); }
            100% { opacity: 0; transform: scale3d(1.75, 1.75, 1); }
        }

        #apple-lyrics-stage {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translate3d(80px, 0, 0) scale(0.95);
            will-change: transform, opacity;
        }

        #apple-lyrics-stage.lyrics-interactive {
            pointer-events: auto;
        }

        #lyrics-scroll-box {
            height: 100%;
            max-height: 52dvh;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18dvh 1.15rem;
            touch-action: pan-y;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        #lyrics-scroll-box::-webkit-scrollbar { display: none; }

        .apple-lyric-line {
            font-size: clamp(1.32rem, 4.2vw, 2.02rem);
            font-weight: 800;
            line-height: 1.32;
            letter-spacing: -0.025em;
            margin: 1.05rem 0;
            color: rgba(255, 255, 255, 0.26);
            transform-origin: left center;
            transform: scale3d(0.94, 0.94, 1);
            opacity: 0.58;
            transition: transform 0.32s var(--spring-smooth), opacity 0.28s ease, color 0.28s ease;
            cursor: pointer;
            will-change: transform, opacity;
            word-break: break-word;
        }

        .apple-lyric-line.is-past {
            color: rgba(255, 255, 255, 0.22);
            transform: scale3d(0.93, 0.93, 1);
            opacity: 0.40;
        }

        .apple-lyric-line.is-active {
            transform: scale3d(1.01, 1.01, 1);
            opacity: 1;
            color: rgba(255, 255, 255, 0.36);
        }

        .lyric-word {
            display: inline-block;
            margin-right: 0.26em;
            --word-fill: 0%;
            background-image: linear-gradient(
                90deg,
                #ffffff 0%,
                var(--theme-color-bright) calc(var(--word-fill) * 0.88),
                rgba(255, 255, 255, 0.28) var(--word-fill),
                rgba(255, 255, 255, 0.28) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.16s ease;
            will-change: transform;
        }

        .apple-lyric-line:not(.is-active) .lyric-word {
            --word-fill: 0% !important;
            background-image: none;
            -webkit-text-fill-color: currentColor;
        }

        .apple-lyric-line.is-active .lyric-word.word-sung {
            --word-fill: 100%;
        }

        .apple-lyric-line.is-active .lyric-word.word-current {
            transform: translate3d(0, -1.5px, 0);
        }

        .apple-lyric-line.line-plain-active {
            background-image: linear-gradient(90deg, #ffffff 0%, var(--theme-color-bright) 65%, var(--theme-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-image-wrapper {
            overflow: hidden;
            border-radius: 1.25rem;
            transition: transform 0.25s var(--spring-smooth), border-color 0.25s ease;
            position: relative;
            background: #08090c;
            box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.68);
        }

        .catalog-item:active .card-image-wrapper {
            transform: scale3d(0.95, 0.95, 1);
        }

        .is-playing-card {
            border: 1.5px solid var(--theme-color-bright);
            box-shadow: 0 12px 30px -8px var(--theme-color-glow);
        }

        .not-playing-card {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .search-song-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .search-song-row:hover {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15);
            border-color: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.26);
        }

        .search-song-row:active {
            transform: scale3d(0.988, 0.988, 1);
        }

        .search-song-row.is-active-row {
            background: linear-gradient(90deg, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.28) 0%, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.46) 100%);
            border-color: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.46);
        }

        .eq-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 13px;
            width: 14px;
        }
        .eq-bar {
            width: 3px;
            background: linear-gradient(to top, var(--theme-color), var(--theme-color-bright));
            border-radius: 99px;
            animation: eqBounce 0.8s ease-in-out infinite alternate;
        }

        .eq-bar:nth-child(3) { height: 65%; animation-duration: 0.72s; animation-delay: 0.28s; }

        .paused-eq .eq-bar {
            animation-play-state: paused;
            height: 25% !important;
        }

        @keyframes eqBounce {
            0% { height: 22%; }
            50% { height: 95%; }
            100% { height: 40%; }
        }

        #mini-player {
            will-change: transform;
            touch-action: none;
            transform-origin: center center;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;

            width: var(--progress, 0%);

            transition: width 0.12s linear;
        }

        .track-meta-transition {
            transition: opacity 0.15s ease, transform 0.18s var(--spring-smooth);
        }
        .track-meta-changing {
            opacity: 0;
            transform: translate3d(0, 4px, 0);

        .is-buffering {
            pointer-events: none;
        }
        .is-buffering::after {
            content: "";

        #dock-active-pill {

            backdrop-filter: blur(14px);

        function workerStreamUrl(targetUrl) {
            if (!targetUrl) return "";
            if (targetUrl.startsWith(WORKER_BASE) || targetUrl.startsWith("data:")) return targetUrl;
            return `${WORKER_BASE}/stream?url=${encodeURIComponent(targetUrl)}`;
        }

        function decodeEntities(str) {
            if (!str) return "";
            return String(str)
                .replace(/&quot;/g, '"')
                .replace(/&#039;/g, "'")
                .replace(/&apos;/g, "'")
                .replace(/&amp;/g, "&")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .trim();

        function upgradeImageQuality(imgUrl) {
            if (!imgUrl) return FALLBACK_COVER;
            if (imgUrl.startsWith(WORKER_BASE)) return imgUrl;
            const hiRes = String(imgUrl)
                .replace(/50x50|150x150/g, "500x500")
                .replace(/^http:\/\//i, "https://");
            return workerStreamUrl(hiRes);
        }

        function buildCascadeUrls(rawMediaUrl, songId, title, artist, existingCascade = []) {
            const list = [];
            if (Array.isArray(existingCascade) && existingCascade.length > 0) {
                for (const c of existingCascade) {
                    if (c) list.push(workerStreamUrl(c));
                }
            }
            if (rawMediaUrl && rawMediaUrl.includes("saavncdn.com")) {
                const norm = rawMediaUrl
                    .replace(/^http:\/\//i, "https://")
                    .replace("://h.saavncdn.com/", "://aac.saavncdn.com/")
                    .replace("://preview.saavncdn.com/", "://aac.saavncdn.com/")
                    .replace(/_96_p\.mp4/g, "_96.mp4");
                const stem = norm.replace(/_(320|160|96)\.mp4$/i, "");
                const hStem = stem.replace("://aac.saavncdn.com/", "://h.saavncdn.com/");
                const pStem = stem.replace("://aac.saavncdn.com/", "://preview.saavncdn.com/");

                list.push(
                    workerStreamUrl(`${stem}_320.mp4`),
                    workerStreamUrl(`${stem}_160.mp4`),
                    workerStreamUrl(`${stem}_96.mp4`),
                    workerStreamUrl(`${hStem}_96.mp4`),
                    workerStreamUrl(`${pStem}_96_p.mp4`)
                );
            } else if (rawMediaUrl) {
                list.push(workerStreamUrl(rawMediaUrl));
            }
            if (songId) {
                list.push(`${WORKER_BASE}/play?id=${encodeURIComponent(songId)}&title=${encodeURIComponent(title || "")}&artist=${encodeURIComponent(artist || "")}`);
            }
            return [...new Set(list.filter(Boolean))];
        }

        function normalizeSaavnSong(s) {
            if (!s) return null;
            const more = s.more_info || {};
            const directMediaUrl = s.decrypted_media_url || s.DownloadQueryResult?.url || "";

            let artistName = "";
            if (s.artist) {
                artistName = s.artist;
            } else if (more.artistMap?.primary_artists?.length) {
                artistName = more.artistMap.primary_artists.map(a => a.name).join(", ");
            } else {
                artistName = more.primary_artists || more.music || s.primary_artists || s.subtitle || "Unknown Artist";
            }

            const title = decodeEntities(s.title || s.song || "Untitled");
            const artist = decodeEntities(artistName);
            const album = decodeEntities(s.album || more.album || "Muse");
            const duration = parseInt(s.duration || more.duration || "0", 10) || 0;
            const id = String(s.id);
            const existingCascade = s.DownloadQueryResult?.cascade || [];
            const cascade = buildCascadeUrls(directMediaUrl, id, title, artist, existingCascade);

            return {
                id,
                itemType: "song",
                title,
                artist,
                album,
                duration,
                albumId: s.albumId || more.album_id || s.album_id || null,
                genre: album || "MUSE",
                coverUrl: upgradeImageQuality(s.coverUrl || s.image),
                streamUrl: s.streamUrl || cascade[0] || null,
                cascadeUrls: cascade,
                rawMediaUrl: directMediaUrl
            };
        }

        function normalizeSaavnAlbum(a) {

        let signatureAudioCtx = null;
        let signatureAnalyser = null;
        let signatureGraphReady = false;

        function initMuseSignatureSound() {
            if (signatureGraphReady) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                signatureAudioCtx = new AudioCtx({ latencyHint: 'playback' });
                const source = signatureAudioCtx.createMediaElementSource(audio);

                const inputHeadroom = signatureAudioCtx.createGain();
                inputHeadroom.gain.value = 0.92;

                const subSonicClean = signatureAudioCtx.createBiquadFilter();
                subSonicClean.type = 'highpass';
                subSonicClean.frequency.value = 18;
                subSonicClean.Q.value = 0.707;

                const mudClearContour = signatureAudioCtx.createBiquadFilter();
                mudClearContour.type = 'peaking';
                mudClearContour.frequency.value = 240;
                mudClearContour.Q.value = 1.4;
                mudClearContour.gain.value = -0.85;

                const naturalPresence = signatureAudioCtx.createBiquadFilter();
                naturalPresence.type = 'peaking';
                naturalPresence.frequency.value = 3400;
                naturalPresence.Q.value = 0.75;
                naturalPresence.gain.value = 0.45;

                const velvetAirShelf = signatureAudioCtx.createBiquadFilter();
                velvetAirShelf.type = 'highshelf';
                velvetAirShelf.frequency.value = 15500;
                velvetAirShelf.gain.value = 0.75;

                const spatialHighPass = signatureAudioCtx.createBiquadFilter();
                spatialHighPass.type = 'highpass';
                spatialHighPass.frequency.value = 650;

                const spatialLowPass = signatureAudioCtx.createBiquadFilter();
                spatialLowPass.type = 'lowpass';
                spatialLowPass.frequency.value = 11000;

                const haasMicroDelay = signatureAudioCtx.createDelay(0.05);
                haasMicroDelay.delayTime.value = 0.0115;

                const spatialWetGain = signatureAudioCtx.createGain();
                spatialWetGain.gain.value = 0.13;

                const masterBus = signatureAudioCtx.createGain();
                masterBus.gain.value = 1.0;

                signatureAnalyser = signatureAudioCtx.createAnalyser();
                signatureAnalyser.fftSize = 64;
                signatureAnalyser.smoothingTimeConstant = 0.86;

                source
                    .connect(inputHeadroom)
                    .connect(subSonicClean)
                    .connect(mudClearContour)
                    .connect(naturalPresence)
                    .connect(velvetAirShelf)
                    .connect(masterBus);

                velvetAirShelf
                    .connect(spatialHighPass)
                    .connect(spatialLowPass)
                    .connect(haasMicroDelay)
                    .connect(spatialWetGain)
                    .connect(masterBus);

                masterBus
                    .connect(signatureAnalyser)
                    .connect(signatureAudioCtx.destination);

                signatureGraphReady = true;
            } catch (e) {}
        }

        function startMuseBrandGradientLoop() {
            const mainLogo = document.getElementById('main-muse-logo');
            const fullLogo = document.getElementById('full-muse-logo');
            mainLogo?.classList.add('is-playing-brand');
            fullLogo?.classList.add('is-playing-brand');

            if (museBrandRafId) return;
            const bins = signatureAnalyser ? new Uint8Array(signatureAnalyser.frequencyBinCount) : null;
            let lastUpdate = 0;

            const step = (now) => {
                if (audio.paused) {
                    document.documentElement.style.setProperty('--muse-white-stop', '24%');
                    document.documentElement.style.setProperty('--muse-glow-alpha', '0.32');
                    mainLogo?.classList.remove('is-playing-brand');
                    fullLogo?.classList.remove('is-playing-brand');
                    museBrandRafId = null;
                    return;
                }

                if (now - lastUpdate > 55) {
                    lastUpdate = now;
                    let energy = 0.35;
                    if (signatureAnalyser && bins) {
                        signatureAnalyser.getByteFrequencyData(bins);
                        let sum = 0;
                        for (let i = 1; i < 12; i++) sum += bins[i];
                        energy = Math.min(1, Math.max(0.15, sum / (11 * 235)));
                    } else {
                        energy = 0.35 + 0.25 * Math.sin(now * 0.004);
                    }
                    const whiteStop = (14 + energy * 48).toFixed(1);
                    const glowAlpha = (0.30 + energy * 0.46).toFixed(2);
                    document.documentElement.style.setProperty('--muse-white-stop', `${whiteStop}%`);
                    document.documentElement.style.setProperty('--muse-glow-alpha', glowAlpha);
                }

                museBrandRafId = requestAnimationFrame(step);
            };
            museBrandRafId = requestAnimationFrame(step);
        }

        function animateSpring({
            from = 0,
            to = 1,
            velocity = 0,
            stiffness = 350,
            damping = 29,
            mass = 1,
            precision = 0.0015,
            onUpdate,
            onComplete
        }) {
            let x = from;
            let v = velocity;
            let lastTime = performance.now();
            let frameId = null;
            let cancelled = false;

            const accel = (pos, vel) => (-stiffness * (pos - to) - damping * vel) / mass;

            function step(now) {
                if (cancelled) return;
                const dt = Math.min((now - lastTime) / 1000, 0.022);
                lastTime = now;

                if (dt > 0) {
                    const dx1 = v;
                    const dv1 = accel(x, v);

                    const dx2 = v + 0.5 * dt * dv1;
                    const dv2 = accel(x + 0.5 * dt * dx1, v + 0.5 * dt * dv1);

                    const dx3 = v + 0.5 * dt * dv2;
                    const dv3 = accel(x + 0.5 * dt * dx2, v + 0.5 * dt * dv2);

                    const dx4 = v + dt * dv3;
                    const dv4 = accel(x + dt * dx3, v + dt * dv3);

                    x += (dt / 6) * (dx1 + 2 * dx2 + 2 * dx3 + dx4);
                    v += (dt / 6) * (dv1 + 2 * dv2 + 2 * dv3 + dv4);
                }

                if (Math.abs(x - to) <= precision && Math.abs(v) <= precision * 10) {
                    if (onUpdate) onUpdate(to, 0);
                    if (onComplete) onComplete();
                    return;
                }

                if (onUpdate) onUpdate(x, v);
                frameId = requestAnimationFrame(step);
            }

            frameId = requestAnimationFrame(step);
            return () => {
                cancelled = true;
                if (frameId) cancelAnimationFrame(frameId);
                return { position: x, velocity: v };
            };
        }

        function attachLiquidButtonPhysics(btn, compressScale = 0.88, onTap = null) {
            if (!btn) return;
            let currentScale = 1;
            let currentVel = 0;
            let cancelSpring = null;

            const springTo = (target, stiffness, damping, boostVel = 0) => {
                if (cancelSpring) {
                    const state = cancelSpring();
                    currentScale = state.position;
                    currentVel = state.velocity;
                }
                cancelSpring = animateSpring({
                    from: currentScale,
                    to: target,
                    velocity: currentVel + boostVel,
                    stiffness,
                    damping,
                    onUpdate: (s, v) => {
                        currentScale = s;
                        currentVel = v;
                        btn.style.transform = `scale3d(${s.toFixed(4)}, ${s.toFixed(4)}, 1)`;
                    },
                    onComplete: () => {
                        currentScale = target;
                        currentVel = 0;
                        btn.style.transform = target === 1 ? '' : `scale3d(${target}, ${target}, 1)`;
                    }
                });
            };

            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                btn.classList.add('is-pressed');
                springTo(compressScale, 460, 32, -2);
            });

            const release = (e, isTapRelease = false) => {
                if (!btn.classList.contains('is-pressed')) return;
                btn.classList.remove('is-pressed');
                springTo(1, 360, 22, 3);

                if (isTapRelease && onTap) {
                    e.stopPropagation();
                    e.preventDefault();
                    onTap();
                }
            };

            btn.addEventListener('pointerup', (e) => release(e, true));
            btn.addEventListener('pointerleave', (e) => release(e, false));
            btn.addEventListener('pointercancel', (e) => release(e, false));
        }

        function applyThemeColor(imageUrl) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 48;
                    canvas.height = 48;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 48, 48);
                    const data = ctx.getImageData(0, 0, 48, 48).data;

                    let r = 0, g = 0, b = 0, totalWeight = 0;

                    for (let i = 0; i < data.length; i += 16) {
                        const pr = data[i], pg = data[i+1], pb = data[i+2];
                        const max = Math.max(pr, pg, pb);
                        const min = Math.min(pr, pg, pb);
                        const chroma = max - min;
                        const luma = 0.2126 * pr + 0.7152 * pg + 0.0722 * pb;

                        const lumaWeight = (luma > 22 && luma < 235) ? 1.25 : 0.12;
                        const weight = (chroma * 1.9 + 14) * lumaWeight;

                        r += pr * weight;
                        g += pg * weight;
                        b += pb * weight;
                        totalWeight += weight;
                    }

                    if (totalWeight > 0) {
                        r = Math.floor(r / totalWeight);
                        g = Math.floor(g / totalWeight);
                        b = Math.floor(b / totalWeight);
                    }

                    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    if (luma < 110) {
                        const boost = 110 / Math.max(luma, 1);
                        r = Math.min(255, Math.floor(r * boost));
                        g = Math.min(255, Math.floor(g * boost));
                        b = Math.min(255, Math.floor(b * boost));
                    }

                    const darkR = Math.max(10, Math.floor(r * 0.28));
                    const darkG = Math.max(10, Math.floor(g * 0.28));
                    const darkB = Math.max(14, Math.floor(b * 0.30));

                    const brightR = Math.min(255, Math.floor(r * 0.60 + 255 * 0.40));
                    const brightG = Math.min(255, Math.floor(g * 0.60 + 255 * 0.40));
                    const brightB = Math.min(255, Math.floor(b * 0.60 + 255 * 0.40));

                    const rootStyle = document.documentElement.style;
                    rootStyle.setProperty('--theme-r', `${r}`);
                    rootStyle.setProperty('--theme-g', `${g}`);
                    rootStyle.setProperty('--theme-b', `${b}`);
                    rootStyle.setProperty('--theme-dark-r', `${darkR}`);
                    rootStyle.setProperty('--theme-dark-g', `${darkG}`);
                    rootStyle.setProperty('--theme-dark-b', `${darkB}`);
                    rootStyle.setProperty('--theme-bright-r', `${brightR}`);
                    rootStyle.setProperty('--theme-bright-g', `${brightG}`);
                    rootStyle.setProperty('--theme-bright-b', `${brightB}`);

                    rootStyle.setProperty('--theme-color', `rgb(${r}, ${g}, ${b})`);
                    rootStyle.setProperty('--theme-color-bright', `rgb(${brightR}, ${brightG}, ${brightB})`);
                    rootStyle.setProperty('--theme-color-dim', `rgba(${r}, ${g}, ${b}, 0.22)`);
                    rootStyle.setProperty('--theme-color-light', `rgba(${r}, ${g}, ${b}, 0.42)`);
                    rootStyle.setProperty('--theme-color-glow', `rgba(${brightR}, ${brightG}, ${brightB}, 0.55)`);
                    rootStyle.setProperty('--app-bg', `rgb(${Math.floor(r * 0.11)}, ${Math.floor(g * 0.11)}, ${Math.floor(b * 0.14)})`);
                } catch(e) {}
            };
            img.src = imageUrl;
        }
