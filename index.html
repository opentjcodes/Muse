<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030304">
    <title>OpenMuse - Liquid Glass Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        metal: {
                            950: '#030304',
                            900: '#08090a',
                            800: '#121315',
                            700: '#1f2125',
                            400: '#8b949e',
                            200: '#e2e8f0',
                            100: '#ffffff',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --app-bg: #050609;
            --theme-r: 95;
            --theme-g: 115;
            --theme-b: 165;
            --theme-dark-r: 22;
            --theme-dark-g: 28;
            --theme-dark-b: 45;
            --theme-bright-r: 175;
            --theme-bright-g: 200;
            --theme-bright-b: 255;
            --theme-color: rgb(95, 115, 165);
            --theme-color-bright: rgb(175, 200, 255);
            --theme-color-dim: rgba(95, 115, 165, 0.18);
            --theme-color-light: rgba(95, 115, 165, 0.38);
            --theme-color-glow: rgba(135, 165, 235, 0.55);
            --bass-pulse: 0;
            --spring-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input[type="text"], input[type="search"] {
            -webkit-user-select: text;
            user-select: text;
        }

        img, audio {
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        body {
            height: 100dvh;
            width: 100vw;
            background-color: var(--app-bg);
            color: #e2e8f0;
            overflow: hidden;
            touch-action: pan-y;
            transition: background-color 1.1s var(--spring-smooth);
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        #ambient-stage {
            position: fixed;
            inset: -15%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% -8%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.45) 0%, transparent 62%),
                radial-gradient(circle at 88% 92%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.28) 0%, transparent 58%),
                radial-gradient(circle at 12% 78%, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.65) 0%, transparent 60%);
            filter: blur(60px);
            transform: scale(calc(1 + (var(--bass-pulse) * 0.05))) translate3d(0, 0, 0);
            transition: background 1.1s ease;
            will-change: transform, background;
            backface-visibility: hidden;
        }

        #app-shell {
            position: relative;
            z-index: 10;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            will-change: transform, filter;
            backface-visibility: hidden;
        }

        .liquid-glass {
            background: 
                linear-gradient(
                    135deg,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.24) 0%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.46) 55%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.18) 100%
                );
            backdrop-filter: blur(34px) saturate(230%) contrast(1.08);
            -webkit-backdrop-filter: blur(34px) saturate(230%) contrast(1.08);
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.28);
            box-shadow: 
                0 22px 55px -12px rgba(0, 0, 0, 0.72),
                0 6px 28px -8px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.32),
                inset 0 1.5px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.44),
                inset 0 -1.5px 1.5px 0 rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.22),
                inset 1px 0 1.5px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.2);
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            transition: background 0.8s ease, border-color 0.7s ease, box-shadow 0.7s ease;
        }

        .liquid-header-scrolled {
            background: 
                linear-gradient(
                    135deg,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.32) 0%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.68) 100%
                ) !important;
            border-color: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.38) !important;
            box-shadow: 
                0 24px 60px -10px rgba(0, 0, 0, 0.85),
                0 6px 32px -6px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.38),
                inset 0 1.5px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.52) !important;
        }

        .liquid-control-btn {
            position: relative;
            background: 
                radial-gradient(
                    120% 120% at 25% 15%,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.26) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.22) 48%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.42) 100%
                );
            backdrop-filter: blur(22px) saturate(230%) contrast(1.1);
            -webkit-backdrop-filter: blur(22px) saturate(230%) contrast(1.1);
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.34);
            box-shadow: 
                0 14px 32px -6px rgba(0, 0, 0, 0.6),
                0 4px 22px -4px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.35),
                inset 0 1.5px 1px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.52),
                inset 0 -1.5px 2px 0 rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.28);
            color: #ffffff;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            will-change: transform, box-shadow, background;
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .liquid-control-btn:hover {
            border-color: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.58);
            box-shadow: 
                0 16px 36px -6px rgba(0, 0, 0, 0.65),
                0 0 30px -2px var(--theme-color-glow),
                inset 0 2px 1.5px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.68);
        }

        .liquid-control-btn.is-pressed {
            background: 
                radial-gradient(
                    115% 115% at 50% 50%,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.42) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.38) 60%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.5) 100%
                );
            border-color: var(--theme-color-bright);
            box-shadow: 
                0 6px 18px -4px rgba(0, 0, 0, 0.65),
                0 0 38px 2px var(--theme-color-glow),
                inset 0 2px 2.5px 0 var(--theme-color-bright);
        }

        .liquid-hero-play {
            background: 
                radial-gradient(
                    120% 120% at 25% 15%,
                    rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.36) 0%,
                    rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.32) 48%,
                    rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.52) 100%
                );
            border: 1.2px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.48);
            box-shadow: 
                0 18px 46px -8px rgba(0, 0, 0, 0.72),
                0 0 42px -4px var(--theme-color-glow),
                inset 0 2px 1.5px 0 rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.65),
                inset 0 -2px 2.5px 0 rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.36);
            color: #ffffff;
        }

        .liquid-hero-play i,
        .liquid-control-btn i {
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.45));
        }

        .pill-active {
            border-color: var(--theme-color-bright) !important;
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.42) !important;
            color: #ffffff !important;
            box-shadow: 0 0 22px -4px var(--theme-color-glow);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #initial-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: #030304;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.9s var(--spring-smooth), opacity 0.75s ease, filter 0.75s ease;
            overflow: hidden;
        }
        
        .cinematic-intro {
            animation: cinematicScale 1.8s var(--spring-smooth) forwards;
            opacity: 0;
            transform: scale(0.88) translateY(12px);
            z-index: 2;
            letter-spacing: -0.05em;
        }
        
        .cinematic-fade {
            animation: fadeIn 1.4s var(--spring-smooth) 0.5s forwards;
            opacity: 0;
            transform: translateY(10px);
            z-index: 2;
        }

        .loader-bar-track {
            width: 120px;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 2.5rem;
            position: relative;
            z-index: 2;
        }

        .loader-bar-fill {
            width: 42%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
            animation: loaderSweep 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes loaderSweep {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(280%); }
        }

        @keyframes cinematicScale {
            0% { opacity: 0; transform: scale(0.86) translateY(12px); filter: blur(16px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, var(--theme-color-bright) 55%, var(--theme-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #main-scroll-view {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            scroll-behavior: smooth;
            will-change: scroll-position;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.22); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.4); }

        .scrubber-container {
            position: relative;
            padding: 18px 0;
            margin: -10px 0;
            touch-action: none;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 7px;
            background: rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.65);
            border-radius: 99px;
            outline: none;
            background-image: linear-gradient(90deg, var(--theme-color) 0%, var(--theme-color-bright) 100%);
            background-size: var(--progress, 0%) 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            pointer-events: none;
            transition: height 0.32s var(--spring-smooth), box-shadow 0.3s ease;
            box-shadow: 
                inset 0 1px 2px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.24);
        }

        .scrubber-container:hover input[type="range"],
        .scrubber-container.scrubbing input[type="range"] {
            height: 15px;
            box-shadow: 
                0 0 28px var(--theme-color-glow),
                0 0 0 1px var(--theme-color-bright);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 0px;
            height: 0px;
            background: transparent;
        }

        input[type="range"]::-moz-range-thumb {
            width: 0px;
            height: 0px;
            border: none;
            background: transparent;
        }

        #fullscreen-player {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            overflow: hidden;
            touch-action: none;
            pointer-events: auto;
        }

        @media (min-width: 768px) {
            #fullscreen-player {
                padding: 2.75rem;
            }
        }

        #fullscreen-player.closed {
            display: none !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        #fullscreen-backdrop-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(circle at 50% 25%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.42) 0%, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.92) 72%, #040508 100%);
            will-change: opacity;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #fullscreen-ambient-bg {
            position: absolute;
            inset: -25%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.72;
            filter: blur(85px) saturate(240%);
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #fullscreen-ambient-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: auroraDrift 24s ease-in-out infinite alternate;
            transform: scale(calc(1.18 + (var(--bass-pulse) * 0.08)));
        }

        #fullscreen-ambient-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 50% 30%, transparent 0%, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.48) 65%, rgba(4, 5, 8, 0.88) 100%),
                linear-gradient(to bottom, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.18) 0%, rgba(var(--theme-dark-r), var(--theme-dark-g), var(--theme-dark-b), 0.55) 65%, rgba(4, 5, 8, 0.94) 100%);
            pointer-events: none;
        }

        @keyframes auroraDrift {
            0% { transform: rotate(0deg) scale(1.2); }
            50% { transform: rotate(5deg) scale(1.28); }
            100% { transform: rotate(-5deg) scale(1.22); }
        }

        #full-header-chrome,
        #full-bottom-chrome {
            will-change: transform, opacity;
        }

        #swipe-area {
            perspective: 1100px;
            overflow: visible;
            z-index: 20;
            position: relative;
        }

        .reel-cover-card {
            border-radius: 36px;
            box-shadow: 
                0 32px 85px -12px var(--theme-color-glow),
                0 18px 45px -8px rgba(0, 0, 0, 0.85);
            will-change: transform, border-radius, opacity;
            transform-style: preserve-3d;
            transform-origin: center center;
            overflow: hidden;
            background: #08090a;
            border: 1px solid rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.32);
            backface-visibility: hidden;
        }

        #full-cover-outgoing {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            z-index: 19;
        }

        #full-cover-wrapper {
            position: relative;
            z-index: 20;
        }

        #full-cover-wrapper.swipe-threshold-ready {
            box-shadow: 
                0 0 65px 8px var(--theme-color-bright),
                0 25px 70px rgba(0, 0, 0, 0.85) !important;
            border-color: var(--theme-color-bright);
        }

        #apple-lyrics-stage {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translate3d(90px, 0, 0) scale(0.94);
            will-change: transform, opacity;
        }

        #apple-lyrics-stage.lyrics-interactive {
            pointer-events: auto;
        }

        #lyrics-scroll-box {
            height: 100%;
            max-height: 46dvh;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18dvh 1.25rem;
            scroll-behavior: smooth;
            touch-action: pan-y;
            mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 84%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 84%, transparent 100%);
        }

        #lyrics-scroll-box::-webkit-scrollbar {
            display: none;
        }

        .apple-lyric-line {
            font-size: clamp(1.35rem, 4.4vw, 2.05rem);
            font-weight: 800;
            line-height: 1.28;
            letter-spacing: -0.025em;
            margin: 1.15rem 0;
            color: rgba(255, 255, 255, 0.24);
            transform-origin: left center;
            transform: scale(0.93);
            filter: blur(1.15px);
            transition: transform 0.52s var(--spring-smooth), filter 0.48s ease, color 0.42s ease, opacity 0.42s ease;
            cursor: pointer;
            will-change: transform, filter, opacity;
            word-break: break-word;
        }

        .apple-lyric-line.is-past {
            color: rgba(255, 255, 255, 0.18);
            transform: scale(0.92);
            filter: blur(1.4px);
        }

        .apple-lyric-line.is-active {
            color: rgba(255, 255, 255, 0.38);
            transform: scale(1);
            filter: blur(0px);
        }

        .lyric-word {
            display: inline-block;
            margin-right: 0.26em;
            transition: color 0.16s ease, transform 0.24s var(--spring-smooth), text-shadow 0.2s ease;
            will-change: color, transform, text-shadow;
        }

        .apple-lyric-line.is-active .lyric-word.word-sung {
            color: #ffffff;
            text-shadow: 0 0 24px var(--theme-color-glow);
        }

        .apple-lyric-line.is-active .lyric-word.word-current {
            color: #ffffff;
            transform: translateY(-1.5px) scale(1.03);
            text-shadow: 0 0 28px var(--theme-color-bright), 0 0 12px rgba(255,255,255,0.65);
        }

        .apple-lyric-line.line-plain-active {
            color: #ffffff !important;
            text-shadow: 0 0 26px var(--theme-color-glow);
        }

        .catalog-item {
            animation: fadeUp 0.6s var(--spring-smooth) backwards;
            perspective: 900px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-image-wrapper {
            overflow: hidden;
            border-radius: 1.4rem;
            transition: transform 0.45s var(--spring-smooth), box-shadow 0.45s ease, border-color 0.45s ease, opacity 0.45s ease;
            position: relative;
            background: #08090a;
            box-shadow: 0 14px 32px -10px rgba(0, 0, 0, 0.7);
            will-change: transform;
        }

        .card-image-wrapper img {
            transition: transform 0.65s var(--spring-smooth);
        }

        @media (hover: hover) and (pointer: fine) {
            .group:hover .card-image-wrapper img {
                transform: scale(1.06);
            }
            .group:hover .not-playing-card {
                opacity: 1;
                border-color: rgba(var(--theme-bright-r), var(--theme-bright-g), var(--theme-bright-b), 0.4);
                box-shadow: 0 22px 45px -12px rgba(0, 0, 0, 0.85);
            }
        }

        .catalog-item:active .card-image-wrapper {
            transform: scale(0.93) !important;
        }

        .is-playing-card {
            border: 1.5px solid var(--theme-color-bright);
            box-shadow: 0 18px 42px -10px var(--theme-color-glow);
            opacity: 1 !important;
        }

        .not-playing-card {
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0.88;
        }

        .eq-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 13px;
            width: 14px;
        }
        .eq-bar {
            width: 3px;
            background: var(--theme-color-bright);
            border-radius: 99px;
            animation: eqBounce 0.85s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 45%; animation-duration: 0.65s; }
        .eq-bar:nth-child(2) { height: 100%; animation-duration: 0.9s; animation-delay: 0.15s; }
        .eq-bar:nth-child(3) { height: 65%; animation-duration: 0.75s; animation-delay: 0.3s; }
        
        .paused-eq .eq-bar {
            animation-play-state: paused;
            height: 25% !important;
            transition: height 0.3s ease;
        }

        @keyframes eqBounce {
            0% { height: 22%; }
            50% { height: 95%; }
            100% { height: 40%; }
        }

        #mini-player {
            will-change: transform;
            touch-action: none;
            transform-origin: center center;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #mini-cover-wrapper {
            border-radius: 9999px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);

                    .replace(/-/g, "+")
                    .replace(/_/g, "/")
                    .replace(/[^A-Za-z0-9+/=]/g, "");
                while (b64.length % 4 !== 0) b64 += "=";

                const raw = atob(b64);
                const outBytes = [];

                for (let offset = 0; offset < raw.length; offset += 8) {
                    const blockBits = [];
                    for (let i = 0; i < 8; i++) {
                        const byte = raw.charCodeAt(offset + i) || 0;
                        for (let b = 7; b >= 0; b--) blockBits.push((byte >> b) & 1);
                    }
                    const ip = DES_IP.map(p => blockBits[p - 1]);
                    let L = ip.slice(0, 32);
                    let R = ip.slice(32, 64);

                    for (let r = 0; r < 16; r++) {
                        const expR = DES_E.map(p => R[p - 1]);
                        const xored = expR.map((bit, idx) => bit ^ SA_SUBKEYS[r][idx]);
                        const sOut = [];
                        for (let box = 0; box < 8; box++) {
                            const chunk = xored.slice(box * 6, box * 6 + 6);
                            const row = (chunk[0] << 1) | chunk[5];
                            const col = (chunk[1] << 3) | (chunk[2] << 2) | (chunk[3] << 1) | chunk[4];
                            const val = DES_SBOX[box][row * 16 + col];
                            sOut.push((val >> 3) & 1, (val >> 2) & 1, (val >> 1) & 1, val & 1);
                        }
                        const fRes = DES_P.map(p => sOut[p - 1]);
                        const nextR = L.map((bit, idx) => bit ^ fRes[idx]);
                        L = R;
                        R = nextR;
                    }

                    const preFp = R.concat(L);
                    const fp = DES_FP.map(p => preFp[p - 1]);
                    for (let i = 0; i < 8; i++) {
                        let byteVal = 0;
                        for (let b = 0; b < 8; b++) byteVal = (byteVal << 1) | fp[i * 8 + b];
                        outBytes.push(byteVal);
                    }
                }

                const padLen = outBytes[outBytes.length - 1];
                const validLen = (padLen > 0 && padLen <= 8) ? outBytes.length - padLen : outBytes.length;
                let url = String.fromCharCode(...outBytes.slice(0, validLen)).trim();
                if (!url.startsWith("http")) return null;
                url = url
                    .replace(/^http:\/\//i, "https://")
                    .replace("://h.saavncdn.com/", "://aac.saavncdn.com/");
                return has320
                    ? url.replace(/_96\.mp4|_160\.mp4|_96_p\.mp4/g, "_320.mp4")
                    : url.replace(/_96\.mp4|_96_p\.mp4/g, "_160.mp4");
            } catch (e) {
                return null;
            }
        }

        function buildCascadeUrls(rawMediaUrl, songId, title, artist) {
            const list = [];
            if (rawMediaUrl && rawMediaUrl.includes("saavncdn.com")) {
                const norm = rawMediaUrl
                    .replace(/^http:\/\//i, "https://")
                    .replace("://h.saavncdn.com/", "://aac.saavncdn.com/")
                    .replace("://preview.saavncdn.com/", "://aac.saavncdn.com/")
                    .replace(/_96_p\.mp4/g, "_96.mp4");
                const stem = norm.replace(/_(320|160|96)\.mp4$/i, "");
                const hStem = stem.replace("://aac.saavncdn.com/", "://h.saavncdn.com/");
                const pStem = stem.replace("://aac.saavncdn.com/", "://preview.saavncdn.com/");

                list.push(
                    workerStreamUrl(`${stem}_320.mp4`),
                    workerStreamUrl(`${stem}_160.mp4`),
                    workerStreamUrl(`${stem}_96.mp4`),
                    workerStreamUrl(`${hStem}_96.mp4`),
                    workerStreamUrl(`${pStem}_96_p.mp4`)
                );
            } else if (rawMediaUrl) {
                list.push(workerStreamUrl(rawMediaUrl));

                list.push(`${WORKER_BASE}/play?id=${encodeURIComponent(songId)}&title=${encodeURIComponent(title || "")}&artist=${encodeURIComponent(artist || "")}`);

        function animateSpring({
            from = 0,
            to = 1,
            velocity = 0,
            stiffness = 260,
            damping = 20,
            mass = 1,
            precision = 0.001,
            onUpdate,
            onComplete
        }) {
            let x = from;
            let v = velocity;
            let lastTime = performance.now();
            let frameId = null;
            let cancelled = false;

            const accel = (pos, vel) => (-stiffness * (pos - to) - damping * vel) / mass;

            function step(now) {
                if (cancelled) return;
                const dt = Math.min((now - lastTime) / 1000, 0.024);
                lastTime = now;

                if (dt > 0) {
                    const dx1 = v;
                    const dv1 = accel(x, v);

                    const dx2 = v + 0.5 * dt * dv1;
                    const dv2 = accel(x + 0.5 * dt * dx1, v + 0.5 * dt * dv1);

                    const dx3 = v + 0.5 * dt * dv2;
                    const dv3 = accel(x + 0.5 * dt * dx2, v + 0.5 * dt * dv2);

                    const dx4 = v + dt * dv3;
                    const dv4 = accel(x + dt * dx3, v + dt * dv3);

                    x += (dt / 6) * (dx1 + 2 * dx2 + 2 * dx3 + dx4);
                    v += (dt / 6) * (dv1 + 2 * dv2 + 2 * dv3 + dv4);
                }

                if (Math.abs(x - to) <= precision && Math.abs(v) <= precision * 8) {
                    if (onUpdate) onUpdate(to, 0);
                    if (onComplete) onComplete();
                    return;
                }

                if (onUpdate) onUpdate(x, v);
                frameId = requestAnimationFrame(step);
            }

            frameId = requestAnimationFrame(step);
            return () => {
                cancelled = true;
                if (frameId) cancelAnimationFrame(frameId);
                return { position: x, velocity: v };
            };
        }

        function attachLiquidButtonPhysics(btn, compressScale = 0.86, onTap = null, onLongPress = null) {
            if (!btn) return;
            let currentScale = 1;
            let currentVel = 0;
            let cancelSpring = null;
            let longPressTimer = null;
            let longPressTriggered = false;

            const springTo = (target, stiffness, damping, boostVel = 0) => {
                if (cancelSpring) {
                    const state = cancelSpring();
                    currentScale = state.position;
                    currentVel = state.velocity;
                }
                cancelSpring = animateSpring({
                    from: currentScale,
                    to: target,
                    velocity: currentVel + boostVel,
                    stiffness,
                    damping,
                    onUpdate: (s, v) => {
                        currentScale = s;
                        currentVel = v;
                        const delta = s - 1;
                        const sx = 1 + delta * 0.88;
                        const sy = 1 + delta * 1.12;
                        btn.style.transform = `scale3d(${sx.toFixed(4)}, ${sy.toFixed(4)}, 1)`;
                    },
                    onComplete: () => {
                        currentScale = target;
                        currentVel = 0;
                        btn.style.transform = target === 1 ? '' : `scale(${target})`;
                    }
                });
            };

            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                longPressTriggered = false;
                btn.classList.add('is-pressed');
                springTo(compressScale, 440, 28, -2.5);

                if (onLongPress) {
                    clearTimeout(longPressTimer);
                    longPressTimer = setTimeout(() => {
                        longPressTriggered = true;
                        springTo(1.08, 320, 14, 3.5);
                        onLongPress();
                    }, 520);
                }
            });

            const release = (e, isTapRelease = false) => {
                clearTimeout(longPressTimer);
                if (!btn.classList.contains('is-pressed')) return;
                btn.classList.remove('is-pressed');
                springTo(1, 300, 15, 4.0);

                if (isTapRelease && !longPressTriggered && onTap) {
                    e.stopPropagation();
                    e.preventDefault();
                    onTap();
                }
            };

            btn.addEventListener('pointerup', (e) => release(e, true));
            btn.addEventListener('pointerleave', (e) => release(e, false));
            btn.addEventListener('pointercancel', (e) => release(e, false));
        }

        function createWarmthCurve(amount = 1.12) {
            const samples = 44100;
            const curve = new Float32Array(samples);
            for (let i = 0; i < samples; ++i) {
                const x = (i * 2) / samples - 1;
                curve[i] = Math.tanh(x * amount) / Math.tanh(amount);
            }
            return curve;
        }

        function initSpatialAudio() {
            if (audioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                    latencyHint: 'playback'
                });
                trackSource = audioCtx.createMediaElementSource(audio);

                const subCleanFilter = audioCtx.createBiquadFilter();
                subCleanFilter.type = "highpass";
                subCleanFilter.frequency.value = 24;
                subCleanFilter.Q.value = 0.707;

                const subWarmth = audioCtx.createBiquadFilter();
                subWarmth.type = "lowshelf";
                subWarmth.frequency.value = 65;
                subWarmth.gain.value = 3.2;

                const mudDip = audioCtx.createBiquadFilter();
                mudDip.type = "peaking";
                mudDip.frequency.value = 260;
                mudDip.Q.value = 1.4;
                mudDip.gain.value = -1.4;

                const presencePeak = audioCtx.createBiquadFilter();
                presencePeak.type = "peaking";
                presencePeak.frequency.value = 3200;
                presencePeak.Q.value = 0.85;
                presencePeak.gain.value = 1.6;

                const airShelf = audioCtx.createBiquadFilter();
                airShelf.frequency.value = 12500;
                airShelf.type = "highshelf";
                airShelf.gain.value = 2.8;

                const harmonicShaper = audioCtx.createWaveShaper();
                harmonicShaper.curve = createWarmthCurve(1.12);
                harmonicShaper.oversample = "2x";

                const glueCompressor = audioCtx.createDynamicsCompressor();
                glueCompressor.threshold.value = -18;
                glueCompressor.knee.value = 24;
                glueCompressor.ratio.value = 3.5;
                glueCompressor.attack.value = 0.015;
                glueCompressor.release.value = 0.18;

                const limiter = audioCtx.createDynamicsCompressor();
                limiter.threshold.value = -0.8;
                limiter.knee.value = 0.0;
                limiter.ratio.value = 20.0;
                limiter.attack.value = 0.001;
                limiter.release.value = 0.08;

                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = 0.94;

                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 128;
                analyserNode.smoothingTimeConstant = 0.82;

                trackSource
                    .connect(subCleanFilter)
                    .connect(subWarmth)
                    .connect(mudDip)
                    .connect(presencePeak)
                    .connect(airShelf)
                    .connect(harmonicShaper)
                    .connect(glueCompressor)
                    .connect(limiter)
                    .connect(masterGainNode)
                    .connect(analyserNode)
                    .connect(audioCtx.destination);
                
                audioInitialized = true;
            } catch (e) {}
        }

        function startAudioReactiveLoop() {
            if (!analyserNode || reactiveFrameId) return;
            const freqData = new Uint8Array(analyserNode.frequencyBinCount);

            const tick = () => {
                if (audio.paused || !analyserNode) {
                    document.documentElement.style.setProperty('--bass-pulse', '0');
                    reactiveFrameId = null;
                    return;
                }
                analyserNode.getByteFrequencyData(freqData);
                let bassSum = 0;
                for (let i = 1; i <= 5; i++) bassSum += freqData[i];
                const normalizedBass = Math.min(1, Math.max(0, (bassSum / (5 * 255) - 0.35) * 1.6));
                document.documentElement.style.setProperty('--bass-pulse', normalizedBass.toFixed(3));
                reactiveFrameId = requestAnimationFrame(tick);
            };
            reactiveFrameId = requestAnimationFrame(tick);
        }

        function applyThemeColor(imageUrl) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 64; canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 64, 64);
                    const data = ctx.getImageData(0, 0, 64, 64).data;
                    
                    let r = 0, g = 0, b = 0, totalWeight = 0;

                    for (let i = 0; i < data.length; i += 16) {
                        const pr = data[i], pg = data[i+1], pb = data[i+2];
                        const max = Math.max(pr, pg, pb);
                        const min = Math.min(pr, pg, pb);
                        const chroma = max - min;
                        const luma = 0.2126 * pr + 0.7152 * pg + 0.0722 * pb;

                        const lumaWeight = (luma > 22 && luma < 235) ? 1.2 : 0.12;
                        const weight = (chroma * 1.8 + 14) * lumaWeight;

                        r += pr * weight;
                        g += pg * weight;
                        b += pb * weight;
                        totalWeight += weight;
                    }
                    
                    if (totalWeight > 0) {
                        r = Math.floor(r / totalWeight);
                        g = Math.floor(g / totalWeight);
                        b = Math.floor(b / totalWeight);
                    }

                    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    if (luma < 105) {
                        const boost = 105 / Math.max(luma, 1);
                        r = Math.min(255, Math.floor(r * boost));
                        g = Math.min(255, Math.floor(g * boost));
                        b = Math.min(255, Math.floor(b * boost));
                    }

                    const darkR = Math.max(8, Math.floor(r * 0.28));
                    const darkG = Math.max(8, Math.floor(g * 0.28));
                    const darkB = Math.max(10, Math.floor(b * 0.30));

                    const brightR = Math.min(255, Math.floor(r * 0.68 + 255 * 0.32));
                    const brightG = Math.min(255, Math.floor(g * 0.68 + 255 * 0.32));
                    const brightB = Math.min(255, Math.floor(b * 0.68 + 255 * 0.32));

                    document.documentElement.style.setProperty('--theme-r', `${r}`);
                    document.documentElement.style.setProperty('--theme-g', `${g}`);
                    document.documentElement.style.setProperty('--theme-b', `${b}`);
                    document.documentElement.style.setProperty('--theme-dark-r', `${darkR}`);
                    document.documentElement.style.setProperty('--theme-dark-g', `${darkG}`);
                    document.documentElement.style.setProperty('--theme-dark-b', `${darkB}`);
                    document.documentElement.style.setProperty('--theme-bright-r', `${brightR}`);
                    document.documentElement.style.setProperty('--theme-bright-g', `${brightG}`);
                    document.documentElement.style.setProperty('--theme-bright-b', `${brightB}`);

                    document.documentElement.style.setProperty('--theme-color', `rgb(${r}, ${g}, ${b})`);
                    document.documentElement.style.setProperty('--theme-color-bright', `rgb(${brightR}, ${brightG}, ${brightB})`);
                    document.documentElement.style.setProperty('--theme-color-dim', `rgba(${r}, ${g}, ${b}, 0.22)`);
                    document.documentElement.style.setProperty('--theme-color-light', `rgba(${r}, ${g}, ${b}, 0.42)`);
                    document.documentElement.style.setProperty('--theme-color-glow', `rgba(${brightR}, ${brightG}, ${brightB}, 0.58)`);
                    document.documentElement.style.setProperty('--app-bg', `rgb(${Math.floor(r * 0.14)}, ${Math.floor(g * 0.14)}, ${Math.floor(b * 0.16)})`);
                } catch(e) {
                    resetTheme();
                }
            };
            img.onerror = resetTheme;
            img.src = imageUrl;
        }

        let morphVectors = { dx: 0, dy: 0, scale: 0.15, fullWidth: 350 };

        lyricsScrollBox.addEventListener('touchstart', () => {
            userScrollingLyricsUntil = performance.now() + 2600;
        }, { passive: true });

        lyricsScrollBox.addEventListener('wheel', () => {
            userScrollingLyricsUntil = performance.now() + 2600;
        }, { passive: true });

        function applyLyricsStageTransition(progress) {
            const p = Math.max(0, Math.min(1, progress));
            currentLyricsProgress = p;
            const baseScale = audio.paused ? 0.92 : 1.0;

            const coverX = -p * 115;
            const coverScale = baseScale * (1 - p * 0.22);
            const coverRotY = -p * 22;
            const coverOpacity = Math.max(0, 1 - p * 1.25);

            coverWrapper.style.opacity = coverOpacity.toFixed(3);
            coverWrapper.style.transform = `translate3d(${coverX.toFixed(1)}px, 0, ${(-p * 90).toFixed(1)}px) scale(${coverScale.toFixed(4)}) rotateY(${coverRotY.toFixed(1)}deg)`;
            coverWrapper.style.pointerEvents = p > 0.5 ? 'none' : 'auto';

            const lyricsX = (1 - p) * 105;
            const lyricsScale = 0.92 + p * 0.08;
            appleLyricsStage.style.opacity = p.toFixed(3);
            appleLyricsStage.style.transform = `translate3d(${lyricsX.toFixed(1)}px, 0, 0) scale(${lyricsScale.toFixed(4)})`;

            if (p > 0.5) {
                appleLyricsStage.classList.add('lyrics-interactive');
                fullLyricsBtn.classList.add('pill-active');
            } else {
                appleLyricsStage.classList.remove('lyrics-interactive');
                fullLyricsBtn.classList.remove('pill-active');
            }
        }

        window.setLyricsPanelState = (open, initialVelocity = 0) => {
            if (activeLyricsPanelCancel) {
                activeLyricsPanelCancel();
                activeLyricsPanelCancel = null;
            }
            isLyricsOpen = open;
            const target = open ? 1 : 0;

            activeLyricsPanelCancel = animateSpring({
                from: currentLyricsProgress,
                to: target,
                velocity: initialVelocity,
                stiffness: 265,
                damping: 22,
                onUpdate: (val) => {
                    applyLyricsStageTransition(val);
                },
                onComplete: () => {
                    applyLyricsStageTransition(target);
                    activeLyricsPanelCancel = null;
                    if (open) {
                        scrollToActiveLyricLine(true);
                    }
                }
            });
        };

        window.toggleLyricsPanel = () => {
            setLyricsPanelState(!isLyricsOpen);
        };

        function parseLrcClientFallback(lrcText, totalDur = 180) {
            if (!lrcText) return [];
            const rows = lrcText.split(/\r?\n/);
            const timeRx = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
            const entries = [];
            for (const row of rows) {
                let m;
                timeRx.lastIndex = 0;
                const stamps = [];
                while ((m = timeRx.exec(row)) !== null) {
                    const min = parseInt(m[1], 10);
                    const sec = parseInt(m[2], 10);
                    const f = m[3] || "0";
                    const ms = f.length === 1 ? parseInt(f, 10) * 100 : f.length === 2 ? parseInt(f, 10) * 10 : parseInt(f.slice(0, 3), 10);
                    stamps.push(min * 60 + sec + ms / 1000);
                }
                if (!stamps.length) continue;
                const txt = row.replace(timeRx, "").trim() || "♪";
                for (const t of stamps) entries.push({ time: t, text: txt });
            }
            entries.sort((a, b) => a.time - b.time);
            return entries.map((e, i) => {
                const next = entries[i + 1];
                const endTime = next ? Math.max(e.time + 0.25, next.time) : Math.max(e.time + 4, totalDur);
                const dur = Math.max(0.25, endTime - e.time);
                const rawWords = e.text.split(/\s+/).filter(Boolean);
                const totalChars = Math.max(1, rawWords.reduce((s, w) => s + w.length, 0));
                let cur = e.time;
                const words = rawWords.map((w, wi) => {
                    const wDur = dur * (w.length / totalChars);
                    const ws = cur;
                    const we = wi === rawWords.length - 1 ? endTime : cur + wDur;
                    cur += wDur;
                    return { word: w, time: ws, endTime: we };
                });
                return { index: i, time: e.time, endTime, duration: dur, text: e.text, words };
            });
        }

        async function loadLyricsForTrack(track) {
            activeLyricsTimeline = [];
            activeLyricLineIndex = -1;
            lyricsLinesWrapper.innerHTML = `<div class="apple-lyric-line is-active" style="filter:none;opacity:0.55;">Loading synced lyrics...</div>`;

            if (!track) return;
            if (lyricsCache.has(track.id)) {
                renderLyricsTimeline(lyricsCache.get(track.id));
                return;
            }

            const reqTrackId = track.id;

            try {
                const workerLyricsUrl = `${WORKER_BASE}/lyrics?id=${encodeURIComponent(track.id)}&trackName=${encodeURIComponent(track.title)}&artistName=${encodeURIComponent(track.artist)}&albumName=${encodeURIComponent(track.album || "")}&duration=${track.duration || 0}`;
                const res = await fetch(workerLyricsUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data?.lines) && data.lines.length > 0) {
                        lyricsCache.set(reqTrackId, data.lines);
                        if (activeTrack && activeTrack.id === reqTrackId) {
                            renderLyricsTimeline(data.lines);
                        }
                        return;
                    }
                }
            } catch (e) {}

            try {
                const cleanQ = `${track.title.replace(/\([^)]*\)|\[[^\]]*\]/g, "").trim()} ${track.artist.split(",")[0].trim()}`.trim();
                const lrcData = await fetchViaWorkerJson(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanQ)}`);
                if (Array.isArray(lrcData) && lrcData.length > 0) {
                    const best = lrcData.find(x => x.syncedLyrics) || lrcData[0];
                    if (best?.syncedLyrics) {
                        const parsed = parseLrcClientFallback(best.syncedLyrics, track.duration || best.duration || 180);
                        lyricsCache.set(reqTrackId, parsed);
                        if (activeTrack && activeTrack.id === reqTrackId) {
                            renderLyricsTimeline(parsed);
                        }
                        return;
                    } else if (best?.plainLyrics) {
                        const plainLines = best.plainLyrics.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map((txt, idx) => ({
                            index: idx,
                            time: idx * 4,
                            endTime: (idx + 1) * 4,
                            text: txt,
                            plainOnly: true,
                            words: []
                        }));
                        lyricsCache.set(reqTrackId, plainLines);
                        if (activeTrack && activeTrack.id === reqTrackId) {
                            renderLyricsTimeline(plainLines);
                        }
                        return;
                    }
                }
            } catch (e) {}

            if (activeTrack && activeTrack.id === reqTrackId) {
                lyricsLinesWrapper.innerHTML = `<div class="apple-lyric-line is-active" style="filter:none;opacity:0.45;">Lyrics unavailable for this track</div>`;
            }
        }

        function renderLyricsTimeline(lines) {
            activeLyricsTimeline = lines || [];
            activeLyricLineIndex = -1;
            lyricsLinesWrapper.innerHTML = '';

            if (!activeLyricsTimeline.length) {
                lyricsLinesWrapper.innerHTML = `<div class="apple-lyric-line is-active" style="filter:none;opacity:0.45;">Lyrics unavailable for this track</div>`;
                return;
            }

            activeLyricsTimeline.forEach((line, idx) => {
                const lineEl = document.createElement('div');
                lineEl.className = 'apple-lyric-line';
                lineEl.dataset.index = idx;

                if (Array.isArray(line.words) && line.words.length > 0 && !line.plainOnly) {
                    lineEl.innerHTML = line.words.map((w, wIdx) =>
                        `<span class="lyric-word" data-widx="${wIdx}">${w.word}</span>`
                    ).join('');
                } else {
                    lineEl.textContent = line.text;
                }

                lineEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (audio.duration && typeof line.time === 'number') {
                        userScrollingLyricsUntil = 0;
                        audio.currentTime = line.time;
                        if (audio.paused) togglePlayPause();
                        syncLyricsToCurrentTime(true);
                    }
                });

                lyricsLinesWrapper.appendChild(lineEl);
            });

            syncLyricsToCurrentTime(true);
        }

        function scrollToActiveLyricLine(force = false) {
            if (!force && performance.now() < userScrollingLyricsUntil) return;
            const activeEl = lyricsLinesWrapper.children[activeLyricLineIndex];
            if (!activeEl) return;

            const boxRect = lyricsScrollBox.getBoundingClientRect();
            const lineRect = activeEl.getBoundingClientRect();
            const offset = (lineRect.top - boxRect.top) - (boxRect.height * 0.36) + (lineRect.height * 0.5);
            lyricsScrollBox.scrollBy({ top: offset, behavior: 'smooth' });
        }

        function syncLyricsToCurrentTime(forceScroll = false) {
            if (!activeLyricsTimeline.length) return;
            const t = audio.currentTime || 0;

            let newActiveIdx = -1;
            for (let i = 0; i < activeLyricsTimeline.length; i++) {
                const item = activeLyricsTimeline[i];
                if (t >= item.time && t <= item.endTime) {
                    newActiveIdx = i;
                    break;
                } else if (t >= item.time) {
                    newActiveIdx = i;
                }
            }

            const lineNodes = lyricsLinesWrapper.children;
            if (newActiveIdx !== activeLyricLineIndex) {
                activeLyricLineIndex = newActiveIdx;
                for (let i = 0; i < lineNodes.length; i++) {
                    const node = lineNodes[i];
                    const item = activeLyricsTimeline[i];
                    node.classList.remove('is-active', 'is-past', 'line-plain-active');
                    if (i < activeLyricLineIndex) {
                        node.classList.add('is-past');
                    } else if (i === activeLyricLineIndex) {
                        node.classList.add('is-active');
                        if (!item?.words?.length || item.plainOnly) {
                            node.classList.add('line-plain-active');
                        }
                    }
                }
                scrollToActiveLyricLine(forceScroll);
            }

            if (activeLyricLineIndex >= 0) {
                const activeItem = activeLyricsTimeline[activeLyricLineIndex];
                const activeNode = lineNodes[activeLyricLineIndex];
                if (activeItem?.words?.length && activeNode && !activeItem.plainOnly) {
                    const wordSpans = activeNode.children;
                    for (let w = 0; w < wordSpans.length; w++) {
                        const wMeta = activeItem.words[w];
                        const span = wordSpans[w];
                        if (!wMeta || !span) continue;
                        if (t >= wMeta.endTime) {
                            span.className = 'lyric-word word-sung';
                        } else if (t >= wMeta.time && t < wMeta.endTime) {
                            span.className = 'lyric-word word-current';
                        } else {
                            span.className = 'lyric-word';
                        }
                    }
                }
            }
        }

        function startLyricsSyncLoop() {
            if (lyricsRafId) return;
            const step = () => {
                if (audio.paused) {
                    lyricsRafId = null;
                    return;
                }
                if (isPlayerOpen && activeLyricsTimeline.length > 0) {
                    syncLyricsToCurrentTime(false);
                }
                lyricsRafId = requestAnimationFrame(step);
            };
            lyricsRafId = requestAnimationFrame(step);
        }

        function measureMorphGeometry() {
            const prevAppTransform = appShell.style.transform;
            const prevCoverTransform = coverWrapper.style.transform;
            const prevMiniTransform = miniPlayerEl.style.transform;
            appShell.style.transform = 'none';
            coverWrapper.style.transform = 'none';
            miniPlayerEl.style.transform = 'none';

            const fullRect = coverWrapper.getBoundingClientRect();
            const miniRect = miniCoverWrapper.getBoundingClientRect();

            appShell.style.transform = prevAppTransform;
            coverWrapper.style.transform = prevCoverTransform;
            miniPlayerEl.style.transform = prevMiniTransform;

            if (fullRect.width > 0 && miniRect.width > 0) {
                const fullCenterX = fullRect.left + fullRect.width / 2;
                const fullCenterY = fullRect.top + fullRect.height / 2;
                const miniCenterX = miniRect.left + miniRect.width / 2;
                const miniCenterY = miniRect.top + miniRect.height / 2;

                morphVectors = {
                    dx: miniCenterX - fullCenterX,
                    dy: miniCenterY - fullCenterY,
                    scale: miniRect.width / fullRect.width,
                    fullWidth: fullRect.width
                };
            }
        }

        window.addEventListener('resize', () => {
            if (isPlayerOpen) measureMorphGeometry();
        });

        function applyMorphState(progress, fingerOffsetX = 0, fingerOffsetY = 0) {
            const clampedP = Math.max(0, Math.min(1, progress));
            const baseRestScale = audio.paused ? 0.92 : 1.0;
            currentCoverRestScale = baseRestScale;

            const blend = 1 - clampedP;
            const currentX = (morphVectors.dx * progress) + (fingerOffsetX * blend);
            const currentY = (morphVectors.dy * progress) + (fingerOffsetY * blend);
            const currentScale = Math.max(0.06, baseRestScale + (morphVectors.scale - baseRestScale) * progress);

            const targetCircleRadius = morphVectors.fullWidth * 0.5;
            const cubicRadiusProgress = Math.pow(clampedP, 2.6);
            const borderRadiusPx = 36 + (targetCircleRadius - 36) * cubicRadiusProgress;

            coverWrapper.style.opacity = '1';
            coverWrapper.style.transform = `translate3d(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px, 0) scale(${currentScale.toFixed(4)})`;
            coverWrapper.style.borderRadius = `${borderRadiusPx.toFixed(1)}px`;

            const chromeOpacity = Math.max(0, Math.min(1, 1 - (clampedP * 1.45)));
            const backdropOpacity = Math.max(0, Math.min(1, 1 - Math.pow(clampedP, 0.85)));
            backdropLayer.style.opacity = backdropOpacity.toFixed(3);
            headerChrome.style.opacity = chromeOpacity.toFixed(3);
            headerChrome.style.transform = `translate3d(0, ${(-progress * 26).toFixed(1)}px, 0)`;
            bottomChrome.style.opacity = chromeOpacity.toFixed(3);
            bottomChrome.style.transform = `translate3d(0, ${(progress * 42).toFixed(1)}px, 0)`;

            const shellScale = 0.94 + (0.06 * progress);
            const shellY = 10 * (1 - clampedP);
            const shellBlur = 5.5 * (1 - clampedP);
            const shellBrightness = 0.65 + (0.35 * clampedP);
            appShell.style.transform = `scale(${shellScale.toFixed(4)}) translate3d(0, ${shellY.toFixed(1)}px, 0)`;
            appShell.style.filter = clampedP >= 0.99 ? 'none' : `blur(${shellBlur.toFixed(2)}px) brightness(${shellBrightness.toFixed(2)})`;

            if (progress > 0.92) {
                const overshoot = progress - 1.0;
                const pillDisplacementY = overshoot * 28;
                const pillScaleX = 1 + overshoot * 0.06;
                const pillScaleY = 1 - overshoot * 0.06;
                miniPlayerEl.style.transform = `translate3d(0, ${pillDisplacementY.toFixed(2)}px, 0) scale3d(${pillScaleX.toFixed(4)}, ${pillScaleY.toFixed(4)}, 1)`;
            } else {
                miniPlayerEl.style.transform = '';
            }
        }

        window.openFullscreenPlayer = () => {
            let startPos = 1;
            let startVel = -2.2;

            if (activeMorphCancel) {
                const state = activeMorphCancel();
                startPos = state.position;
                startVel = state.velocity - 1.2;
                activeMorphCancel = null;
            }
            if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }

            isLyricsOpen = false;
            currentLyricsProgress = 0;
            appleLyricsStage.style.opacity = '0';
            appleLyricsStage.classList.remove('lyrics-interactive');
            fullLyricsBtn.classList.remove('pill-active');

            if (activeTrack && fullCoverImg.src !== activeTrack.coverUrl) {
                fullCoverImg.src = activeTrack.coverUrl;
            }
            coverWrapper.style.opacity = '1';
            coverWrapper.style.pointerEvents = 'auto';
            outgoingCard.style.opacity = '0';
            outgoingCard.style.visibility = 'hidden';

            requestAppFullscreen();
            playerEl.classList.remove('closed');
            playerEl.style.pointerEvents = 'auto';

            bottomChrome.style.pointerEvents = 'none';
            headerChrome.style.pointerEvents = 'none';
            setTimeout(() => {
                if (isPlayerOpen) {
                    bottomChrome.style.pointerEvents = 'auto';
                    headerChrome.style.pointerEvents = 'auto';
                }
            }, 340);

            isPlayerOpen = true;
            measureMorphGeometry();
            miniCoverWrapper.style.opacity = '0';

            applyMorphState(startPos, 0, 0);

            activeMorphCancel = animateSpring({
                from: startPos,
                to: 0,
                velocity: startVel,
                stiffness: 255,
                damping: 20,
                onUpdate: (val, vel) => {
                    liveMorphState = { position: val, velocity: vel };
                    applyMorphState(val, 0, 0);
                },
                onComplete: () => {
                    liveMorphState = { position: 0, velocity: 0 };
                    applyMorphState(0, 0, 0);
                    miniPlayerEl.style.transform = '';
                    activeMorphCancel = null;
                }
            });
        };

        window.closeFullscreenPlayer = (startProgress = null, releaseVelocity = 1.8, fingerX = 0, fingerY = 0) => {
            let initialPos = startProgress !== null ? startProgress : 0;
            let initialVel = releaseVelocity;

            if (activeMorphCancel) {
                const state = activeMorphCancel();
                if (startProgress === null) initialPos = state.position;
                initialVel += state.velocity * 0.5;
                activeMorphCancel = null;
            }
            if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }
            if (activeOutgoingCancel) { activeOutgoingCancel(); activeOutgoingCancel = null; }
            if (activeLyricsPanelCancel) { activeLyricsPanelCancel(); activeLyricsPanelCancel = null; }

            isLyricsOpen = false;
            currentLyricsProgress = 0;
            appleLyricsStage.style.opacity = '0';
            appleLyricsStage.classList.remove('lyrics-interactive');
            fullLyricsBtn.classList.remove('pill-active');

            isPlayerOpen = false;
            playerEl.style.pointerEvents = 'none';
            bottomChrome.style.pointerEvents = 'none';
            headerChrome.style.pointerEvents = 'none';
            outgoingCard.style.opacity = '0';
            outgoingCard.style.visibility = 'hidden';

            measureMorphGeometry();
            miniCoverWrapper.style.opacity = '0';

            activeMorphCancel = animateSpring({
                from: initialPos,
                to: 1,
                velocity: initialVel,
                stiffness: 275,
                damping: 22,
                onUpdate: (val, vel) => {
                    liveMorphState = { position: val, velocity: vel };
                    const remaining = Math.max(0, (1 - Math.min(1, val)) / Math.max(0.001, 1 - initialPos));
                    applyMorphState(val, fingerX * remaining, fingerY * remaining);
                },
                onComplete: () => {
                    liveMorphState = { position: 1, velocity: 0 };
                    miniCoverWrapper.style.opacity = '1';
                    playerEl.classList.add('closed');
                    appShell.style.transform = '';
                    appShell.style.filter = '';
                    miniPlayerEl.style.transform = '';
                    coverWrapper.style.transform = '';
                    activeMorphCancel = null;
                }
            });
        };

        const GESTURE_DEADZONE_PX = 16;
        const TRACK_SWIPE_MIN_PX = 85;
        const TRACK_SWIPE_FAST_PX = 55;
        const TRACK_SWIPE_MIN_VELOCITY = 0.65;

        let startX = 0, startY = 0;
        let lastX = 0, lastY = 0;
        let lastMoveTime = 0;
        let touchStartTime = 0;
        let velocityX = 0, velocityY = 0;
        let isGestureActive = false;
        let lockedAxis = null;

        [swipeArea, headerChrome].forEach(zone => {
            zone.addEventListener('touchstart', (e) => {
                if (!isPlayerOpen) return;
                if (e.target.closest('button') || e.target.closest('#scrubber-hit-zone') || e.target.tagName.toLowerCase() === 'input') return;
                if (activeMorphCancel) { activeMorphCancel(); activeMorphCancel = null; }
                if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }
                if (activeLyricsPanelCancel) { activeLyricsPanelCancel(); activeLyricsPanelCancel = null; }

                const t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                lastX = startX;
                lastY = startY;
                touchStartTime = performance.now();
                lastMoveTime = touchStartTime;
                velocityX = 0;
                velocityY = 0;
                isGestureActive = true;
                lockedAxis = null;

                measureMorphGeometry();
            }, { passive: true });

            zone.addEventListener('touchmove', (e) => {
                if (!isPlayerOpen || !isGestureActive) return;
                const t = e.touches[0];
                const now = performance.now();
                const dt = Math.max(1, now - lastMoveTime);

                const rawDx = t.clientX - startX;
                const rawDy = t.clientY - startY;

                velocityX = 0.7 * ((t.clientX - lastX) / dt) + 0.3 * velocityX;
                velocityY = 0.7 * ((t.clientY - lastY) / dt) + 0.3 * velocityY;
                lastX = t.clientX;
                lastY = t.clientY;
                lastMoveTime = now;

                if (!lockedAxis) {
                    const totalDist = Math.hypot(rawDx, rawDy);
                    if (totalDist < GESTURE_DEADZONE_PX) return;

                    if (zone === headerChrome && rawDy > 0) {
                        lockedAxis = 'dismiss-morph';
                        miniCoverWrapper.style.opacity = '0';
                    } else if (Math.abs(rawDx) > Math.abs(rawDy) * 1.15) {
                        if (!isLyricsOpen && rawDx < 0 && zone === swipeArea) {
                            lockedAxis = 'lyrics-swipe-open';
                        } else if (isLyricsOpen && rawDx > 0) {
                            lockedAxis = 'lyrics-swipe-close';
                        } else if (!isLyricsOpen && rawDx > 0) {
                            lockedAxis = 'dismiss-morph';
                            miniCoverWrapper.style.opacity = '0';
                        } else {
                            return;
                        }
                    } else if (!isLyricsOpen && Math.abs(rawDy) > Math.abs(rawDx) * 1.1 && zone === swipeArea) {
                        lockedAxis = 'vertical-track';
                    } else {
                        return;
                    }
                }

                if (lockedAxis === 'lyrics-swipe-open') {
                    const dragP = Math.min(1, Math.max(0, Math.abs(rawDx) / (window.innerWidth * 0.55)));
                    applyLyricsStageTransition(dragP);
                } else if (lockedAxis === 'lyrics-swipe-close') {
                    const dragP = Math.max(0, Math.min(1, 1 - (rawDx / (window.innerWidth * 0.55))));
                    applyLyricsStageTransition(dragP);
                } else if (lockedAxis === 'dismiss-morph') {
                    const effectiveDrag = Math.max(0, rawDx * 0.9 + Math.max(0, rawDy) * 0.65);
                    const progress = Math.min(0.92, effectiveDrag / (window.innerWidth * 0.65));
                    const fingerFollowX = rawDx * 0.32;
                    const fingerFollowY = rawDy * 0.32;
                    applyMorphState(progress, fingerFollowX, fingerFollowY);

                } else if (lockedAxis === 'vertical-track') {
                    const adjDy = rawDy - Math.sign(rawDy) * GESTURE_DEADZONE_PX;
                    const dampedY = Math.sign(adjDy) * Math.pow(Math.abs(adjDy), 0.85) * 1.5;
                    const wheelProgress = Math.min(1, Math.abs(dampedY) / (window.innerHeight * 0.55));
                    const baseScale = audio.paused ? 0.92 : 1.0;
                    const dragScale = Math.max(0.78, baseScale - wheelProgress * 0.2);
                    const wheelRotateX = Math.max(-28, Math.min(28, -dampedY / 11));

                    coverWrapper.style.opacity = `${Math.max(0.35, 1 - wheelProgress * 0.6).toFixed(3)}`;
                    coverWrapper.style.transform = `translate3d(0, ${dampedY.toFixed(1)}px, ${(-wheelProgress * 90).toFixed(1)}px) scale(${dragScale.toFixed(3)}) rotateX(${wheelRotateX.toFixed(2)}deg)`;

                    if (Math.abs(rawDy) >= TRACK_SWIPE_MIN_PX) {
                        coverWrapper.classList.add('swipe-threshold-ready');
                    } else {
                        coverWrapper.classList.remove('swipe-threshold-ready');
                    }
                }
            }, { passive: true });

            zone.addEventListener('touchend', () => {
                if (!isGestureActive) return;
                isGestureActive = false;
                coverWrapper.classList.remove('swipe-threshold-ready');

                if (!lockedAxis || !isPlayerOpen) {
                    lockedAxis = null;
                    return;
                }

                const rawDx = lastX - startX;
                const rawDy = lastY - startY;
                const gestureDuration = performance.now() - touchStartTime;

                if (lockedAxis === 'lyrics-swipe-open') {
                    const shouldOpen = rawDx < -52 || velocityX < -0.45;
                    setLyricsPanelState(shouldOpen, Math.abs(velocityX) * 1.8);
                } else if (lockedAxis === 'lyrics-swipe-close') {
                    const shouldCloseLyrics = rawDx > 52 || velocityX > 0.45;
                    setLyricsPanelState(!shouldCloseLyrics, -Math.abs(velocityX) * 1.8);
                } else if (lockedAxis === 'dismiss-morph') {
                    const effectiveDrag = Math.max(0, rawDx * 0.9 + Math.max(0, rawDy) * 0.65);
                    const currentProgress = Math.min(0.92, effectiveDrag / (window.innerWidth * 0.65));
                    const shouldClose = effectiveDrag > 90 || (effectiveDrag > 42 && (velocityX > 0.5 || velocityY > 0.5));

                    if (shouldClose) {
                        closeFullscreenPlayer(
                            currentProgress,
                            Math.max(1.6, Math.hypot(velocityX, velocityY) * 1.9),
                            rawDx * 0.32,
                            rawDy * 0.32
                        );
                    } else {
                        activeMorphCancel = animateSpring({
                            from: currentProgress,
                            to: 0,
                            velocity: -1.8,
                            stiffness: 260,
                            damping: 19,
                            onUpdate: (val) => {
                                const ratio = currentProgress > 0 ? Math.max(0, val / currentProgress) : 0;
                                applyMorphState(val, rawDx * 0.32 * ratio, rawDy * 0.32 * ratio);
                            },
                            onComplete: () => {
                                miniCoverWrapper.style.opacity = '1';
                                applyMorphState(0, 0, 0);
                                activeMorphCancel = null;
                            }
                        });
                    }
                } else if (lockedAxis === 'vertical-track') {
                    const absDy = Math.abs(rawDy);
                    const absVy = Math.abs(velocityY);

                    const isDeliberateSwipe =
                        absDy >= TRACK_SWIPE_MIN_PX ||
                        (absDy >= TRACK_SWIPE_FAST_PX && absVy >= TRACK_SWIPE_MIN_VELOCITY && gestureDuration >= 55);

                    const adjDy = rawDy - Math.sign(rawDy) * GESTURE_DEADZONE_PX;
                    const currentDampedY = Math.sign(adjDy) * Math.pow(Math.abs(adjDy), 0.85) * 1.5;

                    if (isDeliberateSwipe) {
                        if (rawDy < 0) {
                            playNextTrack(true, currentDampedY, velocityY * 950);
                        } else {
                            playPrevTrack(true, currentDampedY, velocityY * 950);
                        }
                    } else {
                        const restScale = audio.paused ? 0.92 : 1.0;
                        activeCoverCancel = animateSpring({
                            from: currentDampedY,
                            to: 0,
                            velocity: velocityY * 450,
                            stiffness: 270,
                            damping: 18,
                            onUpdate: (yVal, vVal) => {
                                liveCoverState = { position: yVal, velocity: vVal };
                                const progressRatio = Math.min(1, Math.abs(yVal) / 260);
                                const s = restScale - progressRatio * 0.12;
                                const tilt = Math.max(-24, Math.min(24, -yVal / 12));
                                coverWrapper.style.opacity = `${Math.max(0.4, 1 - progressRatio * 0.5).toFixed(3)}`;
                                coverWrapper.style.transform = `translate3d(0, ${yVal.toFixed(2)}px, 0) scale(${s.toFixed(4)}) rotateX(${tilt.toFixed(2)}deg)`;
                            },
                            onComplete: () => {
                                liveCoverState = { position: 0, velocity: 0 };
                                coverWrapper.style.opacity = '1';
                                coverWrapper.style.transform = `translate3d(0, 0, 0) scale(${restScale})`;
                                activeCoverCancel = null;
                            }
                        });
                    }
                }
                lockedAxis = null;
            });
        });

        let miniStartX = 0, miniStartY = 0;
        let miniLastX = 0, miniLastY = 0;
        let miniAxis = null;
        let miniTouchTime = 0;
        let isMiniTouching = false;

        miniPlayerEl.addEventListener('touchstart', (e) => {
            if (e.target.closest('#mini-play-zone') || e.target.closest('button')) return;
            const t = e.touches[0];
            miniStartX = t.clientX;
            miniStartY = t.clientY;
            miniLastX = miniStartX;
            miniLastY = miniStartY;
            miniAxis = null;
            miniTouchTime = performance.now();
            isMiniTouching = true;
        }, { passive: true });

        miniPlayerEl.addEventListener('touchmove', (e) => {
            if (!isMiniTouching) return;
            const t = e.touches[0];
            miniLastX = t.clientX;
            miniLastY = t.clientY;
            const dx = miniLastX - miniStartX;
            const dy = miniLastY - miniStartY;

            if (!miniAxis) {
                if (Math.hypot(dx, dy) < 14) return;
                miniAxis = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
            }

            if (miniAxis === 'horizontal') {
                const dampedX = Math.sign(dx) * Math.pow(Math.abs(dx), 0.78) * 1.25;
                miniPlayerEl.style.transform = `translate3d(${dampedX.toFixed(1)}px, 0, 0) scale(0.985)`;
            } else if (miniAxis === 'vertical' && dy < 0) {
                const dampedY = -Math.pow(Math.abs(dy), 0.8) * 1.15;
                miniPlayerEl.style.transform = `translate3d(0, ${dampedY.toFixed(1)}px, 0) scale(1.02)`;
            }
        }, { passive: true });

        miniPlayerEl.addEventListener('touchend', (e) => {
            if (!isMiniTouching) return;
            isMiniTouching = false;

            if (e.cancelable) e.preventDefault();
            e.stopPropagation();

            const dx = miniLastX - miniStartX;
            const dy = miniLastY - miniStartY;
            const dt = performance.now() - miniTouchTime;
            miniStartX = 0;
            miniStartY = 0;

            animateSpring({
                from: 1,
                to: 0,
                stiffness: 290,
                damping: 17,
                onUpdate: (v) => {
                    miniPlayerEl.style.transform = `translate3d(${(dx * 0.25 * v).toFixed(1)}px, ${(Math.min(0, dy) * 0.25 * v).toFixed(1)}px, 0)`;
                },
                onComplete: () => {
                    if (!activeMorphCancel) miniPlayerEl.style.transform = '';
                }
            });

            if (!miniAxis && dt < 550) {
                openFullscreenPlayer();
                return;
            }

            if (miniAxis === 'vertical' && dy < -35) {
                openFullscreenPlayer();
                return;
            }

            if (miniAxis === 'horizontal' && Math.abs(dx) > 72) {
                if (dx < 0) {
                    playNextTrack(false);
                } else {
                    playPrevTrack(false);
                }
            }
            miniAxis = null;
        }, { passive: false });
