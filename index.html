        const bottomChrome = document.getElementById('full-bottom-chrome');
        const coverWrapper = document.getElementById('full-cover-wrapper');
        const fullCoverImg = document.getElementById('full-cover');
        const outgoingCard = document.getElementById('full-cover-outgoing');
        const outgoingImg = document.getElementById('full-cover-outgoing-img');
        const swipeArea = document.getElementById('swipe-area');
        const miniPlayerEl = document.getElementById('mini-player');
        const miniCoverWrapper = document.getElementById('mini-cover-wrapper');
        const appleLyricsStage = document.getElementById('apple-lyrics-stage');
        const lyricsScrollBox = document.getElementById('lyrics-scroll-box');
        const lyricsLinesWrapper = document.getElementById('lyrics-lines-wrapper');
        const fullQuickLyricsBtn = document.getElementById('full-quick-lyrics-btn');

        let isPlayerOpen = false;
        let currentCoverRestScale = 0.92;
        let morphVectors = { dx: 0, dy: 0, scale: 0.15, fullWidth: 340 };

        lyricsScrollBox.addEventListener('touchstart', () => {
            userScrollingLyricsUntil = performance.now() + 2600;
        }, { passive: true });

        lyricsScrollBox.addEventListener('wheel', () => {
            userScrollingLyricsUntil = performance.now() + 2600;
        }, { passive: true });

        function syncLyricsLanguageMenuUI() {
            ['romanized', 'native', 'bilingual'].forEach(mode => {
                document.getElementById(`lang-mode-${mode}`)?.classList.toggle('pill-active', lyricsLanguageMode === mode);
            });
            const dualBadge = document.getElementById('menu-dual-script-badge');
            if (dualBadge) {
                dualBadge.classList.toggle('hidden', !activeLyricsPayload?.hasDualScript);
            }
        }

        window.setLyricsLanguageMode = (mode, ev) => {
            if (ev) ev.stopPropagation();
            if (!['romanized', 'native', 'bilingual'].includes(mode)) return;
            lyricsLanguageMode = mode;
            localStorage.setItem("muse_lyrics_lang_mode", mode);
            syncLyricsLanguageMenuUI();

            if (activeLyricsPayload) {
                applyLoadedLyricsPayload(activeLyricsPayload, false);
            }
            const labelMap = {
                romanized: "English (Romanized)",
                native: "Original Native Script",
                bilingual: "Bilingual (Dual Script)"
            };
            toast(`Lyrics: ${labelMap[mode]}`);
        };

        function applyLyricsStageTransition(progress) {
            const p = Math.max(0, Math.min(1, progress));
            currentLyricsProgress = p;
            const baseScale = audio.paused ? 0.92 : 1.0;

            const coverX = -p * 95;
            const coverScale = baseScale * (1 - p * 0.18);
            const coverOpacity = Math.max(0, 1 - p * 1.35);

            coverWrapper.style.opacity = coverOpacity.toFixed(3);
            coverWrapper.style.transform = `translate3d(${coverX.toFixed(1)}px, 0, 0) scale3d(${coverScale.toFixed(4)}, ${coverScale.toFixed(4)}, 1)`;
            coverWrapper.style.pointerEvents = p > 0.5 ? 'none' : 'auto';

            const lyricsX = (1 - p) * 85;
            const lyricsScale = 0.94 + p * 0.06;
            appleLyricsStage.style.opacity = p.toFixed(3);
            appleLyricsStage.style.transform = `translate3d(${lyricsX.toFixed(1)}px, 0, 0) scale3d(${lyricsScale.toFixed(4)}, ${lyricsScale.toFixed(4)}, 1)`;

            if (p > 0.5) {
                appleLyricsStage.classList.add('lyrics-interactive');
                fullQuickLyricsBtn?.classList.add('pill-active');
            } else {
                appleLyricsStage.classList.remove('lyrics-interactive');
                fullQuickLyricsBtn?.classList.remove('pill-active');
            }
        }

        window.setLyricsPanelState = (open, initialVelocity = 0) => {
            if (activeLyricsPanelCancel) {
                activeLyricsPanelCancel();
                activeLyricsPanelCancel = null;
            }
            isLyricsOpen = open;
            const target = open ? 1 : 0;

            activeLyricsPanelCancel = animateSpring({
                from: currentLyricsProgress,
                to: target,
                velocity: initialVelocity,
                stiffness: 350,
                damping: 29,
                onUpdate: (val) => {
                    applyLyricsStageTransition(val);
                },
                onComplete: () => {
                    applyLyricsStageTransition(target);
                    activeLyricsPanelCancel = null;
                    if (open) {
                        syncLyricsToCurrentTime(true);
                        startLyricsSyncLoop();
                    }
                }
            });
        };

        window.toggleLyricsPanel = () => {
            setLyricsPanelState(!isLyricsOpen);
        };

        function getLyricsCacheKey(track) {
            if (!track) return "";
            return `${track.id}__${track.appleId || ""}__${track.spotifyId || ""}__${track.title}`;
        }

        function extractWorkerTimelineForMode(payload) {
            if (!payload) return [];

            let sourceLines = payload.lines || [];
            if (lyricsLanguageMode === 'native' && Array.isArray(payload.nativeLines) && payload.nativeLines.length > 0) {
                sourceLines = payload.nativeLines;
            } else if (lyricsLanguageMode === 'romanized' && Array.isArray(payload.romanizedLines) && payload.romanizedLines.length > 0) {
                sourceLines = payload.romanizedLines;
            }

            const isAutoTimed = Boolean(payload.isAutoTimed) || payload.syncType === "CADENCE_ESTIMATED";
            const payloadDur = Number(payload.duration) || 0;
            const realDur = (audio.duration && isFinite(audio.duration) && audio.duration > 25) ? audio.duration : 0;
            const scaleFactor = (isAutoTimed && payloadDur > 25 && realDur > 25 && Math.abs(realDur - payloadDur) > 5)
                ? (realDur / payloadDur)
                : 1.0;

            return sourceLines.map((line, idx) => {
                const start = Number(((Number(line.time) || 0) * scaleFactor).toFixed(3));
                const nextLine = sourceLines[idx + 1];
                const rawEnd = Number(line.endTime) || (nextLine ? Number(nextLine.time) : start + 4.0);
                const end = Number((Math.max(start + 0.18, rawEnd * scaleFactor)).toFixed(3));

                const rawWords = (lyricsLanguageMode === 'native' && Array.isArray(line.nativeWords) && line.nativeWords.length > 0)
                    ? line.nativeWords
                    : (Array.isArray(line.words) ? line.words : []);

                const words = rawWords.map((w) => {
                    const wStart = Number(((Number(w.time) || start) * scaleFactor).toFixed(3));
                    const wEnd = Number((Math.max(wStart + 0.05, (Number(w.endTime) || (wStart + 0.28)) * scaleFactor)).toFixed(3));
                    return {
                        word: String(w.word || w.text || "").trim(),
                        time: wStart,
                        endTime: wEnd,
                        syllables: Array.isArray(w.syllables) ? w.syllables : null
                    };
                }).filter(w => w.word);

                let secondaryText = null;
                if (lyricsLanguageMode === 'bilingual') {
                    const roman = String(line.romanizedText || line.text || "").trim();
                    const native = String(line.nativeText || "").trim();
                    if (native && native !== roman && !line.isInstrumental) {
                        secondaryText = native;
                    } else if (line.translationText) {
                        secondaryText = line.translationText;
                    }
                } else if (line.translationText && !line.isInstrumental) {
                    secondaryText = line.translationText;
                }

                return {
                    index: idx,
                    time: start,
                    endTime: end,
                    text: String(line.text || "").trim(),
                    secondaryText,
                    isInstrumental: Boolean(line.isInstrumental),
                    plainOnly: Boolean(line.plainOnly),
                    words
                };
            });
        }

        async function loadLyricsForTrack(track) {
            if (activeLyricsAbortController) {
                activeLyricsAbortController.abort();
                activeLyricsAbortController = null;
            }

            activeLyricsTimeline = [];
            activeLyricsPayload = null;
            activeLyricLineIndex = -1;
            lyricsLinesWrapper.innerHTML = `<div class="apple-lyric-line is-active line-plain-active" style="opacity:0.75;">Synchronizing word-by-word lyrics...</div>`;

            if (!track) return;
            const cacheKey = getLyricsCacheKey(track);

            if (lyricsCache.has(cacheKey)) {
                applyLoadedLyricsPayload(lyricsCache.get(cacheKey), true);
                return;
            }

            const abortController = new AbortController();
            activeLyricsAbortController = abortController;
            const reqTrackId = String(track.id);

            try {
                const knownDuration = (audio.duration && isFinite(audio.duration) && audio.duration > 15)
                    ? Math.round(audio.duration)
                    : (track.duration || 0);

                const cleanAlbum = (track.album && !/^(muse|openmuse)$/i.test(track.album)) ? track.album : "";
                const qs = new URLSearchParams({
                    id: track.id,
                    trackName: track.title || "",
                    artistName: track.artist || "",
                    albumName: cleanAlbum,
                    duration: String(knownDuration)
                });
                if (track.appleId) qs.set("appleId", String(track.appleId));
                if (track.spotifyId) qs.set("spotifyId", String(track.spotifyId));

                const workerLyricsUrl = `${WORKER_BASE}/lyrics?${qs.toString()}`;
                const data = await fetchCachedJson(workerLyricsUrl, 600000, 7500, abortController.signal);
                if (abortController.signal.aborted) return;
                if (Array.isArray(data?.lines) && data.lines.length > 0) {
                    lyricsCache.set(cacheKey, data);
                    if (activeTrack && String(activeTrack.id) === reqTrackId) {
                        applyLoadedLyricsPayload(data, true);
                    }
                    return;
                }
            } catch (e) {
                if (e.name === 'AbortError') return;
            }

            if (activeTrack && String(activeTrack.id) === reqTrackId) {
                lyricsLinesWrapper.innerHTML = `<div class="apple-lyric-line is-active" style="opacity:0.45;">Lyrics unavailable for this track</div>`;
            }
        }

        function applyLoadedLyricsPayload(payload, resetScroll = true) {
            if (!payload || !Array.isArray(payload.lines)) return;
            activeLyricsPayload = payload;
            syncLyricsLanguageMenuUI();

            const timeline = extractWorkerTimelineForMode(payload);
            renderLyricsTimeline(timeline, resetScroll);
        }

        function renderLyricsTimeline(lines, resetScroll = true) {
            activeLyricsTimeline = lines || [];
            activeLyricLineIndex = -1;
            lyricsLinesWrapper.innerHTML = '';

            if (!activeLyricsTimeline.length) {
                lyricsLinesWrapper.innerHTML = `<div class="apple-lyric-line is-active" style="opacity:0.45;">Lyrics unavailable for this track</div>`;
                return;
            }

            const frag = document.createDocumentFragment();
            activeLyricsTimeline.forEach((line, idx) => {
                const lineEl = document.createElement('div');
                lineEl.className = 'apple-lyric-line';
                lineEl.dataset.index = idx;

                if (Array.isArray(line.words) && line.words.length > 0 && !line.plainOnly) {
                    const wordsContainer = document.createElement('div');
                    wordsContainer.className = 'lyric-words-row';
                    line.words.forEach((w, wIdx) => {
                        const span = document.createElement('span');
                        span.className = 'lyric-word';
                        span.dataset.widx = wIdx;
                        span.style.setProperty('--word-fill', '0%');
                        span.textContent = w.word;
                        wordsContainer.appendChild(span);
                    });
                    lineEl.appendChild(wordsContainer);
                } else {
                    const textDiv = document.createElement('div');
                    textDiv.textContent = line.text;
                    lineEl.appendChild(textDiv);
                }

                if (line.secondaryText) {
                    const subSpan = document.createElement('span');
                    subSpan.className = 'lyric-sub-line';
                    subSpan.textContent = line.secondaryText;
                    lineEl.appendChild(subSpan);
                }

                lineEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (audio.duration && typeof line.time === 'number') {
                        userScrollingLyricsUntil = 0;
                        audio.currentTime = Math.max(0, line.time);
                        if (audio.paused) togglePlayPause();
                        syncLyricsToCurrentTime(true);
                    }
                });

                frag.appendChild(lineEl);
            });

            lyricsLinesWrapper.appendChild(frag);
            syncLyricsToCurrentTime(resetScroll);
        }

        function scrollToActiveLyricLine(force = false) {
            if (!force && performance.now() < userScrollingLyricsUntil) return;
            const activeEl = lyricsLinesWrapper.children[activeLyricLineIndex];
            if (!activeEl) return;

            const boxRect = lyricsScrollBox.getBoundingClientRect();
            const lineRect = activeEl.getBoundingClientRect();
            const offset = (lineRect.top - boxRect.top) - (boxRect.height * 0.36) + (lineRect.height * 0.5);
            lyricsScrollBox.scrollBy({ top: offset, behavior: 'smooth' });
        }

        function computeIntraWordFillPercent(wMeta, t) {
            if (t >= wMeta.endTime) return 100;
            if (t <= wMeta.time) return 0;

            if (Array.isArray(wMeta.syllables) && wMeta.syllables.length > 1) {
                const syls = wMeta.syllables;
                const n = syls.length;
                for (let s = 0; s < n; s++) {
                    const syl = syls[s];
                    const sStart = Number(syl.time) || wMeta.time;
                    const sEnd = Number(syl.endTime) || wMeta.endTime;
                    if (t >= sStart && t <= sEnd) {
                        const localP = (t - sStart) / Math.max(0.04, sEnd - sStart);
                        return Math.min(100, Math.max(0, ((s + localP) / n) * 100));
                    }
                    if (t < sStart) {
                        return (s / n) * 100;
                    }
                }
            }

            const wDur = Math.max(0.06, wMeta.endTime - wMeta.time);
            const linearP = (t - wMeta.time) / wDur;
            return Math.min(100, Math.max(0, linearP * 100));
        }

        function syncLyricsToCurrentTime(forceScroll = false) {
            if (!activeLyricsTimeline.length) return;
            const t = Math.max(0, audio.currentTime || 0);

            let newActiveIdx = -1;
            for (let i = 0; i < activeLyricsTimeline.length; i++) {
                const item = activeLyricsTimeline[i];
                const nextItem = activeLyricsTimeline[i + 1];
                const lineCeiling = nextItem ? nextItem.time : Math.max(item.endTime + 6, audio.duration || 999);
                if (t >= item.time && t < lineCeiling) {
                    newActiveIdx = i;
                    break;
                }
            }

            if (newActiveIdx === -1 && t < activeLyricsTimeline[0].time) {
                newActiveIdx = 0;
            } else if (newActiveIdx === -1) {
                newActiveIdx = activeLyricsTimeline.length - 1;
            }

            const lineNodes = lyricsLinesWrapper.children;
            if (newActiveIdx !== activeLyricLineIndex) {
                activeLyricLineIndex = newActiveIdx;
                for (let i = 0; i < lineNodes.length; i++) {
                    const node = lineNodes[i];
                    const item = activeLyricsTimeline[i];
                    node.classList.remove('is-active', 'is-past', 'line-plain-active');
                    if (i < activeLyricLineIndex) {
                        node.classList.add('is-past');
                    } else if (i === activeLyricLineIndex) {
                        node.classList.add('is-active');
                        if (!item?.words?.length || item.plainOnly) {
                            node.classList.add('line-plain-active');
                        }
                    }
                }
                scrollToActiveLyricLine(forceScroll);
            }

            if (activeLyricLineIndex >= 0) {
                const activeItem = activeLyricsTimeline[activeLyricLineIndex];
                const activeNode = lineNodes[activeLyricLineIndex];
                const wordsRow = activeNode?.querySelector('.lyric-words-row');
                if (activeItem?.words?.length && wordsRow && !activeItem.plainOnly) {
                    const wordSpans = wordsRow.children;
                    for (let w = 0; w < wordSpans.length; w++) {
                        const wMeta = activeItem.words[w];
                        const span = wordSpans[w];
                        if (!wMeta || !span) continue;
                        if (t >= wMeta.endTime) {
                            if (span.className !== 'lyric-word word-sung') {
                                span.className = 'lyric-word word-sung';
                                span.style.setProperty('--word-fill', '100%');
                            }
                        } else if (t >= wMeta.time && t < wMeta.endTime) {
                            const pct = computeIntraWordFillPercent(wMeta, t);
                            span.className = 'lyric-word word-current';
                            span.style.setProperty('--word-fill', `${pct.toFixed(1)}%`);
                        } else {
                            if (span.className !== 'lyric-word') {
                                span.className = 'lyric-word';
                                span.style.setProperty('--word-fill', '0%');
                            }
                        }
                    }
                }
            }
        }

        function startLyricsSyncLoop() {
            if (lyricsRafId) return;
            const step = () => {
                if (audio.paused || document.hidden) {
                    lyricsRafId = null;
                    return;
                }
                if (isPlayerOpen && isLyricsOpen && activeLyricsTimeline.length > 0) {
                    syncLyricsToCurrentTime(false);
                }
                lyricsRafId = requestAnimationFrame(step);
            };
            lyricsRafId = requestAnimationFrame(step);
        }

        // ============================================================================
        // FULLSCREEN MORPH & GESTURE ENGINE
        // ============================================================================

        function measureMorphGeometry() {
            const prevAppTransform = appShell.style.transform;
            const prevCoverTransform = coverWrapper.style.transform;
            const prevMiniTransform = miniPlayerEl.style.transform;
            appShell.style.transform = 'none';
            coverWrapper.style.transform = 'none';
            miniPlayerEl.style.transform = 'none';

            const fullRect = coverWrapper.getBoundingClientRect();
            const miniRect = miniCoverWrapper.getBoundingClientRect();

            appShell.style.transform = prevAppTransform;
            coverWrapper.style.transform = prevCoverTransform;
            miniPlayerEl.style.transform = prevMiniTransform;

            if (fullRect.width > 0 && miniRect.width > 0) {
                const fullCenterX = fullRect.left + fullRect.width / 2;
                const fullCenterY = fullRect.top + fullRect.height / 2;
                const miniCenterX = miniRect.left + miniRect.width / 2;
                const miniCenterY = miniRect.top + miniRect.height / 2;

                morphVectors = {
                    dx: miniCenterX - fullCenterX,
                    dy: miniCenterY - fullCenterY,
                    scale: miniRect.width / fullRect.width,
                    fullWidth: fullRect.width
                };
            }
        }

        window.addEventListener('resize', () => {
            if (isPlayerOpen) measureMorphGeometry();
        });

        function applyMorphState(progress, fingerOffsetX = 0, fingerOffsetY = 0) {
            const clampedP = Math.max(0, Math.min(1, progress));
            const baseRestScale = audio.paused ? 0.92 : 1.0;
            currentCoverRestScale = baseRestScale;

            const blend = 1 - clampedP;
            const currentX = (morphVectors.dx * progress) + (fingerOffsetX * blend);
            const currentY = (morphVectors.dy * progress) + (fingerOffsetY * blend);
            const currentScale = Math.max(0.06, baseRestScale + (morphVectors.scale - baseRestScale) * progress);

            const targetCircleRadius = morphVectors.fullWidth * 0.5;
            const cubicRadiusProgress = Math.pow(clampedP, 2.5);
            const borderRadiusPx = 34 + (targetCircleRadius - 34) * cubicRadiusProgress;

            coverWrapper.style.opacity = '1';
            coverWrapper.style.transform = `translate3d(${currentX.toFixed(1)}px, ${currentY.toFixed(1)}px, 0) scale3d(${currentScale.toFixed(4)}, ${currentScale.toFixed(4)}, 1)`;
            coverWrapper.style.borderRadius = `${borderRadiusPx.toFixed(1)}px`;

            const chromeOpacity = Math.max(0, Math.min(1, 1 - (clampedP * 1.5)));
            const backdropOpacity = Math.max(0, Math.min(1, 1 - Math.pow(clampedP, 1.35)));
            backdropLayer.style.opacity = backdropOpacity.toFixed(3);
            headerChrome.style.opacity = chromeOpacity.toFixed(3);
            headerChrome.style.transform = `translate3d(0, ${(-progress * 22).toFixed(1)}px, 0)`;
            bottomChrome.style.opacity = chromeOpacity.toFixed(3);
            bottomChrome.style.transform = `translate3d(0, ${(progress * 36).toFixed(1)}px, 0)`;

            const shellScale = 0.95 + (0.05 * clampedP);
            const shellY = 8 * (1 - clampedP);
            appShell.style.transform = `scale3d(${shellScale.toFixed(4)}, ${shellScale.toFixed(4)}, 1) translate3d(0, ${shellY.toFixed(1)}px, 0)`;
            appShell.style.opacity = clampedP <= 0.02 ? '0' : (clampedP * clampedP).toFixed(3);
            appShell.style.visibility = clampedP <= 0.01 ? 'hidden' : 'visible';
        }

        window.openFullscreenPlayer = () => {
            requestAppFullscreen(false);
            resetHeartBurstAnimation();

            if (!activeTrack && playbackQueue.length > 0) {
                playTrack(0);
            }
            let startPos = 1;
            let startVel = -2.4;

            if (activeMorphCancel) {
                const state = activeMorphCancel();
                startPos = state.position;
                startVel = state.velocity - 1.2;
                activeMorphCancel = null;
            }
            if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }

            closeFullMoreMenu();
            isLyricsOpen = false;
            currentLyricsProgress = 0;
            appleLyricsStage.style.opacity = '0';
            appleLyricsStage.classList.remove('lyrics-interactive');
            fullQuickLyricsBtn?.classList.remove('pill-active');

            if (activeTrack && fullCoverImg.src !== activeTrack.coverUrl) {
                fullCoverImg.src = activeTrack.coverUrl;
            }
            coverWrapper.style.opacity = '1';
            coverWrapper.style.pointerEvents = 'auto';
            outgoingCard.style.opacity = '0';
            outgoingCard.style.visibility = 'hidden';

            playerEl.classList.remove('closed');
            playerEl.style.pointerEvents = 'auto';
            bottomChrome.style.pointerEvents = 'auto';
            headerChrome.style.pointerEvents = 'auto';

            isPlayerOpen = true;
            appShell.style.visibility = 'visible';
            measureMorphGeometry();
            miniCoverWrapper.style.opacity = '0';

            applyMorphState(startPos, 0, 0);

            activeMorphCancel = animateSpring({
                from: startPos,
                to: 0,
                velocity: startVel,
                stiffness: 350,
                damping: 29,
                onUpdate: (val, vel) => {
                    liveMorphState = { position: val, velocity: vel };
                    applyMorphState(val, 0, 0);
                },
                onComplete: () => {
                    liveMorphState = { position: 0, velocity: 0 };
                    applyMorphState(0, 0, 0);
                    activeMorphCancel = null;
                }
            });
        };

        window.closeFullscreenPlayer = (startProgress = null, releaseVelocity = 2.0, fingerX = 0, fingerY = 0) => {
            resetHeartBurstAnimation();
            let initialPos = startProgress !== null ? startProgress : 0;
            let initialVel = releaseVelocity;

            if (activeMorphCancel) {
                const state = activeMorphCancel();
                if (startProgress === null) initialPos = state.position;
                initialVel += state.velocity * 0.5;
                activeMorphCancel = null;
            }
            if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }
            if (activeOutgoingCancel) { activeOutgoingCancel(); activeOutgoingCancel = null; }
            if (activeLyricsPanelCancel) { activeLyricsPanelCancel(); activeLyricsPanelCancel = null; }

            closeFullMoreMenu();
            isLyricsOpen = false;
            currentLyricsProgress = 0;
            appleLyricsStage.style.opacity = '0';
            appleLyricsStage.classList.remove('lyrics-interactive');
            fullQuickLyricsBtn?.classList.remove('pill-active');

            isPlayerOpen = false;
            appShell.style.visibility = 'visible';
            playerEl.style.pointerEvents = 'none';
            bottomChrome.style.pointerEvents = 'none';
            headerChrome.style.pointerEvents = 'none';
            outgoingCard.style.opacity = '0';
            outgoingCard.style.visibility = 'hidden';

            measureMorphGeometry();
            miniCoverWrapper.style.opacity = '0';

            activeMorphCancel = animateSpring({
                from: initialPos,
                to: 1,
                velocity: initialVel,
                stiffness: 370,
                damping: 31,
                onUpdate: (val, vel) => {
                    liveMorphState = { position: val, velocity: vel };
                    const remaining = Math.max(0, (1 - Math.min(1, val)) / Math.max(0.001, 1 - initialPos));
                    applyMorphState(val, fingerX * remaining, fingerY * remaining);
                },
                onComplete: () => {
                    liveMorphState = { position: 1, velocity: 0 };
                    miniCoverWrapper.style.opacity = '1';
                    playerEl.classList.add('closed');
                    appShell.style.transform = '';
                    appShell.style.opacity = '1';
                    appShell.style.visibility = 'visible';
                    coverWrapper.style.transform = '';
                    activeMorphCancel = null;
                }
            });
        };

        const GESTURE_DEADZONE_PX = 14;
        const TRACK_SWIPE_MIN_PX = 80;
        const TRACK_SWIPE_FAST_PX = 50;
        const TRACK_SWIPE_MIN_VELOCITY = 0.6;

        let startX = 0, startY = 0;
        let lastX = 0, lastY = 0;
        let lastMoveTime = 0;
        let touchStartTime = 0;
        let velocityX = 0, velocityY = 0;
        let isGestureActive = false;
        let lockedAxis = null;
        let maxGestureTravel = 0;
        let strictTapTimestamp = 0;
        let strictTapX = 0;
        let strictTapY = 0;

        [swipeArea, headerChrome].forEach(zone => {
            zone.addEventListener('touchstart', (e) => {
                if (!isPlayerOpen) return;
                if (e.target.closest('button') || e.target.closest('#full-more-menu') || e.target.closest('#scrubber-hit-zone') || e.target.tagName.toLowerCase() === 'input') return;
                if (activeMorphCancel) { activeMorphCancel(); activeMorphCancel = null; }
                if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }
                if (activeLyricsPanelCancel) { activeLyricsPanelCancel(); activeLyricsPanelCancel = null; }

                const t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                lastX = startX;
                lastY = startY;
                touchStartTime = performance.now();
                lastMoveTime = touchStartTime;
                velocityX = 0;
                velocityY = 0;
                maxGestureTravel = 0;
                isGestureActive = true;
                lockedAxis = null;

                measureMorphGeometry();
            }, { passive: true });

            zone.addEventListener('touchmove', (e) => {
                if (!isPlayerOpen || !isGestureActive) return;
                const t = e.touches[0];
                const now = performance.now();
                const dt = Math.max(1, now - lastMoveTime);

                const rawDx = t.clientX - startX;
                const rawDy = t.clientY - startY;
                const curDist = Math.hypot(rawDx, rawDy);
                if (curDist > maxGestureTravel) maxGestureTravel = curDist;

                velocityX = 0.7 * ((t.clientX - lastX) / dt) + 0.3 * velocityX;
                velocityY = 0.7 * ((t.clientY - lastY) / dt) + 0.3 * velocityY;
                lastX = t.clientX;
                lastY = t.clientY;
                lastMoveTime = now;

                if (!lockedAxis) {
                    if (curDist < GESTURE_DEADZONE_PX) return;

                    if (zone === headerChrome && rawDy > 0) {
                        lockedAxis = 'dismiss-morph';
                        appShell.style.visibility = 'visible';
                        miniCoverWrapper.style.opacity = '0';
                    } else if (Math.abs(rawDx) > Math.abs(rawDy) * 1.15) {
                        if (!isLyricsOpen && rawDx < 0 && zone === swipeArea) {
                            lockedAxis = 'lyrics-swipe-open';
                        } else if (isLyricsOpen && rawDx > 0) {
                            lockedAxis = 'lyrics-swipe-close';
                        } else if (!isLyricsOpen && rawDx > 0) {
                            lockedAxis = 'dismiss-morph';
                            appShell.style.visibility = 'visible';
                            miniCoverWrapper.style.opacity = '0';
                        } else {
                            return;
                        }
                    } else if (!isLyricsOpen && Math.abs(rawDy) > Math.abs(rawDx) * 1.1 && zone === swipeArea) {
                        lockedAxis = 'vertical-track';
                    } else {
                        return;
                    }
                }

                if (lockedAxis === 'lyrics-swipe-open') {
                    const dragP = Math.min(1, Math.max(0, Math.abs(rawDx) / (window.innerWidth * 0.52)));
                    applyLyricsStageTransition(dragP);
                } else if (lockedAxis === 'lyrics-swipe-close') {
                    const dragP = Math.max(0, Math.min(1, 1 - (rawDx / (window.innerWidth * 0.52))));
                    applyLyricsStageTransition(dragP);
                } else if (lockedAxis === 'dismiss-morph') {
                    const effectiveDrag = Math.max(0, rawDx * 0.9 + Math.max(0, rawDy) * 0.65);
                    const progress = Math.min(0.92, effectiveDrag / (window.innerWidth * 0.65));
                    applyMorphState(progress, rawDx * 0.3, rawDy * 0.3);
                } else if (lockedAxis === 'vertical-track') {
                    const adjDy = rawDy - Math.sign(rawDy) * GESTURE_DEADZONE_PX;
                    const dampedY = Math.sign(adjDy) * Math.pow(Math.abs(adjDy), 0.85) * 1.45;
                    const wheelProgress = Math.min(1, Math.abs(dampedY) / (window.innerHeight * 0.55));
                    const baseScale = audio.paused ? 0.92 : 1.0;
                    const dragScale = Math.max(0.8, baseScale - wheelProgress * 0.18);

                    coverWrapper.style.opacity = `${Math.max(0.4, 1 - wheelProgress * 0.55).toFixed(3)}`;
                    coverWrapper.style.transform = `translate3d(0, ${dampedY.toFixed(1)}px, 0) scale3d(${dragScale.toFixed(3)}, ${dragScale.toFixed(3)}, 1)`;

                    if (Math.abs(rawDy) >= TRACK_SWIPE_MIN_PX) {
                        coverWrapper.classList.add('swipe-threshold-ready');
                    } else {
                        coverWrapper.classList.remove('swipe-threshold-ready');
                    }
                }
            }, { passive: true });

            zone.addEventListener('touchend', (e) => {
                if (!isGestureActive) return;
                isGestureActive = false;
                coverWrapper.classList.remove('swipe-threshold-ready');

                const rawDx = lastX - startX;
                const rawDy = lastY - startY;
                const gestureDuration = performance.now() - touchStartTime;

                if (!lockedAxis && !isLyricsOpen && zone === swipeArea && maxGestureTravel < 6 && gestureDuration < 190) {
                    if (e.target.closest('#full-cover-wrapper') && !e.target.closest('.apple-lyric-line')) {
                        const now = performance.now();
                        const distFromLastTap = Math.hypot(startX - strictTapX, startY - strictTapY);
                        if (strictTapTimestamp > 0 && (now - strictTapTimestamp) < 235 && (now - strictTapTimestamp) > 35 && distFromLastTap < 22) {
                            strictTapTimestamp = 0;
                            triggerDoubleTapHeartBurst();
                            return;
                        }
                        strictTapTimestamp = now;
                        strictTapX = startX;
                        strictTapY = startY;
                    } else {
                        strictTapTimestamp = 0;
                    }
                } else {
                    strictTapTimestamp = 0;
                }

                if (!lockedAxis || !isPlayerOpen) {
                    lockedAxis = null;
                    return;
                }

                if (lockedAxis === 'lyrics-swipe-open') {
                    const shouldOpen = rawDx < -48 || velocityX < -0.42;
                    setLyricsPanelState(shouldOpen, Math.abs(velocityX) * 1.8);
                } else if (lockedAxis === 'lyrics-swipe-close') {
                    const shouldCloseLyrics = rawDx > 48 || velocityX > 0.42;
                    setLyricsPanelState(!shouldCloseLyrics, -Math.abs(velocityX) * 1.8);
                } else if (lockedAxis === 'dismiss-morph') {
                    const effectiveDrag = Math.max(0, rawDx * 0.9 + Math.max(0, rawDy) * 0.65);
                    const currentProgress = Math.min(0.92, effectiveDrag / (window.innerWidth * 0.65));
                    const shouldClose = effectiveDrag > 85 || (effectiveDrag > 40 && (velocityX > 0.48 || velocityY > 0.48));

                    if (shouldClose) {
                        closeFullscreenPlayer(
                            currentProgress,
                            Math.max(1.8, Math.hypot(velocityX, velocityY) * 2.0),
                            rawDx * 0.3,
                            rawDy * 0.3
                        );
                    } else {
                        activeMorphCancel = animateSpring({
                            from: currentProgress,
                            to: 0,
                            velocity: -2.0,
                            stiffness: 350,
                            damping: 28,
                            onUpdate: (val) => {
                                const ratio = currentProgress > 0 ? Math.max(0, val / currentProgress) : 0;
                                applyMorphState(val, rawDx * 0.3 * ratio, rawDy * 0.3 * ratio);
                            },
                            onComplete: () => {
                                miniCoverWrapper.style.opacity = '1';
                                applyMorphState(0, 0, 0);
                                activeMorphCancel = null;
                            }
                        });
                    }
                } else if (lockedAxis === 'vertical-track') {
                    const absDy = Math.abs(rawDy);
                    const absVy = Math.abs(velocityY);
                    const isDeliberateSwipe =
                        absDy >= TRACK_SWIPE_MIN_PX ||
                        (absDy >= TRACK_SWIPE_FAST_PX && absVy >= TRACK_SWIPE_MIN_VELOCITY && gestureDuration >= 50);

                    const adjDy = rawDy - Math.sign(rawDy) * GESTURE_DEADZONE_PX;
                    const currentDampedY = Math.sign(adjDy) * Math.pow(Math.abs(adjDy), 0.85) * 1.45;

                    if (isDeliberateSwipe) {
                        if (rawDy < 0) {
                            playNextTrack(true, currentDampedY, velocityY * 950);
                        } else {
                            playPrevTrack(true, currentDampedY, velocityY * 950);
                        }
                    } else {
                        const restScale = audio.paused ? 0.92 : 1.0;
                        activeCoverCancel = animateSpring({
                            from: currentDampedY,
                            to: 0,
                            velocity: velocityY * 450,
                            stiffness: 350,
                            damping: 26,
                            onUpdate: (yVal, vVal) => {
                                liveCoverState = { position: yVal, velocity: vVal };
                                const progressRatio = Math.min(1, Math.abs(yVal) / 260);
                                const s = restScale - progressRatio * 0.1;
                                coverWrapper.style.opacity = `${Math.max(0.45, 1 - progressRatio * 0.45).toFixed(3)}`;
                                coverWrapper.style.transform = `translate3d(0, ${yVal.toFixed(1)}px, 0) scale3d(${s.toFixed(4)}, ${s.toFixed(4)}, 1)`;
                            },
                            onComplete: () => {
                                liveCoverState = { position: 0, velocity: 0 };
                                coverWrapper.style.opacity = '1';
                                coverWrapper.style.transform = `translate3d(0, 0, 0) scale3d(${restScale}, ${restScale}, 1)`;
                                activeCoverCancel = null;
                            }
                        });
                    }
                }
                lockedAxis = null;
            });
        });

        let miniStartX = 0, miniStartY = 0;
        let miniLastX = 0, miniLastY = 0;
        let miniAxis = null;
        let miniTouchTime = 0;
        let isMiniTouching = false;

        miniPlayerEl.addEventListener('touchstart', (e) => {
            if (e.target.closest('#mini-play-zone') || e.target.closest('button')) return;
            const t = e.touches[0];
            miniStartX = t.clientX;
            miniStartY = t.clientY;
            miniLastX = miniStartX;
            miniLastY = miniStartY;
            miniAxis = null;
            miniTouchTime = performance.now();
            isMiniTouching = true;
        }, { passive: true });

        miniPlayerEl.addEventListener('touchmove', (e) => {
            if (!isMiniTouching) return;
            const t = e.touches[0];
            miniLastX = t.clientX;
            miniLastY = t.clientY;
            const dx = miniLastX - miniStartX;
            const dy = miniLastY - miniStartY;

            if (!miniAxis) {
                if (Math.hypot(dx, dy) < 14) return;
                miniAxis = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
            }

            if (miniAxis === 'horizontal') {
                const dampedX = Math.sign(dx) * Math.pow(Math.abs(dx), 0.78) * 1.2;
                miniPlayerEl.style.transform = `translate3d(${dampedX.toFixed(1)}px, 0, 0)`;
            } else if (miniAxis === 'vertical' && dy < 0) {
                const dampedY = -Math.pow(Math.abs(dy), 0.8) * 1.1;
                miniPlayerEl.style.transform = `translate3d(0, ${dampedY.toFixed(1)}px, 0)`;
            }
        }, { passive: true });

        miniPlayerEl.addEventListener('touchend', (e) => {
            if (!isMiniTouching) return;
            isMiniTouching = false;

            if (e.cancelable) e.preventDefault();
            e.stopPropagation();

            const dx = miniLastX - miniStartX;
            const dy = miniLastY - miniStartY;
            const dt = performance.now() - miniTouchTime;
            miniStartX = 0;
            miniStartY = 0;

            miniPlayerEl.style.transform = '';

            if (!miniAxis && dt < 550) {
                openFullscreenPlayer();
                return;
            }

            if (miniAxis === 'vertical' && dy < -32) {
                openFullscreenPlayer();
                return;
            }

            if (miniAxis === 'horizontal' && Math.abs(dx) > 68) {
                if (dx < 0) {
                    playNextTrack(false);
                } else {
                    playPrevTrack(false);
                }
            }
            miniAxis = null;
        }, { passive: false });

        function attachLeadingCarouselPhysics(scrollerEl) {
            if (!scrollerEl) return;
            let rafPending = false;

            const updateCardsScale = () => {
                rafPending = false;
                const cards = scrollerEl.querySelectorAll('.focal-carousel-card');
                if (!cards.length) return;

                const containerRect = scrollerEl.getBoundingClientRect();
                const leadingAnchorX = containerRect.left + 12;
                const falloffWidth = Math.max(260, containerRect.width * 0.72);

                let closestIdx = 0;
                let minDistance = Infinity;

                const distances = [];
                for (let i = 0; i < cards.length; i++) {
                    const rect = cards[i].getBoundingClientRect();
                    const dist = Math.abs(rect.left - leadingAnchorX);
                    distances.push(dist);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestIdx = i;
                    }
                }

                for (let i = 0; i < cards.length; i++) {
                    const card = cards[i];
                    const dist = distances[i];
                    const norm = Math.min(1, dist / falloffWidth);
                    const scale = 1.07 - norm * 0.20;
                    const opacity = 1.0 - norm * 0.24;

                    card.style.transform = `scale3d(${scale.toFixed(3)}, ${scale.toFixed(3)}, 1)`;
                    card.style.opacity = opacity.toFixed(3);
                    card.classList.toggle('is-leading-focus', i === closestIdx);
                }
            };

            scrollerEl.addEventListener('scroll', () => {
                if (!rafPending) {
                    rafPending = true;
                    requestAnimationFrame(updateCardsScale);
                }
            }, { passive: true });

            requestAnimationFrame(updateCardsScale);
            setTimeout(updateCardsScale, 120);
        }

        async function populateRelatedQueueForSong(seedSong) {
            if (!seedSong || !seedSong.id) return;
            const seedId = String(seedSong.id);
            try {
                const data = await fetchCachedJson(`${WORKER_BASE}/reco?id=${encodeURIComponent(seedId)}&lang=${encodeURIComponent(currentHomeLang)}`, 300000);
                let relatedSongs = (data.songs || []).map(s => registerTrackObj(normalizeWorkerSong(s))).filter(Boolean);

                if (relatedSongs.length < 4) {
                    const primaryArtist = (seedSong.artist || "").split(",")[0].trim();
                    if (primaryArtist) {
                        const fallbackSearch = await fetchWorkerSearch(primaryArtist);
                        for (const s of fallbackSearch.songs) {
                            if (String(s.id) !== seedId && !relatedSongs.some(r => String(r.id) === String(s.id))) {
                                relatedSongs.push(s);
                            }
                        }
                    }
                }

                if (activeTrack && String(activeTrack.id) === seedId && relatedSongs.length > 0) {
                    const seen = new Set([seedId]);
                    const deduped = [seedSong];
                    for (const r of relatedSongs) {
                        if (!seen.has(String(r.id))) {
                            seen.add(String(r.id));
                            deduped.push(r);
                        }
                    }
                    playbackQueue = deduped;
                    currentTrackIndex = 0;
                    prefetchAdjacentTracks(0);
                }
            } catch (e) {}
        }

        function getImmediateCandidatesForTrack(track) {
            if (!track) return [];
            const cached = resolvedSongCache.get(track.id);
            if (cached && Array.isArray(cached.cascadeUrls) && cached.cascadeUrls.length > 0) {
                track.cascadeUrls = cached.cascadeUrls;
                track.streamUrl = cached.streamUrl;
            }
            const playQs = new URLSearchParams({
                id: track.id,
                title: track.title || "",
                artist: track.artist || "",
                album: track.album || ""
            });
            if (track.appleId) playQs.set("appleId", String(track.appleId));
            if (track.spotifyId) playQs.set("spotifyId", String(track.spotifyId));
            const fallbackPlay = `${WORKER_BASE}/play?${playQs.toString()}`;

            const list = [
                ...(Array.isArray(track.cascadeUrls) ? track.cascadeUrls : []),
                track.streamUrl,
                track.playUrl,
                fallbackPlay
            ].filter(Boolean);

            return [...new Set(list)];
        }

        async function resolveAndPrewarmTrack(track) {
            if (!track) return;
            const immediate = getImmediateCandidatesForTrack(track);
            if (immediate[0] && immediate[0].includes("/stream?")) {
                prewarmAudioStreamEdge(immediate[0]);
                return;
            }
            try {
                const data = await fetchCachedJson(`${WORKER_BASE}/song?id=${encodeURIComponent(track.id)}`, 600000);
                const rawSong = data?.track || data?.songs?.[0];
                if (rawSong) {
                    const norm = normalizeWorkerSong(rawSong);
                    if (norm && norm.cascadeUrls?.length) {
                        track.cascadeUrls = norm.cascadeUrls;
                        track.streamUrl = norm.streamUrl;
                        if (!track.duration && norm.duration) track.duration = norm.duration;
                        resolvedSongCache.set(track.id, norm);
                        if (norm.streamUrl) prewarmAudioStreamEdge(norm.streamUrl);
                    }
                }
            } catch (e) {}
        }

        function prefetchAdjacentTracks(index) {
            if (!playbackQueue.length) return;
            const nextIdx1 = (index + 1) % playbackQueue.length;
            const nextIdx2 = (index + 2) % playbackQueue.length;
            setTimeout(() => {
                if (playbackQueue[nextIdx1]) resolveAndPrewarmTrack(playbackQueue[nextIdx1]);
                if (playbackQueue.length > 2 && playbackQueue[nextIdx2]) resolveAndPrewarmTrack(playbackQueue[nextIdx2]);
                if (index >= playbackQueue.length - 2 && playbackQueue[index]) {
                    populateRelatedQueueForSong(playbackQueue[index]);
                }
            }, 150);
        }

        /**
         * SYNCHRONOUS PLAYBACK START:
         * Sets `audio.src` and invokes `audio.play()` in the exact same synchronous tick so
         * iOS Safari & Android Chrome never drop background media focus when advancing tracks!
         */
        window.playTrack = (index, forceReplay = false, skipCoverScaleSpring = false) => {
            requestAppFullscreen(false);
            resetHeartBurstAnimation();
            if (index < 0 || index >= playbackQueue.length) return;

            if (activeTrack && currentTrackIndex !== index) {
                const timeLeft = (audio.duration || 0) - (audio.currentTime || 0);
                if (timeLeft > 5 && audio.currentTime > 2) {
                    trackProgressCache.set(activeTrack.id, audio.currentTime);
                } else {
                    trackProgressCache.set(activeTrack.id, 0);
                }
            }

            if (!forceReplay && currentTrackIndex === index && activeTrack) {
                if (audio.ended) {
                    audio.currentTime = 0;
                    userIntendedPlaying = true;
                    engageOsBackgroundLock();
                    audio.play().catch(() => {});
                    setPlaybackState(true, skipCoverScaleSpring);
                    return;
                }
                return togglePlayPause();
            }

            const sessionId = ++currentPlaySession;

            initMuseSignatureSound();
            if (signatureAudioCtx && signatureAudioCtx.state === 'suspended') {
                signatureAudioCtx.resume().catch(() => {});
            }

            currentTrackIndex = index;
            activeTrack = playbackQueue[index];
            registerTrackObj(activeTrack);

            userIntendedPlaying = true;
            engageOsBackgroundLock();

            updatePlayerDisplays(activeTrack);
            updateMediaSession(activeTrack);
            loadLyricsForTrack(activeTrack);
            prefetchAdjacentTracks(index);

            const candidates = getImmediateCandidatesForTrack(activeTrack);
            activeTrack._activeCandidates = candidates;
            activeCandidateIdx = 0;

            startCandidateStreamSynchronous(candidates[0], sessionId, skipCoverScaleSpring);
        };

        function startCandidateStreamSynchronous(candidateUrl, sessionId, skipCoverScaleSpring = false) {
            if (!candidateUrl || currentPlaySession !== sessionId) return;
            setBufferingState(true);

            audio.src = candidateUrl;
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    if (currentPlaySession !== sessionId) return;
                    setBufferingState(false);
                    acquireWakeLock();
                    setPlaybackState(true, skipCoverScaleSpring);
                    updateMediaPositionState();
                }).catch((err) => {
                    if (currentPlaySession !== sessionId) return;
                    if (err.name === 'AbortError') return;
                    tryNextStreamCandidate(sessionId, skipCoverScaleSpring);
                });
            }
        }

        function tryNextStreamCandidate(sessionId, skipCoverScaleSpring = false) {
            if (currentPlaySession !== sessionId || !activeTrack) return;
            const candidates = activeTrack._activeCandidates || [];
            activeCandidateIdx++;
            if (activeCandidateIdx < candidates.length) {
                startCandidateStreamSynchronous(candidates[activeCandidateIdx], sessionId, skipCoverScaleSpring);
            } else {
                setBufferingState(false);
                if (playbackQueue.length > 1) {
                    setTimeout(() => {
                        if (currentPlaySession === sessionId) playNextTrack(isPlayerOpen);
                    }, 400);
                }
            }
        }

        audio.addEventListener('error', () => {
            if (!userIntendedPlaying || !activeTrack) return;
            tryNextStreamCandidate(currentPlaySession, true);
        });

        audio.addEventListener('loadedmetadata', () => {
            if (!activeTrack) return;
            setBufferingState(false);
            if (audio.duration && isFinite(audio.duration) && audio.duration > 20) {
                activeTrack.duration = Math.round(audio.duration);
                const cacheKey = getLyricsCacheKey(activeTrack);
                if (lyricsCache.has(cacheKey)) {
                    applyLoadedLyricsPayload(lyricsCache.get(cacheKey), false);
                }
            }
            const savedTime = trackProgressCache.get(activeTrack.id) || 0;
            if (savedTime > 0 && audio.duration && savedTime < audio.duration - 4) {
                audio.currentTime = savedTime;
            }
            updateMediaPositionState();
        });

        audio.addEventListener('playing', () => {
            setBufferingState(false);
            setPlaybackState(true, true);
            engageOsBackgroundLock();
            updateMediaPositionState();
        });

        audio.addEventListener('waiting', () => {
            if (userIntendedPlaying) setBufferingState(true);
        });

        function updateMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: track.album || 'Muse',
                    artwork: [
                        { src: track.coverUrl, sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    userIntendedPlaying = true;
                    engageOsBackgroundLock();
                    if (signatureAudioCtx && signatureAudioCtx.state === 'suspended') {
                        signatureAudioCtx.resume().catch(() => {});
                    }
                    audio.play().catch(() => {});
                    setPlaybackState(true);
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    userIntendedPlaying = false;
                    releaseOsBackgroundLock();
                    audio.pause();
                    setPlaybackState(false);
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrevTrack(isPlayerOpen));
                navigator.mediaSession.setActionHandler('nexttrack', () => playNextTrack(isPlayerOpen));
                try {
                    navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                        const skipTime = details.seekOffset || 10;
                        audio.currentTime = Math.max(audio.currentTime - skipTime, 0);
                        updateMediaPositionState();
                    });
                    navigator.mediaSession.setActionHandler('seekforward', (details) => {
                        const skipTime = details.seekOffset || 10;
                        audio.currentTime = Math.min(audio.currentTime + skipTime, audio.duration || 0);
                        updateMediaPositionState();
                    });
                    navigator.mediaSession.setActionHandler('seekto', (details) => {
                        const target = details.seekTime ?? details.SeekTime;
                        if (target !== undefined && audio.duration) {
                            audio.currentTime = target;
                            updateMediaPositionState();
                        }
                    });
                } catch (e) {}
            }
        }

        function updatePlayerDisplays(track) {
            const fullTitle = document.getElementById('full-title');
            const fullArtist = document.getElementById('full-artist');
            const miniTitle = document.getElementById('mini-title');
            const miniArtist = document.getElementById('mini-artist');

            [fullTitle, fullArtist, miniTitle, miniArtist].forEach(el => el.classList.add('track-meta-changing'));

            setTimeout(() => {
                miniTitle.innerText = track.title;
                miniArtist.innerText = track.artist;
                fullTitle.innerText = track.title;
                fullArtist.innerText = track.artist;

                [fullTitle, fullArtist, miniTitle, miniArtist].forEach(el => el.classList.remove('track-meta-changing'));
            }, 60);

            document.getElementById('mini-cover').src = track.coverUrl;
            fullCoverImg.src = track.coverUrl;
            if (!isLyricsOpen) coverWrapper.style.opacity = '1';

            applyThemeColor(track.coverUrl);
            syncLikeButtonsUI();
            updateCatalogUI();
        }

        window.togglePlayPause = () => {
            requestAppFullscreen(false);
            if (!activeTrack && playbackQueue.length > 0) return playTrack(0);
            if (!activeTrack) return;

            initMuseSignatureSound();
            if (signatureAudioCtx && signatureAudioCtx.state === 'suspended') {
                signatureAudioCtx.resume().catch(() => {});
            }

            if (audio.paused) {
                userIntendedPlaying = true;
                engageOsBackgroundLock();
                audio.play().catch(() => {});
                acquireWakeLock();
                setPlaybackState(true);
            } else {
                userIntendedPlaying = false;
                releaseOsBackgroundLock();
                audio.pause();
                setPlaybackState(false);
            }
        };

        function setPlaybackState(playing, skipCoverSpring = false) {
            const miniIcon = document.getElementById('mini-play-icon');
            const fullIcon = document.getElementById('full-play-icon');

            if (playing) {
                miniIcon.className = "fa-solid fa-pause text-xs";
                fullIcon.className = "fa-solid fa-pause text-2xl md:text-3xl";
                startLyricsSyncLoop();
                startMuseBrandGradientLoop();
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            } else {
                miniIcon.className = "fa-solid fa-play text-xs ml-0.5";
                fullIcon.className = "fa-solid fa-play text-2xl md:text-3xl ml-1";
                startMuseBrandGradientLoop();
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            }

            const targetScale = playing ? 1.0 : 0.92;
            if (!skipCoverSpring && isPlayerOpen && !isLyricsOpen && !activeMorphCancel && !isGestureActive) {
                let initialScale = currentCoverRestScale;
                let initialVel = playing ? 1.5 : -1.4;
                if (activeCoverCancel) {
                    activeCoverCancel();
                    activeCoverCancel = null;
                }
                coverWrapper.style.opacity = '1';
                activeCoverCancel = animateSpring({
                    from: initialScale,
                    to: targetScale,
                    velocity: initialVel,
                    stiffness: 340,
                    damping: 24,
                    onUpdate: (s) => {
                        currentCoverRestScale = s;
                        coverWrapper.style.transform = `translate3d(0, 0, 0) scale3d(${s.toFixed(4)}, ${s.toFixed(4)}, 1)`;
                    },
                    onComplete: () => {
                        currentCoverRestScale = targetScale;
                        activeCoverCancel = null;
                    }
                });
            } else {
                currentCoverRestScale = targetScale;
            }

            updateCatalogUI();
        }

        function animateReelsTrackSwitch(direction, nextIndex, startOffsetY = 0, startVelocity = 0) {
            if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }
            if (activeOutgoingCancel) { activeOutgoingCancel(); activeOutgoingCancel = null; }

            if (activeTrack && !isLyricsOpen) {
                outgoingImg.src = activeTrack.coverUrl;
                outgoingCard.style.visibility = 'visible';
                outgoingCard.style.opacity = '1';

                const exitEndY = direction > 0 ? -window.innerHeight * 0.72 : window.innerHeight * 0.72;
                const initialExitVel = startVelocity !== 0 ? startVelocity : -direction * 1100;

                activeOutgoingCancel = animateSpring({
                    from: startOffsetY,
                    to: exitEndY,
                    velocity: initialExitVel,
                    stiffness: 360,
                    damping: 30,
                    onUpdate: (y) => {
                        const progress = Math.min(1, Math.abs(y) / (window.innerHeight * 0.6));
                        const scale = Math.max(0.74, 1 - progress * 0.24);
                        outgoingCard.style.opacity = `${Math.max(0, 1 - progress * 1.2).toFixed(3)}`;
                        outgoingCard.style.transform = `translate3d(0, ${y.toFixed(1)}px, 0) scale3d(${scale.toFixed(3)}, ${scale.toFixed(3)}, 1)`;
                    },
                    onComplete: () => {
                        outgoingCard.style.opacity = '0';
                        outgoingCard.style.visibility = 'hidden';
                        outgoingCard.style.transform = '';
                        activeOutgoingCancel = null;
                    }
                });
            }

            playTrack(nextIndex, true, true);

            if (isLyricsOpen) return;

            const enterStartY = direction > 0 ? window.innerHeight * 0.72 : -window.innerHeight * 0.72;
            const enterInitialVel = startVelocity !== 0 ? startVelocity * 0.45 : -direction * 960;

            activeCoverCancel = animateSpring({
                from: enterStartY,
                to: 0,
                velocity: enterInitialVel,
                stiffness: 340,
                damping: 26,
                onUpdate: (y, v) => {
                    liveCoverState = { position: y, velocity: v };
                    const progress = Math.min(1, Math.abs(y) / (window.innerHeight * 0.62));
                    const scale = Math.max(0.78, Math.min(1.04, 1 - progress * 0.2));
                    coverWrapper.style.opacity = `${Math.min(1, 1.2 - progress * 0.9).toFixed(3)}`;
                    coverWrapper.style.transform = `translate3d(0, ${y.toFixed(1)}px, 0) scale3d(${scale.toFixed(4)}, ${scale.toFixed(4)}, 1)`;
                },
                onComplete: () => {
                    liveCoverState = { position: 0, velocity: 0 };
                    coverWrapper.style.opacity = '1';
                    currentCoverRestScale = 1.0;
                    coverWrapper.style.transform = 'translate3d(0, 0, 0) scale3d(1, 1, 1)';
                    activeCoverCancel = null;
                }
            });
        }

        window.playNextTrack = (animate = false, startOffsetY = 0, startVelocity = 0) => {
            if (!playbackQueue.length) return;
            const nextIndex = (currentTrackIndex + 1) % playbackQueue.length;

            if (animate && isPlayerOpen && !document.hidden) {
                animateReelsTrackSwitch(1, nextIndex, startOffsetY, startVelocity);
            } else {
                playTrack(nextIndex, true);
            }
        };

        window.playPrevTrack = (animate = false, startOffsetY = 0, startVelocity = 0) => {
            if (!playbackQueue.length) return;
            const prevIndex = (currentTrackIndex - 1 + playbackQueue.length) % playbackQueue.length;

            if (animate && isPlayerOpen && !document.hidden) {
                animateReelsTrackSwitch(-1, prevIndex, startOffsetY, startVelocity);
            } else {
                playTrack(prevIndex, true);
            }
        };

        let isDraggingSlider = false;
        const scrubberHitZone = document.getElementById('scrubber-hit-zone');
        const currTimeEl = document.getElementById('full-current-time');
        const remTimeEl = document.getElementById('full-remaining-time');

        function updateScrubberFromClientX(clientX, commitAudio = false) {
            const rect = scrubberHitZone.getBoundingClientRect();
            if (rect.width <= 0) return;
            const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            fullProgress.value = pct;
            fullProgress.style.setProperty('--progress', `${pct}%`);
            miniProgressBar.style.setProperty('--progress', `${pct}%`);

            if (audio.duration) {
                const previewTime = (pct / 100) * audio.duration;
                currTimeEl.innerText = formatMinutes(previewTime);
                remTimeEl.innerText = "-" + formatMinutes(Math.max(0, audio.duration - previewTime));
                if (commitAudio) {
                    userScrollingLyricsUntil = 0;
                    audio.currentTime = previewTime;
                    syncLyricsToCurrentTime(true);
                    updateMediaPositionState();
                }
            }
        }

        scrubberHitZone.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            isDraggingSlider = true;
            scrubberHitZone.classList.add('scrubbing');
            currTimeEl.classList.add('text-white');
            remTimeEl.classList.add('text-white');
            try {
                scrubberHitZone.setPointerCapture(e.pointerId);
            } catch (err) {}
            updateScrubberFromClientX(e.clientX, false);
        });

        scrubberHitZone.addEventListener('pointermove', (e) => {
            if (!isDraggingSlider) return;
            e.stopPropagation();
            updateScrubberFromClientX(e.clientX, false);
        });

        const finishCustomScrub = (e) => {
            if (!isDraggingSlider) return;
            if (e) e.stopPropagation();
            isDraggingSlider = false;
            scrubberHitZone.classList.remove('scrubbing');
            currTimeEl.classList.remove('text-white');
            remTimeEl.classList.remove('text-white');
            if (e && typeof e.clientX === 'number') {
                updateScrubberFromClientX(e.clientX, true);
            }
        };

        scrubberHitZone.addEventListener('pointerup', finishCustomScrub);
        scrubberHitZone.addEventListener('pointercancel', finishCustomScrub);
        scrubberHitZone.addEventListener('lostpointercapture', finishCustomScrub);
        scrubberHitZone.addEventListener('touchend', () => {
            scrubberHitZone.classList.remove('scrubbing');
            isDraggingSlider = false;
        }, { passive: true });

        let lastPositionUpdateSec = -1;
        let hasPrewarmedNextOnThisTrack = false;

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;

            if (!isDraggingSlider) {
                const pct = (audio.currentTime / audio.duration) * 100;
                fullProgress.value = pct;
                fullProgress.style.setProperty('--progress', `${pct}%`);
                miniProgressBar.style.setProperty('--progress', `${pct}%`);
                currTimeEl.innerText = formatMinutes(audio.currentTime);
                remTimeEl.innerText = "-" + formatMinutes(Math.max(0, audio.duration - audio.currentTime));
            }

            // Pre-warm next track stream when 20 seconds remain so background transition is zero-latency
            const rem = audio.duration - audio.currentTime;
            if (rem < 20 && rem > 1 && !hasPrewarmedNextOnThisTrack && playbackQueue.length > 1) {
                hasPrewarmedNextOnThisTrack = true;
                const nextTrack = playbackQueue[(currentTrackIndex + 1) % playbackQueue.length];
                if (nextTrack) resolveAndPrewarmTrack(nextTrack);
            } else if (rem >= 22) {
                hasPrewarmedNextOnThisTrack = false;
            }

            const wholeSec = Math.floor(audio.currentTime);
            if (wholeSec !== lastPositionUpdateSec) {
                lastPositionUpdateSec = wholeSec;
                updateMediaPositionState();
            }

            if (isPlayerOpen && isLyricsOpen && activeLyricsTimeline.length > 0 && !document.hidden) {
                syncLyricsToCurrentTime(false);
            }
        });

        audio.addEventListener('ended', () => {
            if (activeTrack) trackProgressCache.set(activeTrack.id, 0);
            hasPrewarmedNextOnThisTrack = false;
            engageOsBackgroundLock();
            playNextTrack(isPlayerOpen && !document.hidden);
        });

        audio.addEventListener('pause', () => {
            if (document.visibilityState === 'hidden' && userIntendedPlaying && !audio.ended) {
                if (signatureAudioCtx && signatureAudioCtx.state === 'suspended') {
                    signatureAudioCtx.resume().catch(() => {});
                }
                audio.play().catch(() => {});
            }
        });

        function formatMinutes(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'Escape' && isPlayerOpen) {
                if (isLyricsOpen) {
                    setLyricsPanelState(false);
                } else {
                    closeFullscreenPlayer();
                }
            }
        });
    </script>
</body>
</html>
