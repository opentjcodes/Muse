        async function performMusicSearch(queryText, isHomeFeed = false) {
            previousCatalogState = null;
            updateHeaderModeUI(false);
            showLoadingGridState(isHomeFeed ? queryText : `Searching "${queryText}"`);

            try {
                const songSearchUrl = `https://www.jiosaavn.com/api.php?__call=search.getResults&_format=json&_marker=0&api_version=4&ctx=web6dot0&n=28&p=1&q=${encodeURIComponent(queryText)}`;
                const albumSearchUrl = `https://www.jiosaavn.com/api.php?__call=search.getAlbumResults&_format=json&_marker=0&api_version=4&ctx=web6dot0&n=14&p=1&q=${encodeURIComponent(queryText)}`;

                const [songsRes, albumsRes] = await Promise.allSettled([
                    fetchViaWorkerJson(songSearchUrl),
                    fetchViaWorkerJson(albumSearchUrl)
                ]);

                const songs = [];
                const albums = [];

                if (songsRes.status === "fulfilled" && Array.isArray(songsRes.value?.results)) {
                    for (const s of songsRes.value.results) {
                        const norm = normalizeSaavnSong(s);
                        if (norm.streamUrl) resolvedSongCache.set(norm.id, norm);
                        songs.push(norm);
                    }
                }

                if (albumsRes.status === "fulfilled" && Array.isArray(albumsRes.value?.results)) {
                    for (const a of albumsRes.value.results) {
                        albums.push(normalizeSaavnAlbum(a));
                    }
                }

                if (songs.length === 0) {
                    const audiusUrl = `https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(queryText)}&app_name=OpenMuse`;
                    const audiusData = await fetchViaWorkerJson(audiusUrl);
                    for (const t of (audiusData?.data || []).slice(0, 18)) {
                        const directStream = `https://discoveryprovider.audius.co/v1/tracks/${t.id}/stream?app_name=OpenMuse`;
                        const streamWrapped = workerStreamUrl(directStream);
                        songs.push({
                            id: `audius_${t.id}`,
                            itemType: "song",
                            title: t.title || "Untitled",
                            artist: t.user?.name || "Artist",
                            album: "Audius",
                            duration: t.duration || 180,
                            genre: "OPENMUSE",
                            coverUrl: upgradeImageQuality(t.artwork?.["480x480"]),
                            streamUrl: streamWrapped,
                            cascadeUrls: [streamWrapped]
                        });
                    }
                }

                if (songs.length > 0) {
                    allTracks = songs;
                }

                displayedItems = [...songs, ...albums];
                renderCatalog(displayedItems);

            } catch (err) {
                document.getElementById('empty-state-title').innerText = "Connection Interrupted";
                document.getElementById('empty-state-desc').innerText = "Tap compass icon to reload.";
            }
        }

        window.openAlbumInsideApp = async (albumItem) => {
            if (!albumItem || !albumItem.id) return;

            if (!previousCatalogState) {
                previousCatalogState = {
                    items: [...displayedItems],
                    scrollTop: mainScrollView.scrollTop
                };

            updateHeaderModeUI(true);
            document.getElementById('album-inline-cover').src = albumItem.coverUrl || FALLBACK_COVER;
            document.getElementById('album-inline-title').innerText = albumItem.title;
            document.getElementById('album-inline-sub').innerText = albumItem.year
                ? `${albumItem.artist} • ${albumItem.year}`
                : albumItem.artist;

            showCatalogView();
            showLoadingGridState(albumItem.title);

            try {
                let rawSongs = [];
                try {
                    const workerAlbumRes = await fetch(`${WORKER_BASE}/album?id=${encodeURIComponent(albumItem.id)}`);
                    if (workerAlbumRes.ok) {
                        const wData = await workerAlbumRes.json();
                        rawSongs = wData?.songs || wData?.list || [];
                    }
                } catch (e) {}

                if (rawSongs.length === 0) {
                    const detailsUrl = `https://www.jiosaavn.com/api.php?__call=content.getAlbumDetails&_format=json&cc=in&_marker=0%3F_marker%3D0&albumid=${encodeURIComponent(albumItem.id)}`;
                    const albumData = await fetchViaWorkerJson(detailsUrl);
                    rawSongs = albumData?.songs || albumData?.list || [];
                }

                const albumTracks = rawSongs.map(s => {
                    const norm = normalizeSaavnSong(s);
                    if (!norm.album || norm.album === "OpenMuse") norm.album = albumItem.title;
                    if (norm.streamUrl) resolvedSongCache.set(norm.id, norm);
                    return norm;
                });

                if (albumTracks.length > 0) {
                    document.getElementById('album-inline-sub').innerText = `${albumItem.artist} • ${albumTracks.length} tracks`;
                    allTracks = albumTracks;
                    displayedItems = albumTracks;
                    renderCatalog(albumTracks, true);
                } else {

                renderCatalog(displayedItems);

        async function resolveTrackCascadeUrls(track) {
            if (!track) return [];
            if (Array.isArray(track.cascadeUrls) && track.cascadeUrls.length > 1) {
                return track.cascadeUrls;
            }
            if (resolvedSongCache.has(track.id)) {
                const cached = resolvedSongCache.get(track.id);
                if (cached.cascadeUrls?.length) {
                    track.cascadeUrls = cached.cascadeUrls;
                    track.streamUrl = cached.streamUrl;
                    return track.cascadeUrls;
                }
            }

            try {
                const detailsUrl = `https://www.jiosaavn.com/api.php?__call=song.getDetails&cc=in&_marker=0%3F_marker%3D0&_format=json&pids=${encodeURIComponent(track.id)}`;
                const data = await fetchViaWorkerJson(detailsUrl);
                const rawSong = data?.[track.id] || data?.songs?.[0] || Object.values(data || {})[0];
                if (rawSong) {
                    const norm = normalizeSaavnSong(rawSong);
                    track.cascadeUrls = norm.cascadeUrls;
                    track.streamUrl = norm.streamUrl;
                    if (!track.duration && norm.duration) track.duration = norm.duration;
                    resolvedSongCache.set(track.id, norm);
                    return norm.cascadeUrls;
                }
            } catch (e) {}

            const fallbackPlay = `${WORKER_BASE}/play?id=${encodeURIComponent(track.id)}&title=${encodeURIComponent(track.title || "")}&artist=${encodeURIComponent(track.artist || "")}`;
            return [track.streamUrl, fallbackPlay].filter(Boolean);
        }

        async function fetchAutoplayRecommendations(seedTrack) {
            if (!seedTrack || recoFetchInFlight || String(seedTrack.id).startsWith("audius_")) return;
            recoFetchInFlight = true;
            try {
                const res = await fetch(`${WORKER_BASE}/reco?id=${encodeURIComponent(seedTrack.id)}`);
                if (res.ok) {
                    const data = await res.json();
                    const existingIds = new Set(allTracks.map(t => t.id));
                    for (const s of (data?.songs || [])) {
                        const norm = normalizeSaavnSong(s);
                        if (!existingIds.has(norm.id)) {
                            existingIds.add(norm.id);
                            allTracks.push(norm);
                        }
                    }
                }
            } catch (e) {} finally {
                recoFetchInFlight = false;
            }
        }

        function prefetchAdjacentTracks(index) {
            if (allTracks.length <= 1) return;
            const nextIdx = (index + 1) % allTracks.length;
            const prevIdx = (index - 1 + allTracks.length) % allTracks.length;
            setTimeout(() => {
                resolveTrackCascadeUrls(allTracks[nextIdx]).catch(() => {});
                if (prevIdx !== nextIdx) {
                    resolveTrackCascadeUrls(allTracks[prevIdx]).catch(() => {});
                }
                if (index >= allTracks.length - 2) {
                    fetchAutoplayRecommendations(allTracks[index]);
                }
            }, 180);
        }

            const filtered = ignoreFilter
                ? items
                : items.filter(item => currentContentTypeFilter === 'all' || item.itemType === currentContentTypeFilter);
            
            if (filtered.length === 0) {
                document.getElementById('empty-state-title').innerText = "Nothing Here Yet";

                emptyState.classList.remove('hidden');

            }
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            filtered.forEach((item, idx) => {
                const isAlbum = item.itemType === 'album';
                const isActive = !isAlbum && activeTrack && activeTrack.id === item.id;
                const isPlaying = isActive && !audio.paused;

                const card = document.createElement('div');
                card.className = `group flex flex-col cursor-pointer catalog-item`;
                card.dataset.id = item.id;
                card.dataset.type = item.itemType || 'song';
                card.style.animationDelay = `${Math.min(idx * 0.03, 0.45)}s`;

                const badgeHtml = isAlbum
                    ? `<div class="absolute top-3 right-3 px-2.5 py-0.5 rounded-full liquid-glass text-[9px] font-extrabold uppercase tracking-[0.16em] text-white/90 border border-white/20">Album</div>`
                    : '';

                const hoverIconClass = isAlbum
                    ? 'fa-compact-disc'
                    : (isPlaying ? 'fa-pause' : 'fa-play ml-1');

                card.innerHTML = `
                    <div class="relative aspect-square w-full mb-3.5 card-image-wrapper ${isPlaying ? 'is-playing-card' : 'not-playing-card'}">
                        <img src="${item.coverUrl}" crossorigin="anonymous" loading="lazy" class="w-full h-full object-cover">
                        ${badgeHtml}
                        
                        <div class="card-eq-badge absolute bottom-3 left-3 px-2.5 py-1.5 rounded-full liquid-glass flex items-center gap-1.5 transition-all duration-300 ${isActive ? 'opacity-100 scale-100' : 'opacity-0 scale-75 pointer-events-none'}">
                            <div class="eq-bars ${isPlaying ? '' : 'paused-eq'}">
                                <span class="eq-bar"></span>
                                <span class="eq-bar"></span>
                                <span class="eq-bar"></span>
                            </div>
                        </div>

                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                            <div class="w-14 h-14 rounded-full liquid-control-btn liquid-hero-play flex items-center justify-center shadow-2xl">
                                <i class="fa-solid ${hoverIconClass} text-lg text-white play-icon"></i>
                            </div>
                        </div>
                    </div>
                    <h4 class="text-sm font-bold text-white truncate tracking-tight">${item.title}</h4>
                    <p class="text-xs font-medium text-metal-400 truncate mt-0.5">${isAlbum ? `Album • ${item.artist}` : item.artist}</p>
                `;

                const wrapper = card.querySelector('.card-image-wrapper');
                card.addEventListener('pointermove', (e) => {
                    if (e.pointerType !== 'mouse') return;
                    const rect = wrapper.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    wrapper.style.transform = `rotateX(${-y * 7}deg) rotateY(${x * 7}deg) translateY(-3px)`;
                });
                card.addEventListener('pointerleave', (e) => {
                    if (e.pointerType !== 'mouse') return;
                    wrapper.style.transform = '';
                });

                card.onclick = () => {
                    if (isAlbum) {
                        openAlbumInsideApp(item);
                    } else {
                        requestAppFullscreen();
                        const songList = displayedItems.filter(x => x.itemType !== 'album');
                        if (songList.length > 0) allTracks = songList;
                        const trackIdx = allTracks.findIndex(t => t.id === item.id);
                        if (trackIdx !== -1) {
                            playTrack(trackIdx);
                        } else {
                            allTracks.unshift(item);
                            playTrack(0);
                        }
                    }
                };
                container.appendChild(card);
            });

                    imgWrapper?.classList.add('not-playing-card');

        }

        async function tryLoadAudioCandidate(candidateUrl, sessionId) {
            return new Promise((resolve, reject) => {
                if (currentPlaySession !== sessionId) return reject(new Error("Cancelled"));
                audio.src = candidateUrl;
                audio.load();

                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error("Timeout"));
                }, 8500);

                const onReady = () => {
                    cleanup();
                    resolve(true);
                };
                const onErr = () => {
                    cleanup();
                    reject(new Error("MediaError"));
                };
                const cleanup = () => {
                    clearTimeout(timer);
                    audio.removeEventListener('loadedmetadata', onReady);
                    audio.removeEventListener('canplay', onReady);
                    audio.removeEventListener('error', onErr);
                };

                audio.addEventListener('loadedmetadata', onReady, { once: true });
                audio.addEventListener('canplay', onReady, { once: true });
                audio.addEventListener('error', onErr, { once: true });
            });
        }

        window.playTrack = async (index, forceReplay = false, skipCoverScaleSpring = false) => {
            if (index < 0 || index >= allTracks.length) return;
            
            if (activeTrack && currentTrackIndex !== index) {
                const timeLeft = audio.duration - audio.currentTime;
                if (timeLeft > 5 && audio.currentTime > 2) {
                    trackProgressCache.set(activeTrack.id, audio.currentTime);
                } else {
                    trackProgressCache.set(activeTrack.id, 0);
                }
            }

            if (!forceReplay && currentTrackIndex === index && activeTrack) {
                if (audio.ended) {
                    audio.currentTime = 0;
                    audio.play();
                    setPlaybackState(true, skipCoverScaleSpring);
                    return;
                }
                return togglePlayPause();
            }

            const sessionId = ++currentPlaySession;

            initSpatialAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            currentTrackIndex = index;
            activeTrack = allTracks[index];
            
            audio.pause();
            setPlaybackState(false, true);
            
            updatePlayerDisplays(activeTrack);
            updateMediaSession(activeTrack);
            loadLyricsForTrack(activeTrack);

            prefetchAdjacentTracks(index);
            setBufferingState(true);

            try {
                const candidates = await resolveTrackCascadeUrls(activeTrack);
                if (currentPlaySession !== sessionId) return;

                let loadedOk = false;
                for (const candidateUrl of candidates) {
                    if (currentPlaySession !== sessionId) return;
                    try {
                        await tryLoadAudioCandidate(candidateUrl, sessionId);
                        loadedOk = true;
                        break;
                    } catch (e) {}
                }

                if (!loadedOk) {
                    const searchFallback = `${ activeTrack.title } ${ activeTrack.artist.split(",")[0] }`.trim();
                    const audiusUrl = `https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(searchFallback)}&app_name=OpenMuse`;
                    const audiusData = await fetchViaWorkerJson(audiusUrl);
                    const firstHit = audiusData?.data?.[0];
                    if (firstHit?.id) {
                        const fallbackStream = workerStreamUrl(`https://discoveryprovider.audius.co/v1/tracks/${firstHit.id}/stream?app_name=OpenMuse`);
                        await tryLoadAudioCandidate(fallbackStream, sessionId);
                        loadedOk = true;
                    }
                }

                if (!loadedOk || currentPlaySession !== sessionId) {
                    throw new Error("All stream candidates failed");
                }

                const savedTime = trackProgressCache.get(activeTrack.id) || 0;
                if (savedTime > 0 && audio.duration && savedTime < audio.duration - 4) {
                    audio.currentTime = savedTime;
                }
                const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
                fullProgress.value = pct;
                fullProgress.style.setProperty('--progress', `${pct}%`);
                miniProgressBar.style.setProperty('--progress', `${pct}%`);

                setBufferingState(false);

                if (masterGainNode && audioCtx) {
                    masterGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
                    masterGainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
                    masterGainNode.gain.exponentialRampToValueAtTime(0.94, audioCtx.currentTime + 0.1);
                }

                await audio.play();
                setPlaybackState(true, skipCoverScaleSpring);
            } catch (err) {
                if (currentPlaySession === sessionId) {
                    setBufferingState(false);
                    toast("Skipping unavailable track...", "error");
                    setPlaybackState(false, true);
                    if (allTracks.length > 1) {
                        setTimeout(() => {
                            if (currentPlaySession === sessionId) playNextTrack(isPlayerOpen);
                        }, 650);
                    }
                }
            }
        };

        function updateMediaSession(track) {
            if ('mediaSession' in navigator) {
                const albumStatus = isShuffleMode
                    ? `🔀 Shuffle Play • ${track.album || 'OpenMuse'}`
                    : (track.album || 'OpenMuse');

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: albumStatus,
                    artwork: [{ src: track.coverUrl, sizes: '500x500', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', togglePlayPause);
                navigator.mediaSession.setActionHandler('pause', togglePlayPause);
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrevTrack(true));
                navigator.mediaSession.setActionHandler('nexttrack', () => playNextTrack(true));

                try {
                    navigator.mediaSession.setActionHandler('seekforward', () => {
                        if (!isShuffleMode) {
                            window.toggleShuffleMode(true);
                        } else {
                            playNextTrack(isPlayerOpen);
                        }
                    });
                    navigator.mediaSession.setActionHandler('seekbackward', () => {
                        window.toggleShuffleMode(false);
                    });
                } catch (e) {}
            }
        }

        function updatePlayerDisplays(track) {
            const fullTitle = document.getElementById('full-title');
            const fullArtist = document.getElementById('full-artist');
            const miniTitle = document.getElementById('mini-title');
            const miniArtist = document.getElementById('mini-artist');

            [fullTitle, fullArtist, miniTitle, miniArtist].forEach(el => el.classList.add('track-meta-changing'));

            setTimeout(() => {
                miniTitle.innerText = track.title;
                miniArtist.innerText = track.artist;
                fullTitle.innerText = track.title;
                fullArtist.innerText = track.artist;
                document.getElementById('full-now-playing-genre').innerText = track.album || track.genre || "OPENMUSE";

                [fullTitle, fullArtist, miniTitle, miniArtist].forEach(el => el.classList.remove('track-meta-changing'));
            }, 85);

            document.getElementById('mini-cover').src = track.coverUrl;
            fullCoverImg.src = track.coverUrl;
            document.getElementById('fullscreen-ambient-img').src = track.coverUrl;
            if (!isLyricsOpen) coverWrapper.style.opacity = '1';
            
            applyThemeColor(track.coverUrl);
            updateCatalogUI();
        }

        window.togglePlayPause = () => {
            if (!activeTrack && allTracks.length > 0) return playTrack(0);
            if (!activeTrack) return;
            
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            if (audio.paused) {
                if (masterGainNode && audioCtx) {
                    masterGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
                    masterGainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
                    masterGainNode.gain.exponentialRampToValueAtTime(0.94, audioCtx.currentTime + 0.1);
                }
                audio.play();
                setPlaybackState(true);
            } else {
                audio.pause();
                setPlaybackState(false);
            }
        };

        function setPlaybackState(playing, skipCoverSpring = false) {
            const miniIcon = document.getElementById('mini-play-icon');
            const fullIcon = document.getElementById('full-play-icon');

            if (playing) {
                miniIcon.className = "fa-solid fa-pause text-sm";
                fullIcon.className = "fa-solid fa-pause text-2xl md:text-3xl";
                startAudioReactiveLoop();
                startLyricsSyncLoop();
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            } else {
                miniIcon.className = "fa-solid fa-play text-sm ml-0.5";
                fullIcon.className = "fa-solid fa-play text-2xl md:text-3xl ml-1";
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            }

            const targetScale = playing ? 1.0 : 0.92;
            if (!skipCoverSpring && isPlayerOpen && !isLyricsOpen && !activeMorphCancel && !isGestureActive) {
                let initialScale = currentCoverRestScale;
                let initialVel = playing ? 1.6 : -1.4;
                if (activeCoverCancel) {
                    activeCoverCancel();
                    activeCoverCancel = null;
                }
                coverWrapper.style.opacity = '1';
                activeCoverCancel = animateSpring({
                    from: initialScale,
                    to: targetScale,
                    velocity: initialVel,
                    stiffness: 260,
                    damping: 16,
                    onUpdate: (s) => {
                        currentCoverRestScale = s;
                        coverWrapper.style.transform = `translate3d(0, 0, 0) scale(${s.toFixed(4)})`;
                    },
                    onComplete: () => {
                        currentCoverRestScale = targetScale;
                        activeCoverCancel = null;
                    }
                });
            } else {
                currentCoverRestScale = targetScale;
            }

            updateCatalogUI();
        }

        function animateReelsTrackSwitch(direction, nextIndex, startOffsetY = 0, startVelocity = 0) {
            if (activeCoverCancel) { activeCoverCancel(); activeCoverCancel = null; }
            if (activeOutgoingCancel) { activeOutgoingCancel(); activeOutgoingCancel = null; }

            if (activeTrack && !isLyricsOpen) {
                outgoingImg.src = activeTrack.coverUrl;
                outgoingCard.style.visibility = 'visible';
                outgoingCard.style.opacity = '1';

                const exitEndY = direction > 0 ? -window.innerHeight * 0.78 : window.innerHeight * 0.78;
                const initialExitVel = startVelocity !== 0 ? startVelocity : -direction * 1150;

                activeOutgoingCancel = animateSpring({
                    from: startOffsetY,
                    to: exitEndY,
                    velocity: initialExitVel,
                    stiffness: 310,
                    damping: 26,
                    onUpdate: (y) => {
                        const progress = Math.min(1, Math.abs(y) / (window.innerHeight * 0.62));
                        const scale = Math.max(0.68, 1 - progress * 0.28);
                        const wheelAngle = Math.max(-36, Math.min(36, -y / 10));
                        outgoingCard.style.opacity = `${Math.max(0, 1 - progress * 1.15).toFixed(3)}`;
                        outgoingCard.style.transform = `translate3d(0, ${y.toFixed(1)}px, ${(-progress * 120).toFixed(1)}px) scale(${scale.toFixed(3)}) rotateX(${wheelAngle.toFixed(2)}deg)`;
                    },
                    onComplete: () => {
                        outgoingCard.style.opacity = '0';
                        outgoingCard.style.visibility = 'hidden';
                        outgoingCard.style.transform = '';
                        activeOutgoingCancel = null;
                    }
                });
            }

            playTrack(nextIndex, true, true);

            if (isLyricsOpen) return;

            const enterStartY = direction > 0 ? window.innerHeight * 0.76 : -window.innerHeight * 0.76;
            const enterInitialVel = startVelocity !== 0 ? startVelocity * 0.45 : -direction * 980;

            activeCoverCancel = animateSpring({
                from: enterStartY,
                to: 0,
                velocity: enterInitialVel,
                stiffness: 265,
                damping: 19,
                onUpdate: (y, v) => {
                    liveCoverState = { position: y, velocity: v };
                    const progress = Math.min(1, Math.abs(y) / (window.innerHeight * 0.65));
                    const scale = Math.max(0.74, Math.min(1.06, 1 - progress * 0.24));
                    const wheelAngle = Math.max(-34, Math.min(34, -y / 11));
                    coverWrapper.style.opacity = `${Math.min(1, 1.25 - progress * 0.95).toFixed(3)}`;
                    coverWrapper.style.transform = `translate3d(0, ${y.toFixed(1)}px, ${(-progress * 110).toFixed(1)}px) scale(${scale.toFixed(4)}) rotateX(${wheelAngle.toFixed(2)}deg)`;
                },
                onComplete: () => {
                    liveCoverState = { position: 0, velocity: 0 };
                    coverWrapper.style.opacity = '1';
                    currentCoverRestScale = 1.0;
                    coverWrapper.style.transform = 'translate3d(0, 0, 0) scale(1)';
                    activeCoverCancel = null;
                }
            });
        }

        window.playNextTrack = (animate = false, startOffsetY = 0, startVelocity = 0) => {
            if (!allTracks.length) return;
            const nextIndex = isShuffleMode
                ? getNextShuffledIndex()
                : (currentTrackIndex + 1) % allTracks.length;

            if (animate && isPlayerOpen) {
                animateReelsTrackSwitch(1, nextIndex, startOffsetY, startVelocity);
            } else {
                playTrack(nextIndex, true);
            }
        };

        window.playPrevTrack = (animate = false, startOffsetY = 0, startVelocity = 0) => {
            if (!allTracks.length) return;
            const prevIndex = isShuffleMode
                ? getNextShuffledIndex()
                : (currentTrackIndex - 1 + allTracks.length) % allTracks.length;

            if (animate && isPlayerOpen) {
                animateReelsTrackSwitch(-1, prevIndex, startOffsetY, startVelocity);
            } else {
                playTrack(prevIndex, true);
            }
        };

        let isDraggingSlider = false;
        const scrubberHitZone = document.getElementById('scrubber-hit-zone');
        const currTimeEl = document.getElementById('full-current-time');
        const remTimeEl = document.getElementById('full-remaining-time');

        function updateScrubberFromClientX(clientX, commitAudio = false) {
            const rect = scrubberHitZone.getBoundingClientRect();
            if (rect.width <= 0) return;
            const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            fullProgress.value = pct;
            fullProgress.style.setProperty('--progress', `${pct}%`);
            miniProgressBar.style.setProperty('--progress', `${pct}%`);

            if (audio.duration) {
                const previewTime = (pct / 100) * audio.duration;
                currTimeEl.innerText = formatMinutes(previewTime);
                remTimeEl.innerText = "-" + formatMinutes(Math.max(0, audio.duration - previewTime));
                if (commitAudio) {
                    userScrollingLyricsUntil = 0;
                    audio.currentTime = previewTime;
                    syncLyricsToCurrentTime(true);
                }
            }
        }

        scrubberHitZone.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            isDraggingSlider = true;
            scrubberHitZone.classList.add('scrubbing');
            currTimeEl.classList.add('text-white', 'scale-105');
            remTimeEl.classList.add('text-white', 'scale-105');
            scrubberHitZone.setPointerCapture(e.pointerId);
            updateScrubberFromClientX(e.clientX, false);
        });

        scrubberHitZone.addEventListener('pointermove', (e) => {
            if (!isDraggingSlider) return;
            e.stopPropagation();
            updateScrubberFromClientX(e.clientX, false);
        });

        const finishCustomScrub = (e) => {
            if (!isDraggingSlider) return;
            e.stopPropagation();
            isDraggingSlider = false;
            scrubberHitZone.classList.remove('scrubbing');
            currTimeEl.classList.remove('text-white', 'scale-105');
            remTimeEl.classList.remove('text-white', 'scale-105');
            updateScrubberFromClientX(e.clientX, true);
        };

        scrubberHitZone.addEventListener('pointerup', finishCustomScrub);
        scrubberHitZone.addEventListener('pointercancel', finishCustomScrub);

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            
            if (!isDraggingSlider) {
                const pct = (audio.currentTime / audio.duration) * 100;
                fullProgress.value = pct;
                fullProgress.style.setProperty('--progress', `${pct}%`);
                miniProgressBar.style.setProperty('--progress', `${pct}%`);
                currTimeEl.innerText = formatMinutes(audio.currentTime);
                remTimeEl.innerText = "-" + formatMinutes(Math.max(0, audio.duration - audio.currentTime));
            }
            if (isPlayerOpen && activeLyricsTimeline.length > 0) {
                syncLyricsToCurrentTime(false);
            }
        });

        audio.addEventListener('ended', () => { 
            if (activeTrack) trackProgressCache.set(activeTrack.id, 0);
            playNextTrack(true);
        });

        function formatMinutes(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'Escape' && isPlayerOpen) {
                if (isLyricsOpen) {
                    setLyricsPanelState(false);
                } else {
                    closeFullscreenPlayer();
                }
            }
        });
    </script>
</body>
